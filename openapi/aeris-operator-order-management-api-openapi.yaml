  /orders/{id}/actions:
    post:
      tags:
        - Order management
      summary: Post actions on order
      description: |
        Post actions on order to trigger the order flow moving forward.
        <ul>
        <li>SUBMIT: Submit an order for approval or implmentation</li>
        <li>CANCEL: Cancel an order</li>
        <li>APPROVE: Approve an order</li>
        <li>REJECT: Reject an order</li>
        <li>ACCEPT_VERIFICATION: Customers accept the verification when the implementation is done. The order will be closed successfully</li>
        <li>REJECT_VERIFICATION: Customers reject the verification when the implementation is done. The problems will be addressed and fixed by the operation team</li>
        </ul>
      operationId: postOrderActionById
      parameters:
        - name: id
          in: path
          description: the id of order
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostActionsRequest'
            examples:
              Submit order:
                value:
                  action: SUBMIT
              Cancel order:
                value:
                  action: CANCEL
              Approve order:
                value:
                  action: APPROVE
                  comments: OK
              Reject order:
                value:
                  action: REJECT
                  comments: Something wrong
              Accept verification:
                value:
                  action: ACCEPT_VERIFICATION
                  comments: OK
              Reject verification:
                value:
                  action: REJECT_VERIFICATION
                  comments: Something wrong
      responses:
        "204":
          description: No Content
          allOf:
            - $ref: '#/components/responses/RateLimitedResponse'
        "400":
          description: Bad Request
          headers:
            Content-Type:

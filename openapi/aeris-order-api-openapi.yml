components:
  schemas:
    SIMSpecification:
      type: object
      properties:
        simSpecificationId:
          type: string
          description: ID of the specification is used as reference in SIM order data.
        minimumOrderVolume:
          type: integer
          description: The minimum number of subscriptions that can be ordered for this specification.
          format: int32
        orderIncrement:
          type: integer
          description: The amount of subscriptions ordered must be a multiple of order increment.
          format: int32
        lowOrderThreshold:
          type: integer
          description: An order for less subscriptions than threshold may cause a one-time low order fee.
          format: int32
        earliestDeliveryDate:
          type: string
          description: The earliest possible delivery date for an order according to this specification. ISO8601 date.
          format: date
        description:
          type: string
          description: Description of the specification.
        operatorId:
          type: string
          description: Corresponding operator ID for this specification.
        numberSchemeId:
          type: string
          description: Number scheme collects the relevant number pools when appropriate.
        numberSchemeName:
          type: string
        networkResourceGroupId:
          type: integer
          description: The network resource group id of the SIM specification.
          format: int64
        networkResourceGroupName:
          type: string
          description: Name of the network resource group.
        msisdnPools:
          type: array
          description: MSISDN pools usable with this specification. In case the list empty specifying a pool is unnecessary.
          items:
            $ref: '#/components/schemas/MSISDNPool'
      description: SIM specification data required for making a SIM order.
    ServiceContract:
      type: object
      properties:
        serviceContractId:
          type: string
          description: Internal ID of the service contract.
        name:
          type: string
          description: Name is used as reference in SIM order data.
        description:
          type: string
          description: Description of the service contract.
        subscriptionPackages:
          type: array
          description: Possible subscription packages usable with this service contract.
          items:
            $ref: '#/components/schemas/SubscriptionPackage'
      description: Service contract data required for making a SIM order.
    SIMStockOrderMetadataResponse:
      type: object
      properties:
        simSpecifications:
          type: array
          description: List of possible SIM specifications.
          items:
            $ref: '#/components/schemas/SIMSpecification'
      description: Contains the data set required for populating a SIM Stock Order correctly.
    EuiccStockOrder:
      required:
      - contactEmail
      - contactName
      - contactPhone
      - deliveryAddress
      - formSpecification
      - operatorId
      - packageMarkings
      - preferredDeliveryDate
      - quantity
      type: object
      properties:
        preferredDeliveryDate:
          type: string
          format: date
        deliveryAddress:
          type: string
          description: Delivery address to use for the order.
        quantity:
          type: integer
          description: Quantity of subscriptions ordered.
          format: int32
        contactName:
          type: string
        contactEmail:
          type: string
        contactPhone:
          type: string
        profileSpecification:
          type: string
          description: The profile specification to use for the order.
        formSpecification:
          type: string
          description: The profile specification to use for the order.
        operatorId:
          type: string
          description: Operator for which the order is made.
        packageMarkings:
          type: string
        poolShortName:
          type: string
          description: Short name of the MSISDN pool to use when required by profile specification.
      description: Euicc Stock Order Request Model
    SubscriptionProfileStockOrder:
      required:
      - contactEmail
      - contactName
      - contactPhone
      - operatorId
      - profileSpecification
      - quantity
      type: object
      properties:
        profileSpecification:
          type: string
          description: The profile specification to use for the order.
        quantity:
          type: integer
          description: Quantity of subscription profiles ordered.
          format: int32
        operatorId:
          type: string
          description: Operator for the subscription profiles.
        contactName:
          type: string
        contactEmail:
          type: string
        contactPhone:
          type: string
        poolShortName:
          type: string
          description: Short name of the MSISDN pool to use when required by profile specification.
      description: Subscription Profile Stock Order Request Model
    EuiccOrder:
      required:
      - contactEmail
      - contactName
      - contactPhone
      - deliveryAddress
      - euiccAgreement
      - initialState
      - organizationId
      - packageMarkings
      - preferredDeliveryDate
      - quantity
      type: object
      properties:
        preferredDeliveryDate:
          type: string
          format: date
        deliveryAddress:
          type: string
          description: Delivery address to use for the order.
        quantity:
          type: integer
          description: Quantity of subscriptions ordered.
          format: int32
        contactName:
          type: string
        contactEmail:
          type: string
        contactPhone:
          type: string
        initialState:
          type: string
          description: Initial state for the subscriptions. Must be Active.
          enum:
          - Active
          - Deactivated
        profileSpecification:
          type: string
          description: The profile specification to use for the order.
        euiccAgreement:
          type: string
          description: The euiccAgreement to use for the order.
        subscriptionPackage:
          type: string
          description: Subscription package for the ordered subscriptions. The subscription package must be also active.
        organizationId:
          type: string
          description: Organization for which the order is made.
        packageMarkings:
          type: string
        poolShortName:
          type: string
          description: Short name of the MSISDN pool to use when required by profile specification.
      description: Euicc Order Request Model
    OrderReference:
      type: object
      properties:
        companyId:
          type: string
        requestId:
          type: string
    Error:
      required:
      - code
      - httpStatus
      - message
      type: object
      properties:
        code:
          type: integer
          description: Error code
          format: int32
          example: 2040
        httpStatus:
          type: integer
          description: Response HTTP status
          format: int32
          example: 401
        message:
          type: string
          description: Error message
          example: Request validation failed
        detailedMessage:
          type: string
          description: Detailed error message
          example: Could not parse JSON body. Optional, This attribute will not be included in the response if the message is empty.
      description: Error response model
    SimOrderResponse:
      required:
      - jobId
      type: object
      properties:
        jobId:
          type: string
          description: Request ID for a successful order.
        resultCode:
          type: string
        errorCode:
          type: string
      description: SIM Order Response
    SIMStockOrder:
      required:
      - companyId
      - contactEmail
      - contactName
      - contactPhone
      - deliveryAddress
      - packageMarkings
      - preferredDeliveryDate
      - quantity
      - simSpecification
      type: object
      properties:
        quantity:
          type: integer
          description: Quantity of subscriptions ordered.
          format: int32
        preferredDeliveryDate:
          type: string
          format: date
        companyId:
          type: string
          description: Company for which the subscriptions are ordered.
        deliveryAddress:
          type: string
          description: Delivery address to use for the order.
        packageMarkings:
          type: string
        simSpecification:
          type: string
          description: SIM specification to use for the order.
        contactName:
          type: string
        contactEmail:
          type: string
        contactPhone:
          type: string

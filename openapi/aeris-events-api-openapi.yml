    ErrorResponse:
      type: object
      properties:
        type:
          type: string
          format: uri
          description: 'An absolute URI that identifies the problem type. When dereferenced,it SHOULD provide

            human-readable documentation for the problem type (e.g., using HTML).

            '
          example: http://www.w3.org/Protocols/rfc2616/rfc2616-sec10.html#sec10.5.4
        title:
          type: string
          description: 'A short, summary of the problem type. Written in english and readable for engineers (usually not suited

            for non technical stakeholders and not localized.

            '
          example: Service Unavailable
        status:
          type: integer
          format: int32
          description: The HTTP status code generated by the origin server for this occurrence of the problem.
          minimum: 100
          example: 503
          exclusiveMaximum: 600
        detail:
          type: string
          description: A human readable explanation specific to this occurrence of the problem.
          example: Connection to database timed out.
        instance:
          type: string
          description: An absolute URI that identifies the specific occurrence of the problem. It may or may not yield further information if dereferenced.
          example: https://api.documentation.url/request-id
        parameters:
          type: object
          additionalProperties:
            type: string
    529Response:
      allOf:
      - $ref: '#/components/schemas/ErrorResponse'
      - type: object
        properties:
          title:
            example: Service Overloaded
          status:
            example: 529
    503Response:
      allOf:
      - $ref: '#/components/schemas/ErrorResponse'
      - type: object
        properties:
          title:
            example: Service Unavailable
          status:
            example: 503
    Event_2:
      type: object
      properties:
        eventId:
          $ref: '#/components/schemas/EventId'
        eventTime:
          $ref: '#/components/schemas/dateTime'
        category:
          description: Category of the Event (example, Billing Events, Security Events etc)
          type: string
          example: Security
        type:
          description: Type of the Event
          type: string
          example: Sim Fraud
        severity:
          $ref: '#/components/schemas/EventSeverity'
        status:
          $ref: '#/components/schemas/EventStatus'
        statusReason:
          type: string
          description: Additional Reasoning about status/status change.
        description:
          description: Description about the Event
          type: string
          example: IMEI change, TAC change, minimal change in data consumption.
        eventTypeDescription:
          description: Description about the Event type.
          type: string
          example: Detected anomalous communication(s).
        notes:
          description: Notes entered by a human user while taking an action on Event.
          type: string
        iccid:
          $ref: '#/components/schemas/iccid'
        imsi:
          $ref: '#/components/schemas/imsi'
        deviceProfileId:
          $ref: '#/components/schemas/deviceProfileId'
        productId:
          description: Product Id associated with the device.
          type: integer
          format: int32
          example: 41
        eventConfigId:
          type: integer
          description: Event Config Id
          example: 134242
        lastActionTime:
          $ref: '#/components/schemas/dateTime'
        lastActionUser:
          description: User who took some action on this Event.
          type: string
          format: email
          example: john.doe@example.com
        eventSource:
          type: string
          description: Source system of this Event
          example: Security Center
        context:
          type: object
          description: Context of Event. This is specific to each type of Event.
          additionalProperties: true
        deviceIp:
          $ref: '#/components/schemas/ip'
        devicePort:
          $ref: '#/components/schemas/port'
        serverIp:
          $ref: '#/components/schemas/ip'
        serverPort:
          $ref: '#/components/schemas/port'
        serverFqdn:
          $ref: '#/components/schemas/domain'
        deviceName:
          description: Name of the device.
          type: string
          maxLength: 30
          example: Lawn Mower 007
        eventTypeId:
          description: Event Type Id
          type: integer
          example: 5
        severityId:
          description: Severity Id. Lower values means higher severity.
          type: integer
          example: 5
        confidenceLevel:
          description: Indicates the system's certainty about the accuracy of the detected event.
          type: string
          example: 85
        threatClass:
          description: Categorizes the type of threat.
          type: string
          example: APT
        threatLevel:
          description: Shows the severity of the identified threat.
          type: integer
          example: 100
        threatDiagnostic:
          description: Provides detailed analysis and detection information of the threat.
          type: string
          example: The threat diagnostic identifies unusual login attempts from multiple locations.
        protectionLevel:
          description: This column will store the protection level with possible values.
          type: string
          example: Essential, Aggressive, Comprehensive.
        requestId:
          description: This column will store the request ID.
          type: string
          example: REQ201043380628
        deviceGroups:
          type: array
          items:
            $ref: '#/components/schemas/EventDeviceGroup'
        apnNames:
          type: array
          items:
            type: string
          description: Access Point Names (APN) associated with this event.
          example:
          - apn1
          - apn2
        apnTypes:
          type: array
          items:
            type: string
          description: Types of Access Point Names (APN) associated with this event.
          example:
          - type2
          - type1
        imei:
          type: string
          description: Current International Mobile Equipment Identity of the device.
          example: '867157040972691'
        prevImei:
          type: string
          description: Previous International Mobile Equipment Identity of the device (sim misuse).
          example: '867157040972690'
        deviceType:
          type: string
          description: Type of the device.
          example: smartphone

      - Localization
      summary: Initiate allocation of a subscription profile for M2M eUICCs
      description: Initiates the allocation of a subscription profile to a locale belonging to a specified eUICC agreement for M2M eUICCs.
      operationId: allocateProfilesV1
      requestBody:
        description: Profile allocation details
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileAllocation'
          application/vnd.dcp-v1+json:
            schema:
              $ref: '#/components/schemas/ProfileAllocation'
        required: true
      responses:
        '200':
          description: Request completed successfully.
          content:
            application/vnd.dcp-v1+json:
              schema:
                $ref: '#/components/schemas/EuiccProfile'
        '400':
          description: Cannot complete the request. See the error for more details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found

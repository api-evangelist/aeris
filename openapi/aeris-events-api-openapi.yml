openapi: 3.2.0
info:
  title: Aeris Events API
  x-refined-note:
  - x-api-id differs across the merged source definitions and was not carried
  - x-audience differs across the merged source definitions and was not carried
  version: '1.0'
  description: 'Operations tagged Events across 2 of this provider''s published API definitions: subscription-signalling-events-api.yaml, watchtower-api-openapi.yaml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://iot-api.aeris.com/iot/api/xdr
  description: API server
- url: https://watchtower-api-prd.aeriscloud.com
tags:
- name: Events
  description: Signalling events for subscriptions.
paths:
  /events:
    get:
      tags:
      - Events
      summary: List subscription events
      description: 'This resource will return a list of signalling events registered for all the IMSIs that you supply in the request.


        ### NOTE:


        * Data is only available from 1 day prior to the current time.

        * The maximum interval to query is 1 day.'
      operationId: listSubscriptionEvents
      parameters:
      - $ref: '#/components/parameters/imsiParam'
      - $ref: '#/components/parameters/fromParam'
      - $ref: '#/components/parameters/toParam'
      - $ref: '#/components/parameters/limitParam'
      - $ref: '#/components/parameters/codeParam'
      - $ref: '#/components/parameters/sortParam'
      - $ref: '#/components/parameters/additionalFieldsParam'
      - $ref: '#/components/parameters/cursorParam'
      responses:
        '200':
          description: OK
          headers:
            X-RateLimit-Limit-Second:
              $ref: '#/components/headers/X-RateLimit-Limit-Second'
            X-RateLimit-Limit-Minute:
              $ref: '#/components/headers/X-RateLimit-Limit-Minute'
            X-RateLimit-Remaining-Second:
              $ref: '#/components/headers/X-RateLimit-Remaining-Second'
            X-RateLimit-Remaining-Minute:
              $ref: '#/components/headers/X-RateLimit-Remaining-Minute'
          content:
            application/json:
              schema:
                type: object
                properties:
                  next:
                    description: Opaque string returned within the meta object response on endpoints which support pagination. Indicates that more results are available and can be used as the 'cursor' parameter in the next request to return the next page of results. The last page of results will not have a 'next' present.
                    type: string
                    example: DFVSDB3434%DFB%EYY445
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Event'
        '400':
          description: Bad reqeust.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/400Response'
        '401':
          description: Authentication Failure
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/401Response'
        '404':
          description: No Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/404Response'
        '500':
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/500Response'
        '503':
          description: Service Unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/503Response'
        '529':
          description: Service Overloaded
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/529Response'
        default:
          description: The standard http error codes will be given. 4XX for client errors and 5XX for server errors.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - OAuth2:
        - xdr-raw-api.read
        - subscription-signalling-events.read
    servers:
    - url: https://iot-api.aeris.com/iot/api/xdr
      description: API server
  /events/{event_id}:
    get:
      deprecated: false
      tags:
      - Events
      summary: Get subscription event details
      description: Get subscription event details for the specified event id.
      operationId: getSubscriptionEventDetails
      parameters:
      - $ref: '#/components/parameters/eventIdParam'
      - $ref: '#/components/parameters/fieldsParam'
      responses:
        '200':
          description: OK
          headers:
            X-RateLimit-Limit-Second:
              $ref: '#/components/headers/X-RateLimit-Limit-Second'
            X-RateLimit-Limit-Minute:
              $ref: '#/components/headers/X-RateLimit-Limit-Minute'
            X-RateLimit-Remaining-Second:
              $ref: '#/components/headers/X-RateLimit-Remaining-Second'
            X-RateLimit-Remaining-Minute:
              $ref: '#/components/headers/X-RateLimit-Remaining-Minute'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          description: Bad reqeust.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/400Response'
        '401':
          description: Authentication Failure
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/401Response'
        '404':
          description: No Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/404Response'
        '500':
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/500Response'
        '503':
          description: Service Unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/503Response'
        '529':
          description: Service Overloaded
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/529Response'
        default:
          description: The standard http error codes will be given. 4XX for client errors and 5XX for server errors.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - OAuth2:
        - xdr-raw-api.read
        - subscription-signalling-events.read
    servers:
    - url: https://iot-api.aeris.com/iot/api/xdr
      description: API server
  /watchtower/v1/events:
    put:
      summary: Update multiple Events
      description: This endpoint allows to update the status of one or more Events.
      operationId: updateEvents
      parameters:
      - $ref: '#/components/parameters/authorization'
      - $ref: '#/components/parameters/accountId'
      tags:
      - Events
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventsBulkUpdateRequest'
      responses:
        '200':
          description: Successfully updated
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
      security:
      - oAuth2ClientCredentials: []
    servers:
    - url: https://watchtower-api-prd.aeriscloud.com
  /watchtower/v1/events/search:
    post:
      summary: Search/Get Events
      description: This endpoint returns the list of Events.
      operationId: getEvents
      parameters:
      - $ref: '#/components/parameters/authorization'
      - $ref: '#/components/parameters/accountId'
      - $ref: '#/components/parameters/startTime'
      - $ref: '#/components/parameters/endTime'
      - $ref: '#/components/parameters/offset'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/sort'
      tags:
      - Events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventsQueryRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedEventsTable'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '413':
          $ref: '#/components/responses/413'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
      security:
      - oAuth2ClientCredentials: []
    servers:
    - url: https://watchtower-api-prd.aeriscloud.com
  /watchtower/v1/events/{eventId}:
    get:
      summary: Get details of an Event
      description: This endpoint retrieves details about an Event.
      operationId: getEvent
      parameters:
      - $ref: '#/components/parameters/authorization'
      - $ref: '#/components/parameters/accountId'
      - $ref: '#/components/parameters/eventId'
      tags:
      - Events
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event_2'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
      security:
      - oAuth2ClientCredentials: []
    put:
      summary: Update a single Event (Lifecycle operation)
      description: This endpoint allows to update the status of an Event and provide a comment.
      operationId: updateEvent
      parameters:
      - $ref: '#/components/parameters/authorization'
      - $ref: '#/components/parameters/accountId'
      - $ref: '#/components/parameters/eventId'
      tags:
      - Events
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventsUpdateRequest'
      responses:
        '200':
          description: Successfully updated
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
      security:
      - oAuth2ClientCredentials: []
    servers:
    - url: https://watchtower-api-prd.aeriscloud.com
  /watchtower/v1/events/export:
    post:
      summary: Export Events
      description: Use this endpoint to export the Events report as CSV.
      operationId: exportEvents
      parameters:
      - $ref: '#/components/parameters/authorization'
      - $ref: '#/components/parameters/accountId'
      - $ref: '#/components/parameters/startTime'
      - $ref: '#/components/parameters/endTime'
      - $ref: '#/components/parameters/sort'
      tags:
      - Events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventsQueryRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduledReport'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
      security:
      - oAuth2ClientCredentials: []
    servers:
    - url: https://watchtower-api-prd.aeriscloud.com
  /watchtower/v1/events/metrics/search:
    post:
      summary: Get Events Metrics
      description: This endpoint returns metrics about Events. Allows you to retrieve arbitrary metrics by supplying dimensions, metrics and filters.
      operationId: getEventsMetrics
      parameters:
      - $ref: '#/components/parameters/authorization'
      - $ref: '#/components/parameters/accountId'
      - $ref: '#/components/parameters/startTime'
      - $ref: '#/components/parameters/endTime'
      - $ref: '#/components/parameters/offset'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/sort'
      tags:
      - Events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventsMetricsRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedSummaryTable'
              example:
                total: 4
                limit: 10
                offset: 0
                schema:
                  fields:
                  - name: status
                    type: STRING
                  - name: cnt__event_id
                    type: INTEGER
                data:
                - - New
                  - 15
                - - Saved For Review
                  - 5
                - - Dismissed
                  - 6
                - - Completed
                  - 10
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
      security:
      - oAuth2ClientCredentials: []
    servers:
    - url: https://watchtower-api-prd.aeriscloud.com
  /watchtower/v1/aggregate-events/metrics/search:
    post:
      summary: Get Aggregated Events Metrics
      description: This endpoint returns metrics about Aggregates events.
      operationId: getAggregatedEventsMetrics
      parameters:
      - $ref: '#/components/parameters/authorization'
      - $ref: '#/components/parameters/accountId'
      - $ref: '#/components/parameters/startTime'
      - $ref: '#/components/parameters/endTime'
      - $ref: '#/components/parameters/offset'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/sort'
      tags:
      - Events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AggregatedEventsQueryRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedSummaryTable'
              example:
                total: 4
                limit: 10
                offset: 0
                lastEvaluatedDate: '2025-10-10'
                schema:
                  fields:
                  - name: status
                    type: STRING
                  - name: cnt__event_id
                    type: INTEGER
                data:
                - - New
                  - 15
                - - Saved For Review
                  - 5
                - - Dismissed
                  - 6
                - - Completed
                  - 10
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
      security:
      - oAuth2ClientCredentials: []
    servers:
    - url: https://watchtower-api-prd.aeriscloud.com
components:
  parameters:
    fieldsParam:
      name: fields
      in: query
      description: "Parameter used to filter the response object, you can determine a subset of fields that you want to\ninclude in the response, e.g. \"(imsi,lac)\".\n\n\n__Request__\n\n\nGET /events/WOh6LIABUqU6IY0JSVLK\n\n\n__Response__\n\n```json\n\n{\n  \"imsi\": \"238208000000001\",\n  \"id\": \"WOh6LIABUqU6IY0JSVLK\",\n  \"code\": \"m46-0\",\n  \"occurred_at\": \"2017-06-27T15:47:03.000Z\",\n  \"rat_type\": 1,\n  \"visited_nw\": \"France | Orange\",\n  \"imei\": \"676767676767\",\n  \"lac\": \"2323\",\n  \"lai\": \"2323\",\n  \"ggsn_ip\": \"8.8.8.8\",\n  \"sgsn_ip\": \"8.8.4.4\",\n  \"apn\": \"ericsson.api.net\"\n  ...\n}\n\n```\n\n\n__Request__\n\n\nGET /events/WOh6LIABUqU6IY0JSVLK?__fields=(imsi,lac)__\n\n\n__Response__\n\n```json\n\n{\n  \"imsi\": \"238208000000001\",\n  \"lac\": \"2323\"\n}\n\n```\n"
      required: false
      schema:
        type: string
      allowReserved: true
    cursorParam:
      in: query
      name: cursor
      description: 'Parameter used for display the content of next page on pagination, cannot be used with other parameters in one request.


        Set to the value of ''next'' for the next page of results.

        '
      schema:
        type: string
      allowReserved: true
    limitParam:
      in: query
      name: limit
      description: Specifies the maximum number of events to be returned, allowed interval is 1-1000, if not input, will use default value "100".
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 1000
      example: 100
    codeParam:
      in: query
      name: code
      description: One or more codes, comma separated, filtering which events to retrieve, e.g. "l42,m56".
      required: false
      schema:
        type: string
      example: l42,m56
    fromParam:
      in: query
      name: from
      description: The start time, UTC, for the time window processed to generate the response, e.g. "2019-06-28T00:00:00.000Z". If not input, will use default value "One hour ago (UTC)".
      required: false
      schema:
        type: string
        format: date-time
      allowReserved: true
      example: '2019-06-28T00:00:00.000Z'
    toParam:
      in: query
      name: to
      description: The end time, UTC, for the time window processed to generate the response, e.g. "2019-06-28T00:00:00.000Z". If not input, will use default value "Now (UTC)".
      required: false
      schema:
        type: string
        format: date-time
      allowReserved: true
      example: '2019-06-28T01:00:00.000Z'
    imsiParam:
      in: query
      name: imsi
      description: One or more imsi(s), comma separated, which identifies the subscription(s) to get events for, e.g. "238208000000001,238208000000002". The maximum imsi number is 15.
      required: true
      style: form
      explode: false
      schema:
        type: string
      allowReserved: true
      example: 238208000000001,238208000000002
    eventIdParam:
      in: path
      name: event_id
      description: An id which identifies a specific signalling event, which is the id field in response of /events.
      required: true
      schema:
        type: string
    sortParam:
      in: query
      name: sort
      description: Sort parameter containing sort field and sort mode used for getting the event data, e.g. "occurred_at:asc". If not input, will use default value "occurred_at:asc".
      schema:
        type: string
        enum:
        - code:asc
        - code:desc
        - occurred_at:asc
        - occurred_at:desc
      allowReserved: true
    additionalFieldsParam:
      name: additionalFields
      in: query
      description: "Parameter used to filter the response object, you can determine a subset of additional fields that you want to\ninclude in the response, e.g. \"lac,apn\".\n\n\n__Request__\n\n\nGET /events\n\n\n__Response__\n\n```json\n\n{\n  \"next\": \"DFVSDB3434%DFB%EYY445\",\n  \"items\": [\n    {\n      \"imsi\": \"238208000000001\",\n      \"id\": \"WOh6LIABUqU6IY0JSVLK\",\n      \"code\": \"m46-0\",\n      \"occurred_at\": \"2017-06-27T15:47:03.000Z\",\n    }\n    ...\n  ]\n}\n\n```\n\n\n__Request__\n\n\nGET /events?__additionalFields=lac,apn__\n\n\n__Response__\n\n```json\n\n{\n  \"next\": \"DFVSDB3434%DFB%EYY445\",\n  \"items\": [\n    {\n      \"imsi\": \"238208000000001\",\n      \"id\": \"WOh6LIABUqU6IY0JSVLK\",\n      \"code\": \"m46-0\",\n      \"occurred_at\": \"2017-06-27T15:47:03.000Z\",\n      \"lac\": \"2323\",\n      \"apn\": \"ericsson.api.net\"\n    }\n    ...\n  ]\n}\n\n```\n"
      required: false
      schema:
        type: string
      allowReserved: true
    limit:
      name: limit
      in: query
      description: The number of items to retrieve per page (10000 max).
      schema:
        $ref: '#/components/schemas/limit'
    accountId:
      name: X-Watchtower-Account-Id
      in: header
      description: Account Id
      required: true
      schema:
        $ref: '#/components/schemas/accountId'
      example: 1002000010
    eventId:
      name: eventId
      in: path
      description: Event Id
      required: true
      schema:
        $ref: '#/components/schemas/EventId'
    offset:
      name: offset
      in: query
      description: The position in pagination. Specifies the starting row offset into the result set returned. For example, if the page size (limit) is 10, then to select the second page, pass the offset as 10 to retrieve items 11 to 20.<br><br> Search parameters must be consistent across pages.
      schema:
        $ref: '#/components/schemas/offset'
    endTime:
      name: endTime
      in: query
      required: true
      description: The end timestamp. (exclusive)
      example: '2021-07-05T06:30:00Z'
      schema:
        $ref: '#/components/schemas/dateTime'
    sort:
      name: sort
      in: query
      description: Use <b>sort=comma-separated-fields[:asc|desc]</b> to sort the result.
      example: deviceId,updateTime:desc
      schema:
        type: string
    authorization:
      name: Authorization
      in: header
      description: Bearer Token for authentication
      required: true
      schema:
        type: string
        pattern: ^Bearer [A-Za-z0-9-._~+/]+=*$
      example: Bearer eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ...
    startTime:
      name: startTime
      in: query
      required: true
      description: The start timestamp. (inclusive)
      example: '2021-07-01T06:30:00Z'
      schema:
        $ref: '#/components/schemas/dateTime'
  schemas:
    Event:
      type: object
      allOf:
      - $ref: '#/components/schemas/ListEvent'
      properties:
        rat_type:
          type: integer
          format: int32
          description: '

            Radio Access Technology (RAT) type values.


            <table class="relative-table wrapped confluenceTable tablesorter tablesorter-default stickyTableHeaders" role="grid" resolved="" style="padding: 0px;"><colgroup><col style="width: 104.0px;"><col style="width: 244.0px;"><col style="width: 271.0px;"></colgroup><thead class="tableFloatingHeader" style="display: none;"><tr role="row" class="tablesorter-headerRow"><th class="confluenceTh tablesorter-header sortableHeader tablesorter-headerUnSorted" data-column="0" tabindex="0" scope="col" role="columnheader" aria-disabled="false" unselectable="on" aria-sort="none" aria-label="Event type: No sort applied, activate to apply an ascending sort" style="user-select: none;"><div class="tablesorter-header-inner">RAT Type</div></th><th colspan="1" class="confluenceTh tablesorter-header sortableHeader tablesorter-headerUnSorted" data-column="1" tabindex="0" scope="col" role="columnheader" aria-disabled="false" unselectable="on" aria-sort="none" aria-label="Event description: No sort applied, activate to apply an ascending sort" style="user-select: none;"><div class="tablesorter-header-inner">Description</div></th><th colspan="1" class="confluenceTh tablesorter-header sortableHeader tablesorter-headerUnSorted" data-column="2" tabindex="0" scope="col" role="columnheader" aria-disabled="false" unselectable="on" aria-sort="none" aria-label="Comment: No sort applied, activate to apply an ascending sort" style="user-select: none;"><div class="tablesorter-header-inner">Comment</div></th></tr></thead><tbody aria-live="polite" aria-relevant="all"><tr role="row"><td class="confluenceTd">0</td><td class="confluenceTd">reserved</td><td class="confluenceTd">&nbsp;</td></tr><tr role="row"><td class="confluenceTd">1</td><td class="confluenceTd">UTRAN</td><td class="confluenceTd">3G</td></tr><tr role="row"><td class="confluenceTd">2</td><td class="confluenceTd">GERAN</td><td class="confluenceTd">2G</td></tr><tr role="row"><td colspan="1" class="confluenceTd">3</td><td colspan="1" class="confluenceTd">WLAN</td><td colspan="1" class="confluenceTd">&nbsp;</td></tr><tr role="row"><td colspan="1" class="confluenceTd">4</td><td colspan="1" class="confluenceTd">GAN</td><td colspan="1" class="confluenceTd">&nbsp;</td></tr><tr role="row"><td colspan="1" class="confluenceTd">5</td><td colspan="1" class="confluenceTd">HSPA Evolution</td><td colspan="1" class="confluenceTd">&nbsp;</td></tr><tr role="row"><td colspan="1" class="confluenceTd">6</td><td colspan="1" class="confluenceTd">EUTRAN</td><td colspan="1" class="confluenceTd">LTE/4G</td></tr><tr role="row"><td colspan="1" class="confluenceTd">7</td><td colspan="1" class="confluenceTd">Virtual</td><td colspan="1" class="confluenceTd">&nbsp;</td></tr><tr role="row"><td colspan="1" class="confluenceTd">8-255</td><td colspan="1" class="confluenceTd">spare</td><td colspan="1" class="confluenceTd">&nbsp;</td></tr></tbody></table>

            '
        visited_nw:
          type: string
          description: Visited mobile network.
        imei:
          type: string
          description: '

            Device identity.



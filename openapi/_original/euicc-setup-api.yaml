            - 'cnx_ss_euicc_activationcode_ro'
  /activation-codes/import:
    post:
      tags:
        - 'Activation codes'
      summary: Import activation codes from CSV
      operationId: importActivationCodes
      description: |
        Imports activation codes from a CSV file. The CSV must contain at minimum the columns ICCID and ACTIVATION_CODE. The import is processed asynchronously; a jobId is returned to poll progress via the job status endpoint.
        
        **Note:** eID is optional for EXTERNAL but should not be provided for INTERNAL. State by default will be considered as AVAILABLE for both activation code type i.e EXTERNAL and INTERNAL.

        **Note:** For **INTERNAL** activation code type, the `localeId` provided is used solely to import the activation code into the system. Once imported, the activation code may be utilized by any locale that is configured with the same profile specification as the locale used during import.

      parameters:
        - $ref: '#/components/parameters/Header-Content-Type'
        - $ref: '#/components/parameters/Header-Accept-Version'
        - name: Accept
          in: header
          description: Accept content-type and schemas by the client
          content:
            application/json:
              schema:
                type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ActivationCodeImportRequest'
      responses:
        '202':
          description: Accepted
          allOf:
            - $ref: '#/components/responses/RateLimitedResponse'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivationCodeImportAcceptedResponse'
              examples:
                "Import accepted":
                  value:
                    jobId: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                    status: "ACCEPTED"
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '405':
          $ref: '#/components/responses/405'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        default:
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
        - OAuth2:
            - 'cnx_ss_euicc_activationcode_man'
  /activation-codes/import/jobstatus/{jobId}:
    get:
      tags:
        - 'Activation codes'
      summary: Get activation code import job status
      operationId: getActivationCodeImportJobStatus
      description: Retrieves the status and paginated failure details of an activation code import job. When the job is still in progress, only jobId and status are returned. When the job is complete or failed, full statistics and failure row details are included.
      parameters:
        - $ref: '#/components/parameters/Header-Content-Type'
        - $ref: '#/components/parameters/Header-Accept-Version'
        - name: Accept
          in: header
          description: Accept content-type and schemas by the client
          content:
            application/json:
              schema:
                type: string
        - name: jobId
          in: path
          description: Import job ID returned from the import activation codes request
          required: true
          schema:
            type: string
        - name: iccid
          in: query
          description: Filter failure rows by ICCID
          schema:
            type: string
        - name: page
          in: query
          description: Page number for failure rows (0-based)
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          description: Number of failure rows per page
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: OK
          allOf:
            - $ref: '#/components/responses/RateLimitedResponse'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJobStatusResponse'
              examples:
                "Job in progress":
                  value:
                    jobId: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                    status: "IN_PROGRESS"
                "Job completed":
                  value:
                    jobId: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                    status: "COMPLETED"
                    totalFailures: 2
                    totalSuccess: 98
                    page: 0
                    pageSize: 10
                    failedRows:
                      - failureId: 1001
                        rowNumber: 5
                        iccid: "8901234567890123456"
                        failureCode: "DUPLICATE_ICCID_IN_DB"
                        description: "ICCID already exists in database"
                        createdDate: "2026-05-15T10:30:00Z"
                      - failureId: 1002
                        rowNumber: 12
                        iccid: "8901234567890123457"
                        failureCode: "INVALID_ACTIVATION_CODE_FORMAT"
                        description: "Activation code does not match the required LPA format"
                        createdDate: "2026-05-15T10:30:01Z"
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '405':
          $ref: '#/components/responses/405'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        default:
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
        - OAuth2:
            - 'cnx_ss_euicc_activationcode_ro'
        - OAuth2:
            - 'cnx_ss_euicc_activationcode_man'
  /activation-codes/upload-status/{ehubJobId}:
    get:
      tags:
        - 'Activation codes'
      summary: Get upload status for an activation code import job
      operationId: getActivationCodeUploadStatus
      description: Retrieves the upload status of an activation code import job from the UIS service. Returns processing statistics and any failed records.
      parameters:
        - $ref: '#/components/parameters/Header-Content-Type'
        - $ref: '#/components/parameters/Header-Accept-Version'
        - name: Accept
          in: header
          description: Accept content-type and schemas by the client
          content:
            application/json:
              schema:
                type: string
        - name: ehubJobId
          in: path
          description: The eHub job ID returned from the import activation codes request.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          allOf:
            - $ref: '#/components/responses/RateLimitedResponse'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadStatusResponse'
              examples:
                "Upload status completed":
                  value:
                    uisJobId: "uis-job-abc123"
                    ehubJobId: "ehub-job-xyz789"
                    status: "COMPLETED"
                    totalRecords: 100
                    successCount: 98
                    failureCount: 2
                    createdAt: "2026-06-08T09:00:00Z"
                    updatedAt: "2026-06-08T09:05:00Z"
                    failedRecords:
                      - iccid: "8901234567890123456"
                        imsi: "310260123456789"
                        errorCode: "DUPLICATE_ICCID"
                        errorMessage: "ICCID already exists"
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '405':
          $ref: '#/components/responses/405'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        default:
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
        - OAuth2:
            - 'cnx_ss_euicc_activationcode_ro'
        - OAuth2:
            - 'cnx_ss_euicc_activationcode_man'
  /activation-codes/retry/{ehubJobId}:
    post:
      tags:
        - 'Activation codes'
      summary: Retry a failed activation code upload job
      operationId: retryActivationCodeUpload
      description: Retries a previously failed activation code upload job via the UIS service. Returns 200 if the job was already completed, or 202 if a new retry has been accepted.
      parameters:
        - $ref: '#/components/parameters/Header-Content-Type'
        - $ref: '#/components/parameters/Header-Accept-Version'
        - name: Accept
          in: header
          description: Accept content-type and schemas by the client
          content:
            application/json:
              schema:
                type: string
        - name: ehubJobId
          in: path
          description: The eHub job ID of the upload to retry.
          required: true
          schema:
            type: string
      responses:
        '200':

  /sims/{id}:
    get:
      summary: Query sims with identifier
      description: |-
        With this operation, it is possible to retrieve information about one
        or multiple SIM resources by entering a valid IMSI, MSISDN, IMEI,
        ICC and optionally, a range.
      tags:
        - Subscription management - additional functions
      parameters:
        - name: Authorization
          in: header
          description: A valid token string in the form Bearer \<token string\>
          schema:
            type: string
          required: true
        - name: id
          in: path
          required: true
          description: |-
            The identifier of the sim resource. The type of the identifier
            is given by the property "identifier_type".
          schema:
            type: string
        - name: identifier_type
          in: query
          required: true
          description: |-
            The type of the values for the items.
            it is case insensitive, Value can be: IMSI, IMEI, MSISDN, ICC
          schema:
            type: string
            x-extensible-enum:
              - IMSI
              - IMEI
              - MSISDN
              - ICC
        - name: range
          in: query
          required: false
          description: |-
            Optional. An integer that defines the number of resources to query.
            For example, 2 returns the specified resource plus
            the next in range. Values of 1–500 are allowed.
          schema:
            type: string
      responses:
        "200":
          $ref: '#/components/responses/SimResourceResponse'
        "400":
          $ref: '#/components/responses/Response_400'
        "401":
          $ref: '#/components/responses/Response_401'
        "403":
          $ref: '#/components/responses/Response_403'
        "404":
          $ref: '#/components/responses/Response_404'
        "429":
          $ref: '#/components/responses/Response_429'
        "500":
          $ref: '#/components/responses/Response_500'
        default:
          $ref: '#/components/responses/Response_default'
      security:
        - Oauth2_auth:
            - subscription-service.read
  /sims:
    get:
      summary: Query sims with customer label
      description: |-
        With this operation, it is possible to retrieve information about
        multiple SIM resources by entering a valid customer label with paging
        is provided with start number and chunk size
      tags:
        - Subscription management - additional functions
      parameters:
        - name: Authorization
          in: header
          description: A valid token string in the form Bearer \<token string\>
          schema:
            type: string
          required: true
        - name: label
          in: query
          required: true
          description: |-
            Name of the label
          schema:
            type: string
        - name: organization_id
          in: query
          required: false
          description: Id of organization, either companyId or organizationId
            must be provided
          schema:
            type: string
        - name: company_id
          in: query
          required: false
          description: Id of company, either companyId or organizationId
            must be provided
          schema:
            type: string
        - name: start_number
          in: query
          required: true
          description: |-
            The first number in the result set. Start from zero.
          schema:
            type: string
        - name: chunk_size
          in: query
          required: true
          description: |-
            size of results to return after the start number index. The maximum
            value of chunkSize is 500, which means that the operation can
            return a maximum of 500 SIM resources in one response.
          schema:
            type: string
      responses:
        "200":
          $ref: '#/components/responses/SimResourceResponse'
        "400":
          $ref: '#/components/responses/Response_400'
        "401":
          $ref: '#/components/responses/Response_401'
        "403":

            type: boolean
            description: 'A boolean indicating whether the APN is resolved by the IoTA DNS or the DNS of the operator.

              If it is true, the Ericsson DNS will be responsible for resolving the APN.

              Then the dnsPlmnIds parameters need to be provided in order to know the DNS zone, and the APN must end with a specific suffix.

              '
            example: true
          dnsPlmnIds:
            type: array
            description: When supplierDnsHosted is true, the dnsPlmnIds needs to be provided.
            example:
            - '123456'
            - '777888'
            items:
              type: string
          packetGws:
            type: array
            description: the EPGs where the APN are created.
            items:
              $ref: '#/components/schemas/ExtendedDedicatedInternetServiceRequest_packetGws'
          sessionTimeoutTimer:
            type: integer
            description: "The number of minutes that the session timer timed out. Set to 0 means that the session will not time out.\n The default value is 0.\n"
            format: int32
            example: 0
          idleTimeoutTimer:
            type: integer
            description: "The number of minutes that the idle timer timeout.\n When the traffic idle time exceeds the specified value, the session will be reset.\n The default value is 60.\n"
            format: int32
            example: 60
          isDefaultAPN:
            type: boolean
            description: A boolean indicating whether the APN of the ESM Context should set to default.
            example: false
          apnOiReplacement:
            type: string
            description: This attribute indicates the domain name to replace the APN Operator Identifier when constructing the PDN Gateway (GW) Full Qualified Domain Name (FQDN) upon which to perform a DNS resolution.
            example: mncfoo.mccfoo.gprs
          esmContextQosId:
            type: string
            description: The id of the ESM context Qos.
            example: '123456'
          esmProfileQosId:
            type: string
            description: The id of the ESM profile QoS.
            example: '123456'
          pdpQosId:
            type: string
            description: The id of the PDP Qos.
            example: '123456'

docs_findings:
  token_endpoints:
    bearer: POST /iot/api/auth and POST /iot/api/auth/token
    x_access_token: POST /login (per API group)
    marketplace_hub: POST /auth/login
  by_api_group:
    Service Portal (SOAP): wss-security UsernameToken
    User Administration: X-access-token via POST /login
    Consumer Connectivity: X-access-token via POST /login
    Subscription Management: X-access-token via POST /login
    Device Localization: X-access-token via POST /login
    Shared bundle: Bearer via POST /token
    Enterprise Management (CSP only): Bearer via POST /token
    eUICC Setup (CSP and Advanced Resellers only): Bearer via POST /token
    Device Reconnect: Bearer via POST /token
    Subscription Change History: Bearer via POST /token
    Subscription management - additional functions: Bearer via POST /token
    Search Subscription Details: Bearer via POST /token
    Ticketing service for incident management: Bearer via POST /token
    SMS messaging: HTTP Basic Auth
    Enterprise Provisioning for Marketplace HUB (CSP only): Bearer via POST /auth/login
    Custom fields: Bearer via POST /token
    Subscription location: Bearer via POST /token
    Subscription signaling usages: Bearer via POST /token
    Subscription signaling events: Bearer via POST /token
    'Devices: eUICC inventory view': Bearer via POST /token
    AerAdmin / AerFrame / AerTraffic (Aeris-native): apiKey query parameter
  jwt_claims:
  - sub
  - iss
  - aud
  - azp
  - upn
  - email
  - first_name
  - last_name
  - groups
  - organization_ids
  - enterprise_group_ids
  - billing_organization_id
  - exp
  - iat
  - jti
  token_reuse_guidance: Aeris documents reading the exp claim and reusing the token rather than re-authenticating
    per request; /iot/api/auth is rate limited to 5 req/s and 60 req/min.
  onboarding: Credentials are issued by the Connectivity Service Provider on subscription; there is no self-serve
    API key.

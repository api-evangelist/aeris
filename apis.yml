- name: Aeris AerFrame Device Communication and Control API
  description: 'RESTful SMS and device-control API on the Aeris network: send mobile-terminated SMS, receive
    delivery notifications, receive and acknowledge mobile-originated SMS, reset network registration,
    retrieve a local dialable number and query network location. Organised as application registration,
    notification-channel and network-services resources, and documented as based on the OMA-DM standard
    SMS API. Authenticates with an account API key.'
  image: https://www.aeris.com/wp-content/uploads/cropped-Favicon-16x16-1-192x192.png
  humanURL: https://support.aeris.net/hc/en-us/articles/360036914654-AerFrame-Device-Communication-and-Control-API
  baseURL: https://api.aerframe.aeris.com
  tags:
  - SMS Messaging
  - M2M
  - Cellular Connectivity
  - IoT
  properties:
  - type: Documentation
    url: https://support.aeris.net/hc/en-us/articles/360036914654-AerFrame-Device-Communication-and-Control-API
- name: Aeris AerTraffic Reports API
  description: 'Web service interface for retrieving device traffic and billing data from the Aeris AerTraffic
    system: create online and scheduled report templates, poll report status, download online, scheduled
    and archived reports, manage report recipients and retrieve trend and account-level reports. Mirrors
    the reporting available in the AerPort web UI. Authenticates with an account API key.'
  image: https://www.aeris.com/wp-content/uploads/cropped-Favicon-16x16-1-192x192.png
  humanURL: https://support.aeris.net/hc/en-us/articles/360037394973-AerTraffic-Reports-API

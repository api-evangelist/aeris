- name: Aeris AerAdmin Device Management API
  description: The Aeris-native SOAP web service used to provision, activate, suspend, cancel, retire
    and re-provision devices on the Aeris network, change rate plans and service profiles, update device
    attributes and traffic policy, query device detail, network status and location, and run the same
    operations in bulk. The WSDL is published unauthenticated at /AerAdmin_WS_5_0/ws?wsdl and declares
    47 operations. A REST facade over the same system is documented as the AerAdmin 5.0 REST API.
  image: https://www.aeris.com/wp-content/uploads/cropped-Favicon-16x16-1-192x192.png
  humanURL: https://support.aeris.net/hc/en-us/articles/360037124333-AerAdmin-Device-Management-API-SOAP-and-XML
  baseURL: https://aeradminapi.aeris.com
  tags:
  - Device Management
  - Cellular Connectivity
  - M2M
  - SOAP
  properties:

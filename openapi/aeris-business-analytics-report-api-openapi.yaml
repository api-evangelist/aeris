          type: integer
          format: int64
          example: 500000
    DateRangeEnum:
      type: string
      description: |
        An enum which defines supported date range values:
          - LAST_DAY
          - LAST_2_DAYS
          - LAST_7_DAYS
          - LAST_30_DAYS
          - THIS_MONTH
      enum:
        - LAST_DAY
        - LAST_2_DAYS
        - LAST_7_DAYS
        - LAST_30_DAYS
        - THIS_MONTH
  parameters:
    FromDate:
      name: fromDate
      in: query
      description: >
        Specifies the earliest date to search for aggregated traffic usage, in the following format: YYYY-MM-DD.
        Traffic usage data is available only from the last 31 days.
      required: false
      schema:
        type: string
        format: date
      example: '2022-04-20'
    ToDate:
      name: toDate
      in: query
      description: >
        Specifies the latest date to search for aggregated traffic usage, in the following format: YYYY-MM-DD.
        The starting and ending dates must define a period of 1, 7, or 30 days. Otherwise, an error is returned.
      required: false
      schema:
        type: string
        format: date
      example: '2022-04-20'
    ResultLimit:
      name: resultLimit
      in: query
      required: true
      description: >
        Specifies the number of results the query returns. Maximum possible value is 250.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 250
      example: 5
    TrafficType:
      name: trafficType
      in: query
      required: true
      description: >
        Specifies the traffic type to search for.
      schema:
        $ref: "#/components/schemas/TrafficTypeEnum"
    OrganizationId:
      name: organizationId
      in: query
      required: false
      description: >
        Specifies the organization ID.
      schema:
        type: string
      example: '3.88.2'
    DateRange:
      name: dateRange
      in: query
      required: false
      description: |
        An optional parameter which is used to selects most common date ranges.
        Valid values are:
          - LAST_DAY
          - LAST_2_DAYS
          - LAST_7_DAYS
          - LAST_30_DAYS
          - THIS_MONTH

        This parameter takes precedence over 'fromDate' and 'toDate' and calculates the dates automatically
        based on the selected dateRange. If user provides all parameters 'fromDate', 'toDate' and 'dateRange'
        then 'fromDate', 'toDate' provided by user are ignored.
      schema:
        $ref: '#/components/schemas/DateRangeEnum'
      example: LAST_DAY

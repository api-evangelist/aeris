servers:
  - url: 'https://iot-api.aeris.com/iot/api'
    description: API server
tags:
  - name: 'EimInfo'
    description: eIM information
paths:
  /eim-info/list:
    get:
      tags:
        - 'EimInfo'
      summary: List eIM infos
      operationId: listEimInfos
      description: Retrieves eIM information records.
      parameters:
        - $ref: '#/components/parameters/Header-Content-Type'
        - $ref: '#/components/parameters/Header-Accept-Version'
        - name: Accept
          in: header
          description: Accept content-type and schemas by the client
          content:
            application/json:
              schema:
                type: string
      responses:
        '200':
          description: OK
          allOf:
            - $ref: '#/components/responses/RateLimitedResponse'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EimInfoList001'
              examples:
                "List eIM infos response":
                  $ref: '#/components/examples/EimInfoListExample'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '405':
          $ref: '#/components/responses/405'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        default:
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
        - OAuth2:
            - 'cnx_eim_read'

  /eim-info/{eimInfoEntityId}:
    get:
      tags:
        - 'EimInfo'
      summary: Get eIM info
      operationId: getEimInfo
      description: Retrieves eIM information by entity id.
      parameters:
        - $ref: '#/components/parameters/Header-Content-Type'
        - $ref: '#/components/parameters/Header-Accept-Version'
        - name: Accept
          in: header
          description: Accept content-type and schemas by the client
          content:
            application/json:
              schema:
                type: string
        - name: eimInfoEntityId
          in: path
          description: eIM entity id.
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: OK
          allOf:
            - $ref: '#/components/responses/RateLimitedResponse'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EimInfo001'
              examples:
                "Get eIM info response":
                  $ref: '#/components/examples/EimInfoExample'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '405':
          $ref: '#/components/responses/405'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        default:
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
        - OAuth2:
            - 'cnx_eim_read'

  /eim-info/{euiccId}/eims:
    get:
      tags:
        - 'EimInfo'
      summary: Get eIMs mapped to an eUICC
      operationId: getEuiccEims
      description: Retrieves eIMs mapped to an eUICC.
      parameters:
        - $ref: '#/components/parameters/Header-Content-Type'
        - $ref: '#/components/parameters/Header-Accept-Version'
        - name: Accept
          in: header
          description: Accept content-type and schemas by the client
          content:
            application/json:
              schema:
                type: string
        - name: euiccId
          in: path
          description: hexadecimal digit eUICC ID
          required: true
          schema:
            type: string
            pattern: '(^[0-9A-F]{32})|([0-9A-Fa-f]{20,30}$)'
      responses:
        '200':
          description: Mapped eIMs found
          allOf:
            - $ref: '#/components/responses/RateLimitedResponse'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EuiccEim001'
              examples:
                "Get euicc eims response":
                  $ref: '#/components/examples/EuiccEimListExample'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '500':
          $ref: '#/components/responses/500'
        default:
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
        - OAuth2:
            - 'cnx_eim_read'

components:
  schemas:
    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri
          description: |
            An absolute URI that identifies the problem type. When dereferenced,
            it SHOULD provide human-readable documentation for the problem type
            (e.g., using HTML).
          default: about:blank
          example: https://your.api.documentation.url
        title:
          type: string
          description: |
            A short, summary of the problem type. Written in english and readable
            for engineers (usually not suited for non technical stakeholders and
            not localized)
          example: 'Service Unavailable'
        status:
          type: integer
          format: int32
          description: |
            The HTTP status code generated by the origin server for this occurrence
            of the problem.
          minimum: 100
          maximum: 600
          exclusiveMaximum: true
          example: 503
        detail:
          type: string
          description: |
            A human readable explanation specific to this occurrence of the
            problem.
          example: Connection to database timed out
        instance:
          type: string
          description: |
            An absolute URI that identifies the specific occurrence of the problem.
            It may or may not yield further information if dereferenced.
          example: 'https://api.documentation.url/request-id'

    EimInfoList001:
      type: array
      items:
        $ref: '#/components/schemas/EimInfo001'

    EimInfo001:
      type: object
      required:
        - entityId
        - eimId
        - eimName
        - eimIdType
        - eimFqdn
        - supportedProtocols
        - indirectProfileDownload
      properties:
        entityId:
          type: string
        eimId:
          type: string
          maxLength: 128
        eimName:
          type: string
          maxLength: 256
        eimIdType:
          type: string
        eimFqdn:
          type: string
          maxLength: 255
        supportedProtocols:
          type: array
          items:
            $ref: '#/components/schemas/SupportedProtocol001'
        indirectProfileDownload:
          type: boolean

    EuiccEim001:
      type: object
      properties:
        eim_id:
          type: string
        eim_fqdn:
          type: string
        eim_id_type:
          type: string
        indirect_profile_download:
          type: boolean

    SupportedProtocol001:
      type: string
      enum:
        - EIM_RETRIEVE_HTTPS
        - EIM_RETRIEVE_COAPS
        - EIM_INJECT_HTTPS
        - EIM_INJECT_COAPS
        - EIM_PROPRIETARY

  responses:
    RateLimitedResponse:
      headers:
        X-RateLimit-Limit-Second:
          $ref: '#/components/headers/X-RateLimit-Limit-Second'
        X-RateLimit-Limit-Minute:
          $ref: '#/components/headers/X-RateLimit-Limit-Minute'
        X-RateLimit-Remaining-Second:
          $ref: '#/components/headers/X-RateLimit-Remaining-Second'
        X-RateLimit-Remaining-Minute:
          $ref: '#/components/headers/X-RateLimit-Remaining-Minute'
        Content-Type:
          $ref: '#/components/headers/Content-Type'
    '204':
      description: No Content
      allOf:
        - $ref: '#/components/responses/RateLimitedResponse'
    '400':
      description: Bad Request
      headers:
        Content-Type:
          $ref: '#/components/headers/Content-Type'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: "https://your.api.documentation.url/bad-request"
            title: "Bad Request"
            status: 400
            detail: "The request could not be understood by the server due to malformed syntax"
            instance: "https://api.documentation.url/request-id"

components:
  headers:
    Content-Type:
      description: Handle Content-Type
      schema:
        type: string
    X-RateLimit-Limit-Second:
      description: The maximum number of requests allowed in a second.
      schema:
        type: integer
        format: int32
    X-RateLimit-Limit-Minute:
      description: The maximum number of requests allowed in a minute.
      schema:
        type: integer
        format: int32
    X-RateLimit-Remaining-Second:
      description: The number of requests remaining in a second.
      schema:
        type: integer
        format: int32
    X-RateLimit-Remaining-Minute:
      description: The number of requests remaining in a minute.
      schema:
        type: integer
        format: int32
  schemas:
    SubscriptionRequestResponseType:
      title: SubscriptionRequestResponseType
      description: |-
        Response type for successfully created subscription request.
        The subscription_request_id in the response can be used in a query to
        the endpoint 'GET /subscriptions/requests/{requestId}' to get the
        status of subscription request job.
      required:
        - subscription_request_id
      type: object
      properties:
        subscription_request_id:
          description: |-
            The request id returned for the subscription change request.
          type: string
      example:
        subscription_request_id: REQ201234567890
    Apn:
      type: object
      properties:
        name:
          description: Apn name
          type: string
        description:
          description: Description of Apn
          type: string
    FixedIp:
      type: object
      properties:
        ip:
          description: The fixed IP addresses assigned to the subscription.
          type: string
        ip_version:
          description: The version of the IP. It can be IPV_4 or IPV_6.
          type: string
          x-extensible-enum:
            - IPV4
            - IPV6
        radius:
          description: |-
            The name of the RADIUS server, which handles the
            IP allocation.
          type: string
          x-extensible-enum:
            - RADIUS1
            - RADIUS2
        apn_name:
          description: The APN associated with the IP address.
          type: string
        sub_net:
          description: The subnet to which the fixed IP address belongs.
          type: string
    SimResource:
      type: object
      properties:
        fixed_ips:
          type: array
          items:
            "$ref": "#/components/schemas/FixedIp"
        access_control_class:
          type: string
        apns:
          type: array
          items:
            "$ref": "#/components/schemas/Apn"
        assigned_imei:
          type: string
        charge_code_for_pp_move:
          type: boolean
        charge_code_non_pp_move:
          type: boolean
        clip:
          type: boolean
        consumer_connectivity:
          type: boolean
        csd:
          type: boolean
        customer_label:
          type: string
        customer_no:
          type: string
        delivery_date:
          type: string
          format: date-time
        device_terminal_type:
          type: string
        disposal_date:
          type: string
          format: date-time
        first_activation_date:
          type: string
          format: date-time
        freeze_duration:
          type: string
        gprs:
          type: boolean
        icc:
          type: string
        imei:
          type: string
        imsi:
          type: string
        installation_date:
          type: string
          format: date-time
        last_subscription_date_change:
          type: string
          format: date-time
        move_to_permitted:
          type: boolean
        msisdn:
          type: string
        pbr_exit_date:
          type: string
          format: date-time
        pdp_context_profile_name:
          type: string
        pin1:
          type: string
        pin2:
          type: string
        price_profile_desc:
          type: string
        price_profile_name:
          type: string
        product_offer_name:
          type: string
        puk1:
          type: string
        puk2:
          type: string
        region_short_name:
          type: string
        roam_profile_desc:
          type: string
        roam_profile_name:
          type: string
        sim_card_description:
          type: string
        sim_resource_status:
          type: string
          enum:
            - BEING_ASSEMBLED
            - DELETE
            - DEPLOYED
            - DISPOSED
            - DOWN
            - END_OF_LIFE
            - IN_INVENTORY
            - IN_REPAIR
            - ON_LOAN
            - ORDERED
            - RECEIVED
            - RESERVED
            - RETURN_TO_VENDOR
            - TRANSFERRED
        sim_specification:
          type: string
        sim_subscription_status:
          type: string
          enum:
            - ACTIVE
            - DEACTIVATED
            - PAUSE
            - TERMINATED
            - TERMINATED_PENDING
        site:
          type: string
        sms_mo:
          type: boolean
        sms_mt:
          type: boolean
        trigger_package:
          type: string
        voice:
          type: boolean
        lte:
          type: boolean
        user_profile_id:
          type: string
        tenant_id:
          type: string
        arp_tadig:
          type: string
        arp_assignment_time:
          type: string
          format: date-time
        customer_name:
          type: string
        subscription_package_description:
          type: string
        operator_id:
          type: string
        enable_5g:
          type: boolean
    SimResourceResponse:
      title: SimResourceResponse
      description: |-
        Response type for a successful query sim resourse
      type: object
      properties:
        sims:
          type: array
          description: List of sim resources
          items:
            "$ref": "#/components/schemas/SimResource"
    AvailableRegionQueryResponseType:
      title: AvailableRegionQueryResponseType
      description: |-
        Response type for a successful query available region request.
        The regions in the response can be used in a request to the change
        subscription region.
      required:
        - regions
      type: object
      properties:
        regions:
          description: |-
            The array of regions.
          required:
            - short_name
          items:
            $ref: '#/components/schemas/Region'
          type: array
      example:
        regions:
          - short_name: REQ201234567890
            description: ABC
            quarantine_period: 60
            number_length: 15
            pool_id: ZZFXXXXXXP00099
            status: ACTIVE
    OrganizationId:
      description: Organization_id type
      type: object
      properties:
        organization_id:
          description: |-
            Id of the organization.
            Format: "1.23.4"
          type: string
      example:
        organization_id: 3.78.37
    OrganizationType:
      oneOf:
        - $ref: '#/components/schemas/CompanyId'
        - $ref: '#/components/schemas/OrganizationId'
      title: OrganizationType
      description: |-
        Optional, Used to identify the organization.
        But if exist, Either one of the properties 'organization_id' or
        'company_id' must be given.
        If both exist at the same time then using organization_id as default.
      type: object
      example: |-
        {
            "organization_id": "3.78.37",
        }
    SubscriptionOwner:
      oneOf:
        - $ref: '#/components/schemas/CompanyId'
        - $ref: '#/components/schemas/OrganizationId'
        - $ref: '#/components/schemas/PackageChange'
      title: OrganizationType
      description: |-
        Mandatory, Either one of the properties 'organization_id' or
        'company_id' must be given.
        the property 'subscription_package_id' must be given.
      type: object
      example: |-
        {
            "organization_id": "3.78.37",
        }
    OwnerChange:
      title: OwnerChangeData
      description: Contains the data for an owner change.
      required:
        - owner
      type: object
      properties:
        owner:
          $ref: '#/components/schemas/SubscriptionOwner'
      example:
        owner:
          organization_id: 3.78.38
    RegionChange:
      title: RegionChangeData
      description: Contains the data for a region change.
      required:
        - region
      type: object
      properties:
        region:
          description: The name of the region to change to.
          type: string
      example:
        region: ABC
    ArpChange:
      title: ArpChangeData
      description: |-
        The subscrition ARP to change to. Using TADIG (Transferred Account
        Data Interchange Group) code. Use alphanumeric characters only
        (maximum 10). Please note that the ARP code is case sensitive.
      required:
        - arp_tadig_code
      type: object
      properties:
        arp_tadig_code:
          type: string
    StateChange:
      title: StateChangeData
      description: Contains the data for a state change.
      required:
        - state
      type: object
      properties:
        state:
          description: |-
            The subscrition state to change to, only uppercase, including
            ACTIVE/PAUSE/TERMINATED/DEACTIVATED/ACTIVE_NO_BILLING
            /DEACTIVATED_NO_BILLING.
          type: string
          x-extensible-enum:
            - ACTIVE
            - DEACTIVATED
            - PAUSE
            - TERMINATED
            - ACTIVE_NO_BILLING
            - DEACTIVATED_NO_BILLING
      example:
        state: PAUSE
    ChangeArpRequest:
      description: The model for a subscription arp change request.
      required:
        - subscription
        - change
      type: object
      properties:
        subscription:
          $ref: '#/components/schemas/ArpSubscription'
        change:
          $ref: '#/components/schemas/ArpChange'
        on_behalf_of:
          $ref: '#/components/schemas/OrganizationType'
      example:
        subscription:
          identifier_type: IMSI
          identifier: 100000123456001
        change:
          arp_tadig_code: FRAF1
        on_behalf_of:
          organization_id: 1.23.4
          company_id: 100002304
    StateChangeRequest:
      description: The model for a subscription state change request.
      required:
        - subscriptions
        - change
      type: object
      properties:
        subscriptions:
          $ref: '#/components/schemas/SubscriptionList'
        change:
          $ref: '#/components/schemas/StateChange'
        on_behalf_of:
          $ref: '#/components/schemas/OrganizationType'
      example:
        subscriptions:
          identifier_type: IMSI
          identifiers:
            - "100000123456001"
            - "100000123456002"
        change:
          state: PAUSE
        on_behalf_of:
          organization_id: 1.23.4
    OwnerChangeRequest:
      description: The model for a subscription owner change request.
      required:
        - subscriptions
        - change
      type: object
      properties:
        subscriptions:
          $ref: '#/components/schemas/SubscriptionList'
        change:
          $ref: '#/components/schemas/OwnerChange'
        on_behalf_of:
          $ref: '#/components/schemas/OrganizationType'
      example:
        subscriptions:
          identifier_type: IMSI
          identifiers:
            - "100000123456001"
            - "100000123456002"
        change:
          owner:
            organization_id: 3.78.38
        on_behalf_of:
          organization_id: 1.23.4
    PackageChangeRequest:
      description: The model for a subscription package change request.
      required:
        - subscriptions
        - change
      type: object
      properties:
        subscriptions:
          $ref: '#/components/schemas/SubscriptionList'
        change:
          $ref: '#/components/schemas/PackageChange'
        on_behalf_of:
          $ref: '#/components/schemas/OrganizationType'
      example:
        subscriptions:
          identifier_type: IMSI
          identifiers:
            - "100000123456001"
            - "100000123456002"
        change:
          subscription_package_id: 200200207_SP_01
        on_behalf_of:
          organization_id: 1.23.4
    RegionChangeRequest:
      description: The model for a subscription region change request.
      required:
        - subscriptions
        - change
      type: object
      properties:
        subscriptions:
          $ref: '#/components/schemas/SubscriptionList'
        change:
          $ref: '#/components/schemas/RegionChange'
        on_behalf_of:
          $ref: '#/components/schemas/OrganizationType'
      example:
        subscriptions:
          identifier_type: IMSI
          identifiers:
            - "100000123456001"
            - "100000123456002"
        change:
          region: ABC
        on_behalf_of:
          organization_id: 1.23.4
    Subscription:
      title: Subscription
      required:
        - identifier
        - identifier_type
      properties:
        identifier_type:
          description: |-
            The type of the values for the items.
             it is case insensitive, Value can be: IMSI, MSISDN, ICC
          type: string
          x-extensible-enum:
            - IMSI
            - MSISDN
            - ICC
        identifier:
          description: |-
            The identifier of the subscription. The type of the identifier
            is given by the property "identifier_type".
          type: string
    ArpSubscription:
      title: Subscription
      required:
        - identifier
        - identifier_type
      properties:
        identifier_type:
          description: |-
            The type of the values for the items.
             it is case insensitive, Value can be: IMSI, MSISDN
          type: string
          x-extensible-enum:
            - IMSI
            - MSISDN
        identifier:
          description: |-
            The identifier of the subscription. The type of the identifier
            is given by the property "identifier_type".
          type: string
    SubscriptionList:
      title: SubscriptionList
      description: |-
        Used to identify a list of subscriptions.
        The identifier can be of the type:
        - IMSI
        - MSISDN
        - ICC
      required:
        - identifiers
        - identifier_type
      type: object
      properties:
        identifier_type:
          description: |-
            The type of the values for the items.
             it is case insensitive, Value can be: IMSI, MSISDN, ICC
          type: string
          x-extensible-enum:
            - IMSI
            - MSISDN
            - ICC
        identifiers:
          description: |-
            The identifier of the subscription. The type of the identifier
            is given by the property "identifier_type".
          type: array
          items:
            type: string
      example:
        identifier_type: IMSI
        identifiers:
          - "100000123456001"
          - "100000123456002"
          - "100000123456003"
    CompanyId:
      description: Company_id type
      type: object
      properties:
        company_id:
          deprecated: true
          description: |-
            Id of the company.
            Format: "12345678".
            Deprecated.
          type: string
      example:
        company_id: "78000037"
    PackageChange:
      title: PackageChangeData
      description: Contains the data for a package change.
      required:
        - subscription_package_id
      type: object
      properties:
        subscription_package_id:
          description: The Subscription Package to change to.
          type: string
      example:
        subscription_package_id: 200200207_SP_01
    Region:
      description: The values for one region
      type: object
      properties:
        short_name:
          description: Short name of region
          type: string
        description:
          description: Description of region
          type: string
        quarantine_period:
          description: After Termination, MSISDN enters a 'quarantine period'
            as defined in MSISDN-POOL setup. Within this time frame, it is
            guaranteed that reactivation of a certain subscription will get
            the same MSISDN
          type: integer
        number_length:
          description: |-
            Number length assigned from MSISDN-POOL for instance the MSISDN
            200883000000002 has a length of 15
          type: integer
        pool_id:
          description: pool id of region
          type: string
        status:
          description: region status of region
          type: string
      example:
        short_name: REQ201234567890
        description: ABC
        quarantine_period: 60
        number_length: 15
        pool_id: ZZFXXXXXXP00099
        status: ACTIVE
    CancelSimOrderResponse:
      description: Defines response of cancel sim order request.
      type: object
      required:
        - status
      properties:
        status:
          type: string
      example:
        status: success
    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri
          description: |
            An absolute URI that identifies the problem type. When dereferenced,
            it SHOULD provide human-readable documentation for the problem type
            (e.g., using HTML).
          default: 'about:blank'
          example: 'https://zalando.github.io/problem/constraint-violation'
        title:
          type: string
          description: |
            A short, summary of the problem type. Written in english and
            readable for engineers (usually not suited for non technical
            stakeholders and not localized); example: Service Unavailable
        status:
          type: integer
          format: int32
          description: |
            The HTTP status code generated by the origin server for this
            occurrence of the problem.
          minimum: 100
          maximum: 600
          example: 503
        detail:
          type: string
          description: |
            A human readable explanation specific to this occurrence of the
            problem.
          example: Connection to database timed out
        instance:
          type: string
          description: |
            Identifies the specific occurrence of the
            problem. It may or may not yield further information if
            dereferenced.
        code:
          type: string
          description: |
            An extension field to record special codes referring
            to some specific errors or responses.
  responses:
    RateLimitedResponse:
      headers:
        X-RateLimit-Limit-Second:
          $ref: '#/components/headers/X-RateLimit-Limit-Second'
        X-RateLimit-Limit-Minute:
          $ref: '#/components/headers/X-RateLimit-Limit-Minute'
        X-RateLimit-Remaining-Second:
          $ref: '#/components/headers/X-RateLimit-Remaining-Second'
        X-RateLimit-Remaining-Minute:
          $ref: '#/components/headers/X-RateLimit-Remaining-Minute'
        Content-Type:
          $ref: '#/components/headers/Content-Type'
    SubscriptionRequestResponse:
      allOf:
        - $ref: '#/components/responses/RateLimitedResponse'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SubscriptionRequestResponseType'
          examples:
            subscription-request-response-example-1:
              value:
                subscription_request_id: REQ201234567890
      description: The response from a sucessfully created request.
    AvailableRegionQueryResponse:
      allOf:
        - $ref: '#/components/responses/RateLimitedResponse'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AvailableRegionQueryResponseType'
          examples:
            available-region-query-response-example-1:
              value:
                regions:
                  - short_name: REQ201234567890
                    description: ABC
                    quarantine_period: 60
                    number_length: 15
                    pool_id: ZZFXXXXXXP00099
                    status: ACTIVE
      description: The response from a sucessfully query request.
    SimResourceResponse:
      allOf:
        - $ref: '#/components/responses/RateLimitedResponse'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SimResourceResponse'
      description: The response from a sucessfull query sim resource request.
    Response_400:
      description: Bad Request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            response:
              value:
                status: 400
                detail: |-
                  Missing mandatory request parameters
                  and/or incorrect parameter format
    Response_401:
      description: Unauthorized
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            response:
              value:
                status: 401
                detail: Unauthorized.
    Response_403:
      description: Forbidden
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            response:
              value:
                status: 403
                detail: Forbidden
    Response_404:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            response:
              value:
                status: 404
                detail: Resource not found
    Response_429:
      description: Too Many Requests
      allOf:
        - $ref: '#/components/responses/RateLimitedResponse'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            response:
              value:
                status: 429
                detail: Too Many Requests
    Response_500:
      description: |-
        Internal Server Error, Error occurred -
        see status code and problem object for more
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            response:
              value:
                status: 500
                detail: Internal Server Error.
    Response_default:
      description: |-
        Internal Server Error, Error occurred -
        see status code and problem object for more
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            response:
              value:
                status: 500
                detail: Internal Server Error.
  securitySchemes:
    Oauth2_auth:
      flows:
        password:
          tokenUrl: https://iot-api.aeris.com/iot/api/auth/token
          scopes:
            subscription-service.read: |-
              Access right needed to read from the Subscription service.
            subscription-service.write: |-
              Access right needed to write to the Subscription service.
      type: oauth2
tags:
  - name: Subscription management - additional functions
    description: ""

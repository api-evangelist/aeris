        - name: companyId
          in: query
          required: true
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            description: Filter by device status (Active, Suspended, Terminated)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GatewayResponse'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '400':
          $ref: '#/components/responses/400Configuration'
        '500':
          $ref: '#/components/responses/500'

    post:
      tags:
        - Gateway
      summary: Provision a gateway
      operationId: provisionGateway
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            description: Client-supplied idempotency key (UUID). Same key replays the cached response.
        - name: X-Watchtower-Trace-Id
          in: header
          required: false
          schema:
            type: string
            description: Correlation ID propagated through all downstream calls and stored in BigQuery.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GatewayProvisionRequest'
      responses:
        '201':
          description: Gateway provisioned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayResponse'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '409':
          $ref: '#/components/responses/409Configuration'
        '400':
          $ref: '#/components/responses/400Configuration'
        '503':
          $ref: '#/components/responses/503Configuration'
        '500':
          $ref: '#/components/responses/500'

  /watchtower/v1/gateways/{gatewayId}:

    get:
      tags:
        - Gateway
      summary: Get gateway by ID
      operationId: getGateway
      parameters:
        - name: gatewayId
          in: path
          required: true
          schema:
            type: string
        - name: companyId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayResponse'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '400':
          $ref: '#/components/responses/400Configuration'
        '500':
          $ref: '#/components/responses/500'

    put:
      tags:
        - Gateway
      summary: Update gateway fields
      operationId: updateGateway
      parameters:
        - name: gatewayId
          in: path
          required: true
          schema:
            type: string
        - name: companyId
          in: query
          required: true
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            description: Client-supplied idempotency key (UUID). Same key replays the cached response.
        - name: X-Watchtower-Trace-Id
          in: header
          required: false
          schema:
            type: string
            description: Correlation ID propagated through all downstream calls.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GatewayUpdateRequest'
      responses:
        '204':
          description: Gateway updated successfully
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '400':
          $ref: '#/components/responses/400Configuration'
        '500':
          $ref: '#/components/responses/500'

    delete:
      tags:
        - Gateway
      summary: Deprovision a gateway
      operationId: deprovisionGateway
      parameters:
        - name: gatewayId
          in: path
          required: true
          schema:
            type: string
        - name: companyId
          in: query
          required: true
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            description: Client-supplied idempotency key (UUID). Same key replays the cached response.
        - name: X-Watchtower-Trace-Id
          in: header
          required: false
          schema:
            type: string
      responses:
        '204':
          description: Gateway deprovisioned successfully
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409Configuration'
        '400':
          $ref: '#/components/responses/400Configuration'
        '503':
          $ref: '#/components/responses/503Configuration'
        '500':
          $ref: '#/components/responses/500'

  /watchtower/v1/gateways/{gatewayId}/history:

    get:
      tags:
        - Gateway
      summary: Get gateway state-change history
      operationId: getGatewayHistory
      parameters:
        - name: gatewayId
          in: path
          required: true
          schema:
            type: string
        - name: companyId
          in: query
          required: true
          schema:
            type: string
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Start of time window (ISO 8601). Defaults to 31 days ago.
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: End of time window (ISO 8601). Defaults to now.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GatewayHistoryResponse'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'

  /watchtower/v1/batch/gateways:

    post:
      tags:
        - Gateway
      summary: Batch provision gateways
      operationId: batchProvisionGateways
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            description: Client-supplied idempotency key (UUID). Same key replays the cached response.
        - name: X-Watchtower-Trace-Id
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchGatewayProvisionRequest'
      responses:
        '202':
          description: Batch accepted — partial failures listed in the response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchGatewayProvisionResponse'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '400':
          $ref: '#/components/responses/400Configuration'
        '500':
          $ref: '#/components/responses/500'

    delete:
      tags:
        - Gateway
      summary: Batch deprovision gateways
      operationId: batchDeprovisionGateways
      parameters:
        - name: X-Watchtower-Trace-Id
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchGatewayDeprovisionRequest'
      responses:
        '202':
          description: Batch accepted — partial failures listed in the response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchGatewayDeprovisionResponse'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '400':
          $ref: '#/components/responses/400Configuration'
        '500':
          $ref: '#/components/responses/500'


########################## components ###########################################
components:

  securitySchemes:
    oAuth2ClientCredentials:
      type: oauth2
      description: This API uses OAuth 2 with the Client Credentials flow.
      flows:
        clientCredentials:
          tokenUrl: /watchtower/v1/auth/token
          scopes: { }

  parameters:
    authorization:
      name: Authorization
      in: header
      description: Bearer Token for authentication
      required: true
      schema:
        type: string
        pattern: '^Bearer [A-Za-z0-9-._~+/]+=*$'
      example: 'Bearer eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ...'
    accountId:
      name: X-Watchtower-Account-Id
      in: header
      description: Account Id
      required: true
      schema:
        $ref: '#/components/schemas/accountId'
      example: 1002000010
    startTime:
      name: startTime
      in: query
      required: true
      description: The start timestamp. (inclusive)
      example: '2021-07-01T06:30:00Z'
      schema:
        $ref: '#/components/schemas/dateTime'
    endTime:
      name: endTime
      in: query
      required: true
      description: The end timestamp. (exclusive)
      example: '2021-07-05T06:30:00Z'
      schema:
        $ref: '#/components/schemas/dateTime'
    startDate:
      name: startDate
      in: query
      required: true
      description: The inclusive start date (UTC), format YYYY-MM-DD. Maximum period between startDate and endDate is 90 days.
      example: '2026-05-29'
      schema:
        type: string
        format: date
    endDate:
      name: endDate
      in: query
      required: true
      description: The inclusive end date (UTC), format YYYY-MM-DD. Maximum period between startDate and endDate is 90 days.
      example: '2026-06-05'
      schema:
        type: string
        format: date
    offset:
      name: offset
      in: query
      description: >-
        The position in pagination. Specifies the starting row offset into the
        result set returned. For example, if the page size (limit) is 10, then
        to select the second page, pass the offset as 10 to retrieve items 11 to
        20.<br><br> Search parameters must be consistent across pages.
      schema:
        $ref: '#/components/schemas/offset'
    limit:
      name: limit
      in: query
      description: The number of items to retrieve per page (10000 max).
      schema:
        $ref: '#/components/schemas/limit'
    sort:
      name: sort
      in: query
      description: Use <b>sort=comma-separated-fields[:asc|desc]</b> to sort the result.
      example: deviceId,updateTime:desc
      schema:
        type: string
    reportId:
      name: reportId
      in: path
      description: Report Id
      required: true
      schema:
        type: string
      example: b7e72bb3-b2fd-4265-a28b-9a279418fdb9
    deviceId:
      name: deviceId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/deviceId'
    year:
      name: year
      description: Year
      in: query
      required: true
      schema:
        type: integer
        maximum: 2099
        minimum: 2000
    month:
      name: month
      description: Month
      in: query
      required: true
      schema:
        type: integer
        maximum: 12
        minimum: 1

    # Events
    eventId:
      name: eventId
      in: path
      description: Event Id
      required: true
      schema:
        $ref: '#/components/schemas/EventId'
    eventConfigId:
      name: eventConfigId
      in: path
      description: Event Configuration Id
      required: true
      schema:
        type: integer
    suppressionConfigId:
      name: suppressionConfigId
      in: path
      description: Event Suppression Configuration Id
      required: true
      schema:
        type: integer
        format: int64
    undoDismissedEvents:
      name: undoDismissedEvents
      in: query
      description: Whether to undo past events dismissed by this suppression config or not
      required: true
      schema:
        type: boolean
        default: false

    # DeviceGroups
    deviceGroupId:
      name: deviceGroupId
      in: path
      required: true
      description: The ID of the device group
      schema:
        type: integer

    # Applications
    applicationId:
      name: applicationId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/applicationId'

    # ProtectionPolicies
    protectionPolicyId:
      name: protectionPolicyId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/protectionPolicyId'

    # EnforcementRules
    enforcementRuleId:
      name: enforcementRuleId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/enforcementRuleId'

    # RateLimiters
    rateLimiterId:
      name: rateLimiterId
      in: path
      required: true
      description: The ID of the rate limiter
      schema:
        type: integer
        format: int64

    # EventPolicies
    policyId:
      name: policyId
      in: path
      required: true
      description: The ID of the event policy
      schema:
        type: integer
        format: int64

    # LocationLists
    locationListId:
      name: locationListId
      in: path
      required: true
      description: The ID of the location list
      schema:
        type: integer
        format: int64

  schemas:
    GatewayUpdateRequest:
      type: object
      description: Partial update for a gateway. Only provided fields are updated.
      properties:
        serialNumber:
          type: string
          nullable: true
        deviceType:
          type: string
          nullable: true
        firmwareVersion:
          type: string
          nullable: true
        imei:
          type: string
          nullable: true
          pattern: '^\d{15}$'
        mcc:
          type: string
          nullable: true
          pattern: '^\d{3}$'
        mnc:
          type: string
          nullable: true
          pattern: '^\d{2,3}$'
        attributes:
          type: object
          additionalProperties:
            type: string
          nullable: true
        billing:
          type: object
          nullable: true
          properties:
            billingStatus:
              type: string

    GatewayProvisionRequest:
      type: object
      required:
        - gatewayId
        - companyId
      properties:
        gatewayId:
          type: string
          description: Gateway device identifier — 15-digit IMSI
          pattern: '^\d{15}$'
        companyId:
          type: string
          description: FK → Company; must already exist in the company registry
        mcc:
          type: string
          description: Mobile Country Code — 3-digit numeric string
          pattern: '^\d{3}$'
          nullable: true
        mnc:
          type: string
          description: Mobile Network Code — 2–3 digit numeric string
          pattern: '^\d{2,3}$'
          nullable: true
        iccid:
          type: string
          description: Integrated Circuit Card Identifier — 18–22 digit numeric string
          pattern: '^\d{18,22}$'
          nullable: true
        imei:
          type: string
          description: International Mobile Equipment Identity — exactly 15 digits
          pattern: '^\d{15}$'
          nullable: true
        serialNumber:
          type: string
          description: Device serial number (e.g. MR40-QA-00050001)
          nullable: true
        deviceType:
          type: string
          description: Device type classification (e.g. CAT20)
          nullable: true
        firmwareVersion:
          type: string
          description: Firmware version string
          nullable: true
        billing:
          type: object
          nullable: true
          description: Billing information
          properties:
            plan:
              type: string
              nullable: true
            usedDataMb:
              type: number
              format: double
              nullable: true
            usedDataGb:
              type: number
              format: double
              nullable: true
            billingStatus:
              type: string
              nullable: true
        attributes:
          type: object
          additionalProperties:
            type: string
          description: Optional custom key-value attributes stored as device custom_field entries
          nullable: true
        apn:
          type: string
          description: APN hint from caller — always overridden by server-side configuration
          nullable: true

    GatewayHistoryResponse:
      type: object
      properties:
        id:
          type: string
          description: Unique event ID (UUID)
        gatewayId:
          type: string
          description: Gateway device identifier (IMSI)
        fromStatus:
          type: string
          nullable: true
          description: Previous status — null for initial PROVISION event
        toStatus:
          type: string
          description: Status after transition
        reason:
          type: string
          description: "Transition reason: PROVISION / TERMINATION"
        traceId:
          type: string
          nullable: true
          description: X-Watchtower-Trace-Id from the originating request
        occurredAt:
          type: string
          format: date-time
          description: Wall-clock time of the transition

    BatchGatewayProvisionRequest:
      type: object
      required:
        - gateways
      properties:
        gateways:
          type: array
          maxItems: 5000
          items:
            $ref: '#/components/schemas/GatewayProvisionRequest'

    BatchGatewayProvisionResponse:
      type: object
      properties:
        total:
          type: integer
          description: Total records received
        provisioned:
          type: integer
          description: Successfully provisioned
        updated:
          type: integer
          description: Already existed and were idempotently returned
        rejected:
          type: integer
          description: Failed validation or enrichment
        failures:
          type: array
          items:
            $ref: '#/components/schemas/BatchFailureRecord'

    BatchFailureRecord:
      type: object
      properties:
        gatewayId:
          type: string
          description: Gateway ID from the original request (may be invalid)
        failureCategory:
          type: string
          description: "High-level category: validation / company_not_found / ip_enrichment"
        failureReason:
          type: string
          description: Specific reason code (e.g. MISSING_GATEWAY_ID, IPAM_NON_2XX)

    BatchGatewayDeprovisionRequest:
      type: object
      required:
        - gateways
      properties:
        gateways:
          type: array
          maxItems: 5000
          items:
            $ref: '#/components/schemas/GatewayDeprovisionItem'

    GatewayDeprovisionItem:
      type: object
      required:
        - gatewayId
        - companyId
      properties:
        gatewayId:
          type: string
          description: IMSI of the gateway to deprovision
        companyId:
          type: string
          description: Company owning the gateway

    BatchGatewayDeprovisionResponse:
      type: object
      properties:
        total:
          type: integer
          description: Total records received
        terminated:
          type: integer
          description: Successfully terminated
        skipped:
          type: integer
          description: Skipped (already terminated or not found)
        rejected:
          type: integer
          description: Failed validation or IPAM release
        failures:
          type: array
          items:
            $ref: '#/components/schemas/BatchDeprovisionFailureRecord'

    BatchDeprovisionFailureRecord:
      type: object
      properties:
        gatewayId:
          type: string
          description: Gateway ID from the original request
        failureCategory:
          type: string
          description: "High-level category: validation / ipam_failed / not_found / already_terminated"
        failureReason:
          type: string
          description: Specific reason code

    ConfigurationErrorResponse:
      type: object
      description: RFC 7807 error envelope (FS section 4.7)
      properties:
        title:
          type: string
          description: Human-readable error summary
          example: "Payload validation failed"
        status:
          type: integer
          description: HTTP status code
          example: 422
        correlationId:
          type: string
          description: Trace / correlation ID (X-Watchtower-Trace-Id or auto-generated UUID)
          example: "c7f5a8b2-1234-5678-abcd-ef0123456789"
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ConfigurationErrorDetail'

    ConfigurationErrorDetail:
      type: object
      properties:
        field:
          type: string
          nullable: true
          description: Field name that caused the error (null for non-field errors)
          example: "gatewayId"
        code:
          type: string
          description: Machine-readable error code
          example: "VALIDATION_ERROR"
        message:
          type: string
          description: Human-readable error message
          example: "must be exactly 15 digits"

    CompanyResponse:
      type: object
      properties:
        companyId:
          type: string
          description: Primary key — unique company identifier
        name:
          type: string
          description: Human-readable display name
        parentCompanyId:
          type: string
          nullable: true
          description: Parent company in the hierarchy; null = root account
        companyType:
          type: string
          description: Company type classification
        carrierId:
          type: string
          nullable: true
          description: FK → Carrier (operator id)

    CompanyUpsertRequest:
      type: object
      required:
        - companyId
        - name
      properties:
        companyId:
          type: string
          description: Primary key — must match an entry in the company hierarchy
        name:
          type: string
          description: Human-readable display name
        parentCompanyId:
          type: string
          nullable: true
          description: Parent company in the hierarchy; null = root account

    GatewayResponse:
      type: object
      properties:
        deviceId:
          type: string
          description: Internal BigQuery entity_id for the device
        gatewayId:
          type: string
          description: Gateway device identifier (IMSI)
        companyId:
          type: string
          description: FK → Company
        status:
          type: string
          description: Device lifecycle status (Active, Suspended, Terminated)
        carrierId:
          type: string
          description: FK → Carrier (operator id)
        imei:
          type: string
          nullable: true
          description: International Mobile Equipment Identity — exactly 15 digits
        iccid:
          type: string
          nullable: true
          description: Integrated Circuit Card Identifier
        mcc:
          type: string
          nullable: true
          description: Mobile Country Code — 3-digit numeric string
        mnc:
          type: string
          nullable: true
          description: Mobile Network Code — 2–3 digit numeric string
        serialNumber:
          type: string
          nullable: true
          description: Device serial number
        deviceType:
          type: string
          nullable: true
          description: Device type classification
        firmwareVersion:
          type: string
          nullable: true
          description: Firmware version string
        billingStatus:
          type: string
          nullable: true
          description: Billing / SIM subscription state
        assignedIp:
          type: string
          nullable: true
          description: IP address assigned by IPAM
        apn:
          type: string
          nullable: true
          description: APN (Access Point Name) assigned to this gateway
        correlationId:
          type: string
          nullable: true
          description: Correlation / trace ID
        createdAt:
          type: string
          format: date-time
          nullable: true
          description: Creation timestamp
        attributes:
          type: object
          additionalProperties:
            type: string
          description: Custom attributes
          nullable: true

    AuthorizedAccountsResponse:
      type: object
      description: Paginated list of managed enterprise accounts
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ManagedAccount'
          description: List of managed enterprise accounts
        offset:
          type: integer
          description: Current offset
          example: 0
        limit:
          type: integer
          description: Page size
          example: 20
        total:
          type: integer
          format: int64
          description: Total number of managed accounts
          example: 1847
    ManagedAccount:
      type: object
      description: A managed enterprise account
      properties:
        accountId:
          type: integer
          format: int64
          description: Enterprise account ID
          example: 10200001
        accountName:
          type: string
          description: Account display name
          example: "Swisscom Enterprise AG"
    accountId:
      description: Account Id.
      type: integer
      format: int32
      example: 10407
      minimum: 0
    dateTime:
      description: ISO 8601 date time
      type: string
      format: date-time
      example: '2021-07-04T17:36:47Z'
    offset:
      description: Position in pagination.
      type: integer
      format: int32
      default: 0
      minimum: 0
    limit:
      type: integer
      format: int32
      description: Number of items to retrieve (10000 max).
      minimum: 1
      maximum: 10000
      default: 20
    total:
      type: integer
      format: int64
      description: Total number of items available.
      example: 1
      minimum: 0
    iccid:
      description: Integrated Circuit Card Identifier.
      type: string
      minLength: 18
      maxLength: 22
      example: '891004234814455936'
    imei:
      description: IMEI (International Mobile Equipment Identity) of the device.
      type: string
      minLength: 14
      maxLength: 15
      example: '86715704097269'
    imsi:
      description: International Mobile Subscriber Identifier of the device.
      type: string
      maxLength: 15
      example: '310009133100012'
    msisdn:
      description: Mobile Station International Subscriber Directory Number.
      type: string
      maxLength: 15
      example: '8801500121121'
    deviceProfileId:
      description: Device Profile ID assigned to the device.
      type: string
      maxLength: 30
      example: AER0000007087071
    ip:
      type: string
      description: IP Address
      example: 172.16.1.3
    port:
      type: integer
      description: Port number
      minimum: 0
      maximum: 65536
      example: 8080
    domain:
      description: FQDN
      type: string
      example: abc.xyz.com
    endpointFQDN:
      description: Fully qualified domain name of the endpoint
      type: string

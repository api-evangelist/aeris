    ##### Rate Limiters
    ExternalRateLimiterCreateRequest:
      type: object
      required:
        - name
        - configs
      properties:
        name:
          type: string
          maxLength: 100
          description: Name of the rate limiter group.
        configs:
          type: array
          description: List of rate limiter configurations to create (one per limit type).
          items:
            $ref: '#/components/schemas/ExternalRateLimiterConfig'
    ExternalRateLimiterConfig:
      type: object
      required:
        - limitType
        - upstreamRate
        - upstreamBurstSize
        - downstreamRate
        - downstreamBurstSize
      properties:
        limitType:
          type: string
          description: The limit type.
          enum:
            - SESSION_LEVEL
            - AGGREGATE
        upstreamRate:
          type: integer
          format: int64
          description: Upstream rate in kbps.
        upstreamBurstSize:
          type: integer
          format: int64
          description: Upstream burst size in kbps.
        downstreamRate:
          type: integer
          format: int64
          description: Downstream rate in kbps.
        downstreamBurstSize:
          type: integer
          format: int64
          description: Downstream burst size in kbps.
    ExternalRateLimiterUpdateRequest:
      type: object
      required:
        - upstreamRate
        - upstreamBurstSize
        - downstreamRate
        - downstreamBurstSize
      properties:
        name:
          type: string
          maxLength: 100
          description: Name of the rate limiter.
        upstreamRate:
          type: integer
          format: int64
          description: Upstream rate in kbps.
        upstreamBurstSize:
          type: integer
          format: int64
          description: Upstream burst size in kbps.
        downstreamRate:
          type: integer
          format: int64
          description: Downstream rate in kbps.
        downstreamBurstSize:
          type: integer
          format: int64
          description: Downstream burst size in kbps.
    ExternalRateLimitersQueryRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
          description: Filter by name of the rate limiter.
        limitTypes:
          type: array
          items:
            type: string
          description: Filter by the limit type.
    PagedRateLimiters:
      allOf:
        - $ref: '#/components/schemas/Pagination'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/RateLimiter'
    ExternalRateLimiterListResponse:
      type: object
      properties:
        rateLimiters:
          type: array
          items:
            $ref: '#/components/schemas/RateLimiter'
    RateLimiter:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: The rate limiter ID.
        serviceConfigurationId:
          type: integer
          format: int64
          description: The linked service configuration ID.
        name:
          type: string
          description: Name of the rate limiter.
        limitType:
          type: string
          description: The limit type.
          enum:
            - SESSION_LEVEL
            - AGGREGATE
        upstreamRate:
          $ref: '#/components/schemas/upstreamRate'
        upstreamBurstSize:
          $ref: '#/components/schemas/upstreamBurstSize'
        downstreamRate:
          $ref: '#/components/schemas/downstreamRate'
        downstreamBurstSize:
          $ref: '#/components/schemas/downstreamBurstSize'
        createdBy:
          type: string
          description: The user who created the rate limiter.
        createdTime:
          type: string
          format: date-time
        updatedBy:
          type: string
          description: The user who last updated the rate limiter.
        updatedTime:
          type: string
          format: date-time
    upstreamRate:
      type: integer
      format: int64
      minimum: 0
      description: Upstream rate in kbps.
    upstreamBurstSize:
      type: integer
      format: int64
      minimum: 0
      description: Upstream burst size in kbps.
    downstreamRate:
      type: integer
      format: int64
      minimum: 0
      description: Downstream rate in kbps.
    downstreamBurstSize:
      type: integer
      format: int64
      minimum: 0
      description: Downstream burst size in kbps.
  responses:
    '400':
      description: Bad Request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 400
            message: Bad Request
            timestamp: 2025-06-01 13:28:03.967
            path: /watchtower/v1/...
            traceId: c3db9d7a432317363c8bc5ddb5aadf4b
    '401':
      description: Not authorized.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 401
            message: Unauthorized
            timestamp: 2025-06-01 13:28:03.967
            path: /watchtower/v1/...
            traceId: c3db9d7a432317363c8bc5ddb5aadf4b
    '403':
      description: Forbidden.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 403
            message: Forbidden
            timestamp: 2025-06-01 13:28:03.967
            path: /watchtower/v1/...
            traceId: c3db9d7a432317363c8bc5ddb5aadf4b
    '404':
      description: Not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 404
            message: Not found
            timestamp: 2025-06-01 13:28:03.967
            path: /watchtower/v1/...
            traceId: c3db9d7a432317363c8bc5ddb5aadf4b
    '413':
      description: Requested data too large
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 413
            message: Requested data too large. Please use /watchtower/v1/.../export for requesting larger amounts of data
            timestamp: 2025-06-01 13:28:03.967
            path: /watchtower/v1/...
            traceId: c3db9d7a432317363c8bc5ddb5aadf4b
    '429':
      description: Too many requests.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 429
            message: "Rate Limit Exceeded (XX) for clientId: XXXXXX. Please retry after XXX seconds"
            timestamp: 2025-06-01 13:28:03.967
            path: /watchtower/v1/...
            traceId: c3db9d7a432317363c8bc5ddb5aadf4b
    '500':
      description: Internal Server Error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 500
            message: Internal Server Error
            timestamp: 2025-06-01 13:28:03.967
            path: /watchtower/v1/...
            traceId: c3db9d7a432317363c8bc5ddb5aadf4b
    '409Configuration':
      description: Conflict — resource already exists or invalid state transition
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ConfigurationErrorResponse'
    '400Configuration':
      description: Bad Request — validation failure (RFC 7807)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ConfigurationErrorResponse'
          example:
            title: "Payload validation failed"
            status: 400
            correlationId: "c7f5a8b2-1234-5678-abcd-ef0123456789"
            errors:
              - field: "gatewayId"
                code: "VALIDATION_ERROR"
                message: "must be exactly 15 digits"
    '503Configuration':
      description: Service Unavailable — downstream dependency failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ConfigurationErrorResponse'

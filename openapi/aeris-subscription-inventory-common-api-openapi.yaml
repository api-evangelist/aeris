  /regions:
    get:
      summary: Query available regions request.
      operationId: AvailableRegionsQuery
      description: |-
        This API request creates a query available regions request.
      tags:
        - Subscription management - additional functions
      parameters:
        - name: Authorization
          description: A valid token string in the form Bearer \<token string\>
          in: header
          schema:
            type: string
          required: true
        - name: identifier_type
          in: query
          description: |-
            Identifier type (IMSI, ICC, MSISDN), it is case insensitive
          required: true
          schema:
            type: string
            x-extensible-enum:
              - IMSI
              - ICC
              - MSISDN
        - name: identifier
          in: query
          description: Value for identifier
          required: true
          schema:
            type: string
        - name: status
          in: query
          description: |-
            Filter regios by status (ACTIVE,INACTIVE), it is case insensitive
          required: false
          schema:

    # Introduction

    This document describes the IoT Accelerator ( IoT-A) Device Localization
    API. The IoT-A Device Localization API provides users with a web
    application interface, mainly to localize embedded Universal Integrated
    Circuit Cards (eUICCs) and query subscription data over HTTPS. The IoTA Device Localization API is based on the Representational State Transfer
    (REST) interface.

    From this point on, the IoT-A Device Localization API is referred to as API
    in this document.

    #### Note:

    The term service request in this document and the term subscription request in
    the Service Portal refer to the same concept.

    ## Scope

    This document covers the following topics:

    — An overview of the API

    — A detailed description of all operations offered by the API

    ## Prerequisites
    In this document, it is assumed that the user is familiar with the following:

    — Java Script Object Notation (JSON)

    — Basic understanding of REST web services

    — The [OpenAPI Initiative](https://www.openapis.org/) for the standardized format used in this document.

    ## Related Information

    For the full list of permissions affecting the Device Localization API, see the IoT-A Service Portal Operator Guide document.

    The definition and explanation of acronyms and terminology and typographic conventions can be found in the following documents:

    — IoTA Glossary of Terms and Acronyms

    — Typographic Conventions

    # General API Guidelines

    ## Compatibility

    API audience must be prepared for compatible API extensions:

    - Be tolerant with unknown fields in the payload (see also Fowler’s "TolerantReader" post), i.e. ignore new fields but do not eliminate them from payload if needed for subsequent PUT requests.
    - Be prepared that "x-extensible-enum" return parameter may deliver new values. Either be agnostic or provide default behavior for unknown values.
    - Be prepared to handle HTTP status codes not explicitly specified in endpoint definitions.
    - Follow the redirect when the server returns HTTP status 301 Moved Permanently.

    ### Encapsulation
    The API supports the application/json content type for the requests.
    The response content type is also application/json, except for the /
    monitor/echo/{message} endpoint, where the response appears as
    plain text.

    See Endpoints and Operations on page 13 for the endpoints available in
    the API.

    ## Security

    This section describes the security measures in the API. Security measures include authentication, authorization, and encryption.

    ### Authentication and Authorization

    Endpoints requiring authentication are indicated with a lock icon, which is performed by passing a token in the 'X-Access-Token' header in each request.

    The token can be acquired using the /login or /login-form endpoints documented below. The login response also contains the token expiration time in milliseconds. For prolonged interaction with the API, a new token can be reissued before expiration using the /token-reissue endpoint. HTTP status 401 will be returned in case of missing, expired or invalid token.

    ### Encryption

    All API requests are encrypted using the HTTPS protocol to grant secure data transfer.

    

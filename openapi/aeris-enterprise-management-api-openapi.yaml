    Connectivity:
      type: object
      description: Connectivity parameters.
      properties:
        sim_order_minimum:
          type: integer
          description: 'Minimum allowed number of SIMs in a SIM order.'
          minimum: 0
          maximum: 2147483647
          example: 20
        payment_terms:
          type: integer
          description: 'Number of days allowed for payment after the end of the billing cycle.'
          minimum: 1
          maximum: 90
          example: 14
        invoice_delivery_type:
          description: 'E-mail, postal or Electronic Data Interchange (EDI)'
          type: string
          x-extensible-enum:
            - EMAIL
            - POSTAL
            - EDI
          example: POSTAL
        email:
          type: string
          nullable: true
          description: 'E-mail address for invoice delivery. Mandatory if invoice_delivery_type is email.'
          minLength: 1
          maxLength: 255
          example: mycompany@example.com
      required:
        - invoice_delivery_type
    Address:
      type: object
      properties:
        contact_person:
          type: string
          description: 'Name of the recipient. Mandatory for billing address.'
          minLength: 3
          maxLength: 60
          example: 'Firstname Lastname'
        street_address:
          type: string
          minLength: 1
          maxLength: 255
          example: 'Main Street 1'
        city:
          type: string
          minLength: 1
          maxLength: 60
          example: Somecity
        zip:
          type: string
          description: 'ZIP code / postal code'
          minLength: 1
          maxLength: 90
          example: ZIP-12345
        country:
          type: string
          minLength: 2
          maxLength: 2
          example: FI
          description: 'Country''s ISO-3166-1 2-character shortcode string'
        state:
          type: string
          nullable: true
          minLength: 4
          maxLength: 6
          example: FI-16
          description: 'State''s / province''s ISO-3166-2 shortcode string'
        phone_number:
          type: string
          nullable: true
          maxLength: 50
          example: +999-12-34567
      required:
        - street_address
        - city
        - zip
        - country
    SimSpecification:
      type: object
      allOf:
        - $ref: '#/components/schemas/BasicData'
        - properties:
            earliest_delivery_in_days:
              type: integer
              nullable: true
              description: 'Minimum number of days from SIM order to earliest possible delivery.'
              example: 15
            order_increment:
              type: integer
              nullable: true
              description: 'The number of SIMs that an order must be incremented with.'
              example: 10
            low_order_threshold:
              type: integer
              nullable: true
              description: 'If number of SIMs in SIM order is smaller than
                the low order threshold, a low order fee may be applied.'
              example: 5
            network_group_id:
              type: integer
              nullable: true
              format: int64
              description: 'Internal ID of the operator''s network group to
                which this SIM specfication belongs. See output of
                [GET/enterprises/network-groups]'
              example: 123
    FormSpecification:
      type: object
      allOf:
        - $ref: '#/components/schemas/BasicData'
        - properties:
            minimum_order_volume:
              type: integer
              description: 'Minimum order volume'
              example: 10
            order_increment:
              type: integer
              description: 'The number of eSIMs that an order must be
                incremented with.'
              example: 10
            sm_sr_endpoint_name:
              type: string
              description: 'sm-sr endpoint'
              example: 4.3.2.1,1.2.3.4
    ProfileSpecification:
      type: object
      allOf:
        - $ref: '#/components/schemas/BasicData'
        - properties:
            number_scheme:
              type: string
              description: 'The number scheme id'
              example: ZZSSCHEME00142,ZZSSCHEME00143
            price_category:
              type: integer
              description: 'The price category'
              example: 5
            profile_type:
              type: string
              x-extensible-enum:
                - BOOTSTRAP
                - VIRTUAL
                - PROVISIONING
                - OPERATIONAL
              description: 'The profile type'
              example: BOOTSTRAP,VIRTUAL
    SubscriptionPackages:
      type: object
      properties:
        items:
          type: array
          maxItems: 255
          items:
            $ref: '#/components/schemas/SubscriptionPackage'
    SubscriptionPackageBase:
      type: object
      properties:
        network_group_id:
          type: integer
          format: int64
          description: 'Internal ID of the operator''s network group to which
            this subscription package belongs. See output of
            [GET/enterprises/network-groups]'
          example: 1234
        commitment_time_in_months:
          type: integer
          minimum: 0
          maximum: 60
          description: 'Time in months when subscriptions can only be moved to
            another subscription package or terminated.'
          example: 36
        freeze_period_in_months:
          type: integer
          minimum: 0
          maximum: 12
          description: 'Time in months when subscriptions can only be
            terminated. May not be longer than commitment period.'
          example: 6
        move_in_fee_with_price_profile_change:
          type: boolean
          description: 'A fee is charged if the price profile also changes
            when moving a subscription into this subscription package'
        move_in_fee_without_price_profile_change:
          type: boolean
          description: 'A fee is charged if the price profile remains the same
            when moving a subscription into this subscription package'
        5g_enabled:
          type: boolean
          description: 'Indicates if this subscription package supports 5G connectivity'
          default: false
        tau_timer:
          description: 'Periodic Tracking Area Update, value in seconds.'
          type: integer
          format: int64
          minimum: 1800
          maximum: 4294967295
          example: 3600
        sms_mo_odb_profile_id:
          type: integer
          maximum: 2147483647
          description: 'SMS firewall Mobile Originating Operator Determined Barrings ID.'
          example: 678
        sms_mt_odb_profile_id:
          type: integer
          maximum: 2147483647
          description: 'SMS firewall Mobile Terminating Operator Determined Barrings ID.'
          example: 789
        ard:
          type: integer
          maximum: 4
          description: "Access Restriction Data\n\n* 0 = UMTS Terrestrial
            Radio Access Network (UTRAN) and GSM/EDGE Radio Access Network
            (GERAN) access allowed\n* 1 = UTRAN access not allowed\n* 2 = GERAN
            access not allowed\n* 3 = 4G access not allowed\n"
          example: 2
        rat_restriction:
          type: array
          description: "Radio Access Technology (RAT) restriction. Any
            combination of following is allowed:\n\n* Fallback to 2G
            restricted\n*  Fallback to 3G restricted\n* LTE access
            rectricted\n* LTE NB-IoT access restricted\n"
          maxItems: 4
          items:
            type: string
            x-extensible-enum:
              - FALLBACK_TO_2G
              - FALLBACK_TO_3G
              - LTE_ACCESS
              - LTE_NBIOT_ACCESS
              - 5G_ACCESS
          example: FALLBACK_TO_2G,LTE_ACCESS
        target_on_pbr_exit:
          type: string
          description: 'ID of target subscription package when exiting
            Parameter Based Registration (PBR, or test mode).'
          minLength: 6
          maxLength: 50
          example: Abc_1234.5-6_SP_222
        network_access_mode:
          type: string
          x-extensible-enum:
            - BOTH
            - ONLY_NON_GPRS
            - ONLY_GPRS
          description: "Network Access Mode (NAM). Allowed choices: \n\n* both
            GPRS and non-GPRS networks\n* only non-GPRS network\n* only GPRS network\n"
        bearer_services:
          type: array
          description: "B2C Business to Consumer\n\nCC Consumer
            Connectivity\n\nCLIP Calling Line Identification Presentation\n\n
            CSD Circuit Switched Data\n\nGPRS General Packet Radio Service\n\n
            LTE Long-Term Evolution\n\nMTC Machine Type Communication\n\nSMSMO
            Short Message Service, Mobile Originated\n\nSMSMT Short Message
            Service, Mobile Terminated\n\nVoice"
          maxItems: 10
          items:
            type: string
            x-extensible-enum:
              - B2C
              - CC
              - CLIP
              - CSD
              - GPRS
              - LTE
              - MTC
              - SMSMO
              - SMSMT
              - VOICE
            example: VOICE, CLIP
        barring_services:
          type: array
          description: "BAIC Barring of All Incoming Calls\n\nBAOC Barring of
            All Outgoing Calls\n\nBOIC Barring of All Outgoing International
            Calls\n\nOPBOPRE Barring of Outgoing Premium Rate Calls
            (Entertainment)"
          maxItems: 4
          items:
            type: string
            x-extensible-enum:
              - BAOC
              - BAIC
              - BOIC
              - OBOPRE
            example: BAIC,BAOC
        cs_only_in_pause:
          type: boolean
          default: false
          description: 'Circuit-switched service only in paused state'
        apns:
          type: array
          maxItems: 10
          description: 'Access Point Name network identifier. Globally unique,
            case insensitive. Numbers, letters, hyphen and dot allowed.'
          example: my.internet.apn
          items:
            type: string
        roaming_profile_2g3g:
          description: 'Roaming profile 2G/3G'
          allOf:
            - $ref: '#/components/schemas/BasicData'
        roaming_profile_lte:
          description: 'LTE roaming profile'
          allOf:
            - $ref: '#/components/schemas/BasicData'
        roaming_profile_lte_v2:
          description: 'LTE roaming profile V2'
          allOf:
            - $ref: '#/components/schemas/BasicData'
        ims:
          description: 'IP Multimedia Subsystem'
          allOf:
            - $ref: '#/components/schemas/BasicData'
        policy_control:
          description: 'Policy control is applied to APNs and defines the data
            volume, Quality of Service (QoS) and reset period.'
          allOf:
            - $ref: '#/components/schemas/BasicData'
        camel_profile:
          type: object
          description: 'Customized Applications for Mobile networks Enhanced
            Logic (CAMEL) profile.'
          allOf:
            - $ref: '#/components/schemas/CamelProfile'
        external_service:
          description: 'Operator-defined external service which is available
            for the enterprise.'
          allOf:
            - $ref: '#/components/schemas/BasicData'

  /euiccs/{id}/download:
    post:
      tags:
      - Localization
      summary: Initiate the download of a subscription profile to an eUICC
      description: Initiates the download of a subscription profile to an eUICC, without the eUICC being localized or relocalized during the process. A download fee applies. Later, the eUICC can be localized to the locale that matches the downloaded subscriptions. In this case, only an enable fee applies during the localization. This way, a two-step localization can be achieved.
      operationId: downloadV1
      parameters:
      - name: id
        in: path
        description: 20-30 or 32 hexadecimal digit eUICC ID
        required: true
        schema:
          type: string
      - name: localeId
        in: query
        description: Locale ID
        required: true

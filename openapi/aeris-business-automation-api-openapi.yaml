      type: http
      scheme: bearer
      bearerFormat: JWT
    Oauth2_auth:
      type: oauth2
      flows:
        password:
          tokenUrl: /iot/api/auth/token
          scopes:
            triggered-actions.read: Access right to read a triggered action.
            triggered-actions.write: Access right to write a triggered action.
            rulesets.read: Access right to read a rulesets.

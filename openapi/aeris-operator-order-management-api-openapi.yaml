        - $ref: '#/components/schemas/RoamingProfile4g'
    CreateDedicatedInternetServiceRequest:
      required:
        - orderedFor
        - parameters
        - type
      type: object
      properties:
        type:
          type: string
          example: CREATE_DEDICATED_INTERNET_DATA_SERVICE
        orderedFor:
          type: string
          description: The organization ID for which this order is made.
          example: "3.77"
        parameters:
          allOf:
            - $ref: '#/components/schemas/ExtendedDedicatedInternetServiceRequest'
            - type: object
              properties:
                operatorNetworkId:
                  type: string
                  description: Network group ID
                  example: "538"
      discriminator:
        propertyName: type
    ExtendedDedicatedInternetServiceRequest:
      required:
        - packetGws
      allOf:
        - $ref: '#/components/schemas/DedicatedInternetServiceRequest'
        - type: object
          properties:
            name:
              type: string
              description: The name of the APN in Service portal.
              example: Ericsson-foo.com
            description:
              type: string
              description: The description of the APN in Service portal.
              example: Some description
            supplierDnsHosted:
              type: boolean
              description: |
                A boolean indicating whether the APN is resolved by the IoTA DNS or the DNS of the operator.
                If it is true, the Ericsson DNS will be responsible for resolving the APN.
                Then the dnsPlmnIds parameters need to be provided in order to know the DNS zone, and the APN must end with a specific suffix.
              example: true
            dnsPlmnIds:
              type: array
              description: "When supplierDnsHosted is true, the dnsPlmnIds needs to be provided."
              example:
                - "123456"
                - "777888"
              items:
                type: string
            packetGws:
              type: array
              description: the EPGs where the APN are created.
              items:
                $ref: '#/components/schemas/ExtendedDedicatedInternetServiceRequest_packetGws'
            sessionTimeoutTimer:
              type: integer
              description: |
                The number of minutes that the session timer timed out. Set to 0 means that the session will not time out.
                 The default value is 0.
              format: int32
              example: 0
            idleTimeoutTimer:
              type: integer
              description: |
                The number of minutes that the idle timer timeout.
                 When the traffic idle time exceeds the specified value, the session will be reset.
                 The default value is 60.
              format: int32
              example: 60
            isDefaultAPN:
              type: boolean
              description: A boolean indicating whether the APN of the ESM Context should
                set to default.
              example: false
            apnOiReplacement:
              type: string
              description: This attribute indicates the domain name to replace the APN

      # Introduction

      This document describes the IoT Accelerator Number management API that
      provides resources to retrieve number management inventory and details.
      The Number management API is based on the Representational State Transfer
      (REST) interface.
      From this point on, the Number management API is referred to as API in this
      document.

      ## Scope

      This document covers the following topics:

      — An overview of the API

      — A detailed description of all operations offered by the API

      ## Prerequisites
      In this document, it is assumed that the user is familiar with
      the following:

      — Java Script Object Notation (JSON)

      — Basic understanding of REST web services

      — The [OpenAPI Initiative](https://www.openapis.org/) for the
        standardized format used in this document.

      ## Related Information
      The definition and explanation of acronyms and terminology and
      typographic conventions can be found in the following documents:

      — IoTA Glossary of Terms and Acronyms

      — Typographic Conventions

      # General API Guidelines

      ## Compatibility

      API audience must be prepared for compatible API extensions:

      - Be tolerant with unknown fields in the payload (see also Fowler’s
        "TolerantReader" post), i.e. ignore new fields but do not eliminate
        them from payload if needed for subsequent PUT requests.
      - Be prepared that "x-extensible-enum" return parameter may deliver
        new values. Either be agnostic or provide default behavior for
        unknown values.
      - Be prepared to handle HTTP status codes not explicitly specified in
        endpoint definitions.
      - Follow the redirect when the server returns HTTP status 301 Moved
        Permanently.

      ## Security

      This section describes the security measures in the API. Security
      measures include authentication, authorization, and encryption.

      ### Authentication and Authorization

      The API uses OAuth2 and OpenID Connect (OIDC) for authentication and
      authorization.

      All API endpoints require authentication, which is performed by passing
      a token in the Authorization header in each request, preceded by
      the word Bearer and a space. See the following example:
      ```
      curl -i -X GET "http://<baseURL>/iot/api/nm"
      -H "Content-Type: application/json"
      -H "Authorization: Bearer <TOKEN_GOES_HERE>"
      ```
      To fetch the token using e.g. curl, submit the following:
      ```
      curl -X POST "https://<baseURL>/iot/api/auth/token"
      -H "Accept: application/vnd.dcp-v1+json"
      -H "Content-Type: application/x-www-form-urlencoded"
      -d "grant_type=password&client_id=<client_id>
      &username=<username>&password=<password>"
      ```
      ### Encryption

      All API requests are encrypted using the HTTPS protocol to grant secure
      data transfer.

      ### Permission

      API endpoints permissions are authorized by authorization server based
      on the account roles. Required permissions for this API are documented
      in 'securitySchemes' section. You can view available permissions for
      your account through permission library in Service Portal by navigating
      Administration > Users & roles > Permission library or
      Role administration > Actions > View permission library. Make sure
      permission is available to your account before you start utilizing this
      API.

      Below shows the permissions related to the endpoints in this API:

        API: View Subscriptions


      ## Deprecation

      API deprecation will be reflected in the OpenAPI definition. If a method
      on a path, a whole path or even a whole API endpoint (multiple paths)
      should be deprecated, they will be marked as deprecated.
      During deprecation phase, a Deprecation header and a Sunset header fields
      will be added in the response.

      Example:
      ```
      Deprecation: Tue, 31 Dec 2024 23:59:59 GMT
      Sunset: Wed, 31 Dec 2025 23:59:59 GMT
      ```

      API audience should not start using a deprecated API.

      API audience is encouraged to monitor for Deprecation and Sunset header.


  

aid: aeris
name: Aeris
description: Aeris is a cellular IoT connectivity company, founded in 1992 and headquartered in San Jose,
  California, that operates a global network and connectivity management platform purpose-built for machines
  rather than phones. Aeris provides SIM and eSIM/eUICC lifecycle management, device provisioning and
  activation, rate-plan and bundle management, usage and signalling analytics, SMS messaging, and IoT
  security monitoring to automotive, utilities, logistics, medical-device and industrial customers. In
  February 2023 Aeris acquired Ericsson's IoT Accelerator and Connected Vehicle Cloud businesses, and
  the IoT Accelerator platform now runs under the Aeris name and serves the bulk of its published API
  surface alongside the older Aeris-native AerAdmin, AerFrame and AerTraffic connectivity APIs and the
  Aeris IoT Watchtower security API.

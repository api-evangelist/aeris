      summary: Get order list
      description: Query order list.
      operationId: getOrderList
      parameters:
        - name: cursor
          in: query
          description: |
            Opaque string returned within the meta object response on endpoints which support pagination.
             Indicates that more results are available and can be used as the 'cursor' parameter in the next request to return the next page of results.
              The last page of results will not have a 'next' present.
          schema:
            type: string
          example: DFVSDB3434%DFB%EYY445
        - name: limit
          in: query
          description: "The maximum number of entries to return. If the value exceeds\
            \ the maximum, then the maximum value will be used."
          schema:
            type: integer
            example: 100
            default: 100
        - name: q
          in: query
          description: |
            Filter parameter which supports the RSQL filter syntax.
            RSQL is a super-set of the Feed Item Query Language (FIQL).
            Note! The query string must be URL encoded.
            Supported fields:
              - status
              - type
          schema:
            type: string
            example: status==DRAFT;type==CREATE_2G3G_RP
      responses:
        "200":
          description: OK
          allOf:
            - $ref: '#/components/responses/RateLimitedResponse'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetOrderListResponse'
        "400":
          description: Bad Request
          headers:
            Content-Type:
              $ref: '#/components/headers/Content-Type'
          content:

components:
  schemas:
    numberSchemes:
      type: object
      properties:
        numberSchemes:
          type: array
          items:
            $ref: '#/components/schemas/numberScheme'
        next:
          type: string
    numberScheme:
      type: object
      description: |
        Number Scheme information.
      properties:
        schemeId:
          type: string
          description: ID of Scheme.
          example: 'TESTOPPREFSCHEME00021'
        hlrRID:
          type: integer
          format: int32
          description: Specific Id of the HLR.
          example: 0
        schemeName:
          type: string
          description: The name of the number scheme.
          example: 'NS022311'
        regionEnabled:
          type: boolean
          description: Check for region enabled.
          example: false
        hosted:
          type: boolean
          description: True for sims on DCP platform
          example: true
        rangeDuplication:
          type: boolean
          description: Check for range duplicates.
          example: false
    imsiRanges:
      type: object
      properties:
        imsiStores:
          type: array
          items:
            $ref: '#/components/schemas/imsiStore'
        next:
          type: string
    imsiStore:
      type: object
      description: |
        Imsi Store information.
      properties:
        rangeName:
          type: string
          description: Name of the Imsi Range
          example: "IMSI_LPWA_4405250720033083"
        rangeDesc:
          type: string
          description: Description of the Imsi Range.
          example: "IMSI_LPWA_44052507"
        date:
          type: string
          description: Date
          example: "2018-05-29T09:56:56Z"
        imsiRangeNo:
          type: integer
          format: int64
          description: Number for Imsi Range.
          example: 3083
        dcpImsiId:
          type: string
          description: Imsi Id for DCP
          example: "KDCIMSI020033083"
        rangeDetails:
          $ref: '#/components/schemas/rangeDetails'

    msisdnRanges:
      type: object
      properties:
        msisdnStores:
          type: array
          items:
            $ref: '#/components/schemas/msisdnStore'
        next:
          type: string

    msisdnStore:
      type: object
      properties:
        status:
          type: string
          description: Status of the Msisdn Range.
          example: "ACTIVE"
        msisdnRangeno:
          type: integer
          format: int64
          description: Number for MSISDN Range.
          example: 3083
        orderId:
          type: string
          description: Order Id of the Msisdn Range.
          example: "INT300000011300"
        rangeDetails:
          $ref: '#/components/schemas/rangeDetails'

    msisdnPools:
      type: object
      properties:
        pools:
          type: array
          items:
            $ref: '#/components/schemas/msisdnPoolDetail'
        next:
          type: string

    msisdnPoolDetail:
      type: object
      description: |
        MSISDN pool information.
      properties:
        poolId:
          type: string
          description: Id of Msisdn Pool.
          example: "TESTOPPREFMSISDNP00002"
        status:
          type: string
          description: Status of Msisdn Pool.
          example: "Active"
        poolData:
          $ref: '#/components/schemas/poolData'

    poolData:
      type: object
      description: |
        Pool data.
      properties:
        shortName:
          type: string
          description: The name of MSISDN pool used in the number scheme.
          example: "pool22312"
        poolDesc:
          type: string
          description: Description of Msisdn Pool.
          example: "Test pool"
        quarantinePeriod:
          type: integer
          format: int32
          description: Number of days the MSISDNs are locked before being made
            available for reallocation
          example: 60
        numberLength:
          type: integer
          format: int32
          description: Length of number.
          example: 15

    rangeDetails:
      type: object
      description: |
        Range information.
      properties:
        nextNumber:
          type: string
          description: Next number in the range.
          example: "440525070026589"
        freeAmount:
          type: integer
          format: int64
          description: The free amount in the number range
          example: 0
        reservedFor:
          type: string
          description: Status of the Range.
          example: "NOTRESERVED"
        numberRange:
          $ref: '#/components/schemas/numberRange'

    numberRange:
      type: object
      description: |
        Number Range information.
      properties:
        startNumber:
          type: string
          description: The IMSI/MSISDN with which the range starts.
          example: "440525070026500"
        endNumber:
          type: string
          description: The IMSI/MSISDN with which the range ends.
          example: "440525070026799"
        amount:
          type: integer
          format: int64
          description: Difference between start and end number.
          example: 100

    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri
          description: |
            An absolute URI that identifies the problem type.
            When dereferenced, it SHOULD provide human-readable
            documentation for the problem type (e.g., using HTML).
          default: about:blank
          example: https://your.api.documentation.url
        title:
          type: string
          description: |
            A short, summary of the problem type. Written in english and
            readable for engineers (usually not suited for non technical
            stakeholders and not localized); example: Service Unavailable
        status:
          type: integer
          format: int32
          description: |
            The HTTP status code generated by the origin server for
            this occurrence of the problem.
          minimum: 100
          maximum: 600
          exclusiveMaximum: true
          example: 503
        detail:
          type: string
          description: |
            A human readable explanation specific to this occurrence of the
            problem.
          example: Connection to database timed out
        instance:
          type: string
          description: |
            An absolute URI that identifies the specific occurrence of the
            problem. It may or may not yield further information
            if dereferenced.

  responses:
    RateLimitedResponse:
      headers:
        X-RateLimit-Limit-Second:
          $ref: '#/components/headers/X-RateLimit-Limit-Second'
        X-RateLimit-Limit-Minute:
          $ref: '#/components/headers/X-RateLimit-Limit-Minute'
        X-RateLimit-Remaining-Second:
          $ref: '#/components/headers/X-RateLimit-Remaining-Second'
        X-RateLimit-Remaining-Minute:
          $ref: '#/components/headers/X-RateLimit-Remaining-Minute'
        Content-Type:
          $ref: '#/components/headers/Content-Type'
    NumberSchemesResponse:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/numberSchemes'
          examples:
            number-schemes:
              value:
                numberSchemes:
                  - schemeId: "TESTOPPREFSCHEME00021"
                    hlrRID: 0
                    schemeName: "NS022311"
                    regionEnabled: false
                    hosted: true
                    rangeDuplication: true
                next: "/number-schemes?organizationId=05000001\
                      &limit=10&cursor=ODk0NTA0MjExNzEyMDYwMjIyMjI="
      description: OK
      allOf:
        - $ref: '#/components/responses/RateLimitedResponse'
    NumberSchemeResponse:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/numberScheme'
          example:
            schemeId: "TESTOPPREFSCHEME00021"
            hlrRID: 0
            schemeName: "NS022311"
            regionEnabled: false
            hosted: true
            rangeDuplication: true
      description: OK
      allOf:
        - $ref: '#/components/responses/RateLimitedResponse'

    ImsiRangesResponse:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/imsiRanges'
          examples:
            imsiRanges:
              value:
                imsiStore:
                  - startNumber: "440525070026500"
                    endNumber: "440525070026799"
                    amount: 100
                    nextNumber: "686187022311006"
                    freeAmount: 0
                    reservedFor: "NOTRESERVED"
                    rangeName: "IMSI_LPWA_4405250720033083"
                    rangeDesc: "IMSI_LPWA_44052507"
                    date: "2018-05-29T09:56:56Z"
                    imsiRangeNo: 3083
                    dcpImsiId: "KDCIMSI020033083"
                next: "/imsi-ranges?organizationId=0500001&schemeId=ZZRSCHEME01
                      &limit=10&cursor=ODk0NTA0MjExNzEyMDYwMjIyMjI="
      description: OK
      allOf:
        - $ref: '#/components/responses/RateLimitedResponse'

    ImsiRangeResponse:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/imsiStore'
          example:
            startNumber: "440525070026500"
            endNumber: "440525070026799"
            amount: 100
            nextNumber: "686187022311006"
            freeAmount: 0
            reservedFor: "NOTRESERVED"
            rangeName: "IMSI_LPWA_4405250720033083"
            rangeDesc: "IMSI_LPWA_44052507"
            date: "2018-05-29T09:56:56Z"
            imsiRangeNo: 3083
            dcpImsiId: "KDCIMSI020033083"
      description: OK
      allOf:
        - $ref: '#/components/responses/RateLimitedResponse'

    MsisdnPoolsResponse:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/msisdnPools'
          examples:
            msisdnPoolDetail:
              value:
                pools:
                  - shortName: "pool22312"
                    poolDesc: "Test pool"
                    quarantinePeriod: 60
                    numberLength: 15
                    poolId: "TESTOPPREFMSISDNP00002"

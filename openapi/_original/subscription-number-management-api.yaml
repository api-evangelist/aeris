        format: int32
    X-RateLimit-Limit-Minute:
      description: The maximum number of requests allowed in a minute.
      schema:
        type: integer
        format: int32
    X-RateLimit-Remaining-Second:
      description: The number of requests remaining in a second.
      schema:
        type: integer
        format: int32
    X-RateLimit-Remaining-Minute:
      description: The number of requests remaining in a minute.
      schema:
        type: integer
        format: int32

  parameters:
    Header-Authorization:
      name: Authorization
      in: header
      required: true
      description: A valid token string in the form Bearer <token string>
      schema:
        type: string
    limitParam:
      in: query
      name: limit
      schema:
        type: integer
        default: 100
      description: |
        Specifies the maximum number of results to be returned.
        Allowed interval is 1-10000.
    cursorParam:
      in: query
      name: cursor
      schema:
        type: string
      example: 'DFVSDB3434%DFB%EYY445'
      description: |
        Encoded string parameter used for pagination. This field is
        automatically populated in the response field "next" if there
        are more results in the system than delivered in the response.

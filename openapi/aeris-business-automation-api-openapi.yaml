                type: string
              enterpriseName:
                type: string
    TriggeredActionsSummaryResponse:
      type: object
      properties:
        statistics:
          type: array
          items:
            type: object
            properties:
              action:
                type: string
              actionCountForLast24Hours:
                type: integer
                format: int32
              actionCount7DaysBefore:
                type: integer
                format: int32
    Level:
      type: string
      x-extensible-enum:
        - ENTERPRISE
        - SUBSCRIPTION_PACKAGE
        - SUBSCRIPTION
        - PRICE_PROFILE
      description: |
        The affected subscriptions of the Ruleset depend on the target
        set for the ruleset. Four different targets are supported.
        - ENTERPRISE: All current and future subscriptions of the corresponding
        enterprises
        - SUBSCRIPTION_PACKAGE: All current and future subscriptions within the
        corresponding subscription packages.
        - SUBSCRIPTION: Only a single subscription.
        - PRICE_PROFILE: Price profile of an Enterprise (shared bundle triggers)
      example: SUBSCRIPTION_PACKAGE
    Category:
      type: string
      x-extensible-enum:
        - FRAUD_PREVENTION
        - LIFE_CYCLE_MANAGEMENT
        - COST_PREVENTION
        - FAULT_DETECTION
        - CUSTOM
      description: |
        The category identifies purpose of creating ruleset.
        The values must be selected from Enum Category only
        DEFAULT : CUSTOM
    RuleType:
      type: string
      x-extensible-enum:
        - DEVICE_CHANGE
        - DATA_USAGE
        - SMS_USAGE
        - NETWORK_EVENT
        - NETWORK_CHANGE
        - TIME_BASED
        - DATA_SESSION
        - SHARED_BUNDLE_USAGE
    Conditions:
      type: object
      properties:
        details:
          anyOf:
            - $ref: '#/components/schemas/ImsiLockCondition'
            - $ref: '#/components/schemas/DataUsageCondition'
            - $ref: '#/components/schemas/SmsUsageCondition'
            - $ref: '#/components/schemas/NetworkEventCondition'
            - $ref: '#/components/schemas/NetworkAgreementCondition'
            - $ref: '#/components/schemas/TimeBasedCondition'
            - $ref: '#/components/schemas/DataSessionCondition'
            - $ref: '#/components/schemas/SharedBundleUsageCondition'
      description: |
        The detail object depends on the ruleset type selected. <br>
        If RuleType = DEVICE_CHANGE , details object should be of ImsiLockCondition <br>
        If RuleType = DATA_USAGE , details object should be of DataUsageCondition <br>
        If RuleType = SMS_USAGE , details object should be of SmsUsageCondition <br>
        If RuleType = NETWORK_EVENT , details object should be of NetworkEventCondition <br>
        If RuleType = NETWORK_CHANGE , details object should be of NetworkAgreementCondition <br>
        If RuleType = TIME_BASED , details object should be of TimeBasedCondition <br>
        If RuleType = DATA_SESSION , details object should be of DataSessionCondition <br>
        If RuleType = SHARED_BUNDLE_USAGE , details object should be of SharedBundleUsageCondition <br>

        Though condtions is an array, currently only one condition can be added.
    ImsiLockCondition:
      type: object
      properties:
        type:
          type: string
          enum:
            - IS_CHANGED
            - DOES_NOT_MATCH_TO_ASSIGNED_DEVICE
            - DOES_NOT_MATCH_IMEI_RANGE
        imeiRange:
          type: array
          items:
            type: string
    SharedBundleUsageCondition:
        type: object
        properties:
          bundleType:
            type: string
            enum:
                - GPRS
                - SMS
                - VOICE
                - CSD
          threshold:
            type: integer
            format: int64
          timeRangeType:
            type: string
            enum:
                - RANGE_BEGINNING_OF_MONTH
          eventType:
            type: string
            enum:
                - CDR
    DataUsageCondition:
      type: object
      properties:
        type:
          type: string
          enum:
            - MORE_THAN
            - LESS_THAN
        threshold:
          type: integer
          format: int64
        timeRangeType:
          type: string
          enum:
            - RANGE_1_WEEK
            - RANGE_BEGINNING_OF_MONTH
            - RANGE_UNLIMITED_PERIOD
            - RANGE_1_HOUR
            - RANGE_24_HOUR
            - RANGE_CURRENT_SP
        trafficType:
          type: string
          enum:
            - DATA
            - SMS
        zoneType:
          type: string
          enum:
            - ALL_NETWORKS
            - HOME_NETWORK
            - ROAMING
            - NOT_IN_ZONES
            - IN_ZONE1
            - IN_ZONE2
            - NOT_IN_ZONE1
            - NOT_IN_ZONE2
    SmsUsageCondition:
      type: object
      properties:
        type:
          type: string
          enum:
            - SMS_MO_OVERRUN
            - SMS_MT_OVERRUN
        threshold:
          type: integer
          format: int64
        timeRangeType:
          type: string
          enum:
            - RANGE_1_WEEK
            - RANGE_BEGINNING_OF_MONTH
            - RANGE_UNLIMITED_PERIOD
            - RANGE_1_HOUR
            - RANGE_24_HOUR
            - RANGE_CURRENT_SP
        eventType:
          type: string
          enum:
            - XDR
            - CDR
    NetworkEventCondition:
      type: object

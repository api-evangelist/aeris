  /euiccs/{id}/delete:
    post:
      tags:
      - Localization
      summary: Initiate the deletion of a subscription profile from an eUICC.
      description: |-
        Initiates the deletion of a subscription profile from an eUICC. Only disabled subscription profiles can be deleted from the eUICC. The bootstrap subscription profile cannot be deleted. To delete an enabled subscription profile, you have to disable it first by localizing the eUICC to a locale that does not match with the currently enabled subscription profile.

        Details of the related service request are returned indicating if initiating the profile deletion was successful. Finishing the actual profile deletion can take more time.

        To be permitted to delete a subscription profile, the user needs access rights to the currently enabled profile and to the profile to be deleted.
        
        In version v1 of the API, the localeId is required, while in v2 either localeId or iccId is required.
      operationId: deleteV1

        - $ref: '#/components/parameters/Header-Accept-Version'
        - name: Accept
          in: header
          description: Accept content-type and schemas by the client
          content:
            application/json:
              schema:
                type: string
        - name: id
          in: path
          description: Activation code assigned entity id.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          allOf:
            - $ref: '#/components/responses/RateLimitedResponse'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivationCodeItem'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '405':
          $ref: '#/components/responses/405'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        default:
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
        - OAuth2:
            - 'cnx_ss_euicc_activationcode_ro'
    delete:
      tags:
        - 'Activation codes'
      summary: Delete activation code by assigned entity id
      operationId: deleteActivationCode
      description: Delete activation code entity. The entity is referred to using the unique entity id which is assigned to the entry when the activation code is stored.
      parameters:
        - $ref: '#/components/parameters/Header-Content-Type'
        - $ref: '#/components/parameters/Header-Accept-Version'
        - name: Accept
          in: header
          description: Accept content-type and schemas by the client
          content:
            application/json:
              schema:
                type: string
        - name: id
          in: path
          description: Activation code assigned entry id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted
          allOf:
            - $ref: '#/components/responses/RateLimitedResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '405':
          $ref: '#/components/responses/405'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        default:
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
        - OAuth2:
            - 'cnx_ss_euicc_activationcode_man'
    put:
      tags:
        - 'Activation codes'
      summary: Update activation code by assigned entity id
      operationId: updateActivationCode
      description: Update activation code entry. The entity is referred to using the unique entity id which is assigned to the entry when the activation code is stored.
      parameters:
        - $ref: '#/components/parameters/Header-Content-Type'
        - $ref: '#/components/parameters/Header-Accept-Version'
        - name: Accept
          in: header
          description: Accept content-type and schemas by the client
          content:
            application/json:
              schema:
                type: string
        - name: id
          in: path
          description: Activation code assigned entry id
          required: true
          schema:
            type: string
      requestBody:
        description: ActivationCodeUpdate
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivationCodeUpdate'
        required: true
      responses:
        '200':
          description: Updated
          allOf:
            - $ref: '#/components/responses/RateLimitedResponse'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivationCodeItem'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '405':
          $ref: '#/components/responses/405'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        default:
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
        - OAuth2:
            - 'cnx_ss_euicc_activationcode_man'
  /activation-codes/request-id/{id}:
    get:
      tags:

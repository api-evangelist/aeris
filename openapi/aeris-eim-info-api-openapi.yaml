  examples:
    EimInfoExample:
      value:
        entityId: "EIM000000000006"
        eimId: "1.3.6.1.4.1.31746.1.800.102.1.3.2.12"
        eimName: "AerisEIMFQDN2"
        eimIdType: "EIM_ID_TYPE_FQDN"
        eimFqdn: "eim.iot.fqdn.aeris.com"
        supportedProtocols:
          - "EIM_RETRIEVE_HTTPS"
          - "EIM_RETRIEVE_COAPS"
          - "EIM_INJECT_HTTPS"
          - "EIM_INJECT_COAPS"
          - "EIM_PROPRIETARY"
        indirectProfileDownload: false
    EimInfoListExample:
      value:
        - entityId: "EIM000000000006"
          eimId: "1.3.6.1.4.1.31746.1.800.102.1.3.2.12"
          eimName: "AerisEIMFQDN2"
          eimIdType: "EIM_ID_TYPE_FQDN"
          eimFqdn: "eim.iot.fqdn.aeris.com"
          supportedProtocols:
            - "EIM_RETRIEVE_HTTPS"
            - "EIM_RETRIEVE_COAPS"
            - "EIM_INJECT_HTTPS"
            - "EIM_INJECT_COAPS"
            - "EIM_PROPRIETARY"
          indirectProfileDownload: false

    EuiccEimListExample:
      value:
        - eim_id: "1.2.3.4"
          eim_fqdn: "eim.enterprise-x.example"
          eim_id_type: "EIM_ID_TYPE_OID"
          indirect_profile_download: true

  parameters:
    Header-Accept:
      name: Accept
      in: header
      description: Accept content-type by the client
      schema:
        type: string
    Header-Accept-Version:
      name: Accept-Version
      in: header
      description: Accept version of the response
      schema:
        type: string
    Header-Content-Type:
      name: Content-Type
      in: header
      description: Content-Type
      schema:
        type: string

  headers:
    Content-Type:
      description: Handle Content-Type
      schema:
        type: string
    X-RateLimit-Limit-Second:
      description: The maximum number of requests allowed in a second.
      schema:
        type: integer
        format: int32
    X-RateLimit-Limit-Minute:
      description: The maximum number of requests allowed in a minute.
      schema:
        type: integer
        format: int32
    X-RateLimit-Remaining-Second:
      description: The number of requests remaining in a second.
      schema:
        type: integer

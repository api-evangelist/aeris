    # Introduction

    This document describes the IoT Accelerator Business Analytics Report API that provides report and invoice resources
    to retrieve an organization's report and invoice information.
    The Business Analytics Report API is based on the Representational State Transfer (REST) interface.
    From this point on, the Business Analytics API is referred to as API in this document.

    ## Scope

    Business Analytics Report API provides operations to query the available reports, invoices and usage data. The API users can download desired report, invoice data files and usage data files according to the information in reports, invoices and usage data query response. This API also provides operation to delete invoice data files.

    <b>Currently supported operations:</b>

     * Query reports
     * Download report data file
     * Query invoices
     * Download invoice data file
     * Delete invoice data file
     * Query useage data
     * Download usage data file
     * Query the top subscriptions with most traffic usage

    ## Prerequisites
    In this document, it is assumed that the user is familiar with the following:

    — Java Script Object Notation (JSON)

    — Basic understanding of REST web services

    — The [OpenAPI Initiative](https://www.openapis.org/) for the standardized format used in this document.

    ## Related Information

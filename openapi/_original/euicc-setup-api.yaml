components:
  schemas:
    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri
          description: |
            An absolute URI that identifies the problem type. When dereferenced,
            it SHOULD provide human-readable documentation for the problem type
            (e.g., using HTML).
          default: about:blank
          example: https://your.api.documentation.url
        title:
          type: string
          description: |
            A short, summary of the problem type. Written in english and readable
            for engineers (usually not suited for non technical stakeholders and
            not localized)
          example: 'Service Unavailable'
        status:
          type: integer
          format: int32
          description: |
            The HTTP status code generated by the origin server for this occurrence
            of the problem.
          minimum: 100
          maximum: 600
          exclusiveMaximum: true
          example: 503
        detail:
          type: string
          description: |
            A human readable explanation specific to this occurrence of the
            problem.
          example: Connection to database timed out
        instance:
          type: string
          description: |
            An absolute URI that identifies the specific occurrence of the problem.
            It may or may not yield further information if dereferenced.
          example: 'https://api.documentation.url/request-id'
    ActivationCodeList:
      required:
        - name
        - organizationId
      type: array
      items:
        $ref: '#/components/schemas/ActivationCodeItem'
    ActivationCodeStateParam:
      type: string
      description: The state in which the activation code should be stored. In DRAFT state, the entity is still modifiable and will not be issued to any eUICCs. When AVAILABLE, the code entity can not be modified and may be assigned and issued to an eUICC. When RESERVED, the code has been assigned to an eUICC. When REMOVED, the profile referred to by the activation code has been deleted, and the code cannot be used anymore.
      enum:
        - DRAFT
        - AVAILABLE
        - RESERVED
        - REMOVED        
    ActivationCodeItem:
      required:
        - id
        - code
        - organizationId
        - state
        - localizationTableId
        - localeId
        - added
      type: object
      properties:
        id:
          type: string
          description: The assigned unique entity id.
        code:
          type: string
          description: The activation code.
        organizationId:
          type: string
          description: The owner of the profile referred to by the activation code.
        euiccId:
          type: string
          description: The EID of the eUICC the code is assigned to, or planned for.
        iccId:
          type: string
          description: The ICC of the profile referred to by the activation code.
        state:
          type: string
          description: The state in which the activation code should be stored. In DRAFT state, the entity is still modifiable and will not be issued to any eUICCs. When AVAILABLE, the code entity can not be modified and may be assigned and issued to an eUICC. When RESERVED, the code has been assigned to an eUICC. When DELETED, the profile referred to by the activation code has been deleted, and the code cannot be used anymore.
          enum:
            - DRAFT
            - AVAILABLE
            - RESERVED
            - REMOVED
        localizationTableId:
          type: integer
          format: int64
        localeId:
          type: string
        added:
          type: string
          format: date-time
        addedRequestId:
          type: string
        issued:
          type: string
          format: date-time
          description: The date when the activation code was issued to an eUICC.
        issuedRequestId:
          type: string
    ActivationCodeUpdate:
      type: object
      properties:
        code:
          type: string
          description: The activation code.
        euiccId:
          type: string
          description: The EID of the eUICC the code is assigned to, or planned for.
        iccId:
          type: string
          description: The ICC of the profile referred to by the activation code.
        state:
          type: string
          description: The state in which the activation code should be stored. In DRAFT state, the entity is still modifiable and will not be issued to any eUICCs. When AVAILABLE, the code entity can not be modified and may be assigned and issued to an eUICC.
          enum:
            - DRAFT
            - AVAILABLE
        localizationTableId:
          type: integer
          format: int64
        localeId:
          type: string
    StoreActivationCodeRequest:
      required:
        - localizationTableId
        - localeId
        - codes
      type: object
      properties:
        localizationTableId:
          type: integer
          format: int64
        localeId:
          type: string
        activationCodeType:
          type: string
          description: |
            Type of activation code to apply uniformly to all rows
            
            **Note:** For EXTERNAL, both states i.e. DRAFT and AVAILABLE can be provided, for INTERNAL, only AVAILABLE state is allowed.
          enum:
            - INTERNAL
            - EXTERNAL
          default: EXTERNAL
        codes:
          type: array
          items:
            $ref: '#/components/schemas/ActivationCodeInsert'
    ActivationCodeInsert:
      required:
        - code
        - state
      type: object
      properties:
        code:
          type: string
          description: The activation code.
        euiccId:
          type: string
          description: The EID of the eUICC the code is assigned to, or planned for.
        iccId:
          type: string
          description: The ICC of the profile referred to by the activation code.
        imsi:
          type: string
          description: The IMSI associated with the activation code. Required when activationCodeType is INTERNAL. Must be 14 or 15 numeric digits.
        state:
          type: string
          description: The state in which the activation code should be stored. In DRAFT state, the entity is still modifiable and will not be issued to any eUICCs. When AVAILABLE, the code entity can not be modified and may be assigned and issued to an eUICC.
          enum:
            - DRAFT
            - AVAILABLE
    ExportActivationCodeRequest:
      type: object
      required:
        - organizationId
      properties:
        organizationId:
          type: array
          description: A list of organizations ids for which activation codes should be listed.
          items:
            type: string
          maxItems: 1000
        euiccId:
          type: array
          description: A list of euicc ids (EIDs) for which activation codes should be listed.
          items:
            type: string
        iccId:
          type: array
          description: A list of ICC ids for which activation codes should be listed.
          items:
            type: string
        profileType:
          type: string
          description: profile type
        state:
          $ref: '#/components/schemas/ActivationCodeStateParam'
          description: Filter activation codes by state
        page:
          type: integer
          minimum: 0
          default: 0
          description: Page number
        limit:
          type: integer
          minimum: 1
          maximum: 10000
          default: 10
          description: Number of items per page
    ActivationCodeImportRequest:
      required:
        - file
        - localizationTableId
        - localeId
      type: object
      properties:
        file:
          type: string
          format: binary
          description: CSV file containing activation code data. Mandatory columns are ICCID and ACTIVATION CODE.
        activationCodeType:
          type: string
          description: Type of activation code to import.
          enum:
            - INTERNAL
            - EXTERNAL
          default: EXTERNAL
        localizationTableId:
          type: integer
          format: int64
          description: Localization table ID to associate the imported codes with.
        localeId:
          type: string
          description: Locale ID within the localization table.
    ActivationCodeImportAcceptedResponse:
      required:
        - jobId
        - status
      type: object
      properties:
        jobId:
          type: string
          description: Unique identifier for the asynchronous import job.
        status:
          type: string
          description: Acceptance status of the import request.
          enum:
            - ACCEPTED
    ImportJobStatusResponse:
      required:
        - jobId
        - status
      type: object
      properties:
        jobId:
          type: string
          description: The import job ID.
        status:
          type: string
          description: The current status of the import job.
          enum:
            - IN_PROGRESS
            - COMPLETED
            - FAILED
        totalFailures:
          type: integer
          format: int64
          description: Total number of rows that failed to import. Only present when the job is not IN_PROGRESS.
        totalSuccess:
          type: integer
          format: int64
          description: Total number of rows successfully imported. Only present when the job is not IN_PROGRESS.
        page:
          type: integer
          description: The requested page of failure rows (0-based). Only present when the job is not IN_PROGRESS.
        pageSize:
          type: integer
          description: The number of failure rows per page. Only present when the job is not IN_PROGRESS.
        failedRows:
          type: array
          description: Paginated list of failed import rows. Only present when the job is not IN_PROGRESS.
          items:
            $ref: '#/components/schemas/ImportFailureRow'
    ImportFailureRow:
      type: object
      properties:
        failureId:
          type: integer
          format: int64
          description: Unique identifier for the failure record.
        rowNumber:
          type: integer
          description: The 1-based row number in the CSV file (excluding the header row).
        iccid:
          type: string
          description: The ICCID from the failed CSV row.
        failureCode:
          type: string
          description: Machine-readable failure reason code.
          enum:
            - EMPTY_ICCID
            - EMPTY_ACTIVATION_CODE
            - DUPLICATE_ICCID_IN_FILE
            - DUPLICATE_ACTIVATION_CODE_IN_FILE
            - DUPLICATE_IMSI_IN_FILE
            - DUPLICATE_MSISDN_IN_FILE
            - DUPLICATE_ICCID_IN_DB
            - DUPLICATE_ACTIVATION_CODE_IN_DB
            - DUPLICATE_IMSI_IN_DB
            - DUPLICATE_MSISDN_IN_DB
            - INVALID_ACTIVATION_CODE_FORMAT
            - INVALID_ICCID_FORMAT
            - DB_INSERT_FAILED
            - BATCH_ROLLBACK
        description:
          type: string
          description: Human-readable description of the failure reason.
        createdDate:
          type: string
          format: date-time
          description: The timestamp when the failure record was created.
    UploadStatusResponse:
      type: object
      properties:
        uisJobId:
          type: string

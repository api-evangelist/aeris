                    createdAt: '2022-08-23T17:32:28Z'
                    modifiedAt: '2022-08-24T17:32:28Z'
                    imsi: '100783000004553'
                    rulesetName: reseller not selectable
                    rulesetId: 17d7a06845755
                    subscriptionPackageId: 200000001_SP_02

    DedicatedInternetServiceRequest:
      required:
      - apn
      - enabled2g3g
      - enabled4g
      - enabled5gNsa
      - ipVersion
      - numberOfSimultaneousSessions
      - subscriptionPackages
      type: object
      properties:
        apn:
          type: string
          description: The name of the APN.
          example: foo.com
        enabled2g3g:
          type: boolean
          description: A boolean indicating whether 2G3G is enabled.
          example: true
        enabled4g:
          type: boolean
          description: A boolean indicating whether 4G is enabled.
          example: true
        enabled5gNsa:
          type: boolean
          description: A boolean indicating whether 5GNSA is enabled.
          example: true
        ipVersion:
          type: string
          description: "The IP version that the devices can use.\n<ul>\n  <li>IPV4: Devices can use IPv4 addressing only.</li>\n  <li>IPV6: Devices can use IPv6 addressing only.</li>\n  <li>IPV4_AND_IPV6: Devices can use both IPv4 and IPv6 in the same bearer.</li>\n  <li>IPV4_OR_IPV6: Devices can use both IPv4 and IPv6, but in different bearers.</li>\n</ul>\n"
          example: IPV4
          x-extensible-enum:
          - IPV4
          - IPV6
          - IPV4_AND_IPV6
          - IPV4_OR_IPV6
        uplinkBandwidth:
          type: integer
          description: An uplink bandwidth(kbps) limit to apply a speed profile on the subscriptions connecting through this APN. If no value is entered, the default value applies, which is defined by the QoS configured by the Operator.
          format: int32
          example: 1024
        downlinkBandwidth:
          type: integer
          description: A downlink bandwidth(kbps) limit to apply a speed profile on the subscriptions connecting through this APN. If no value is entered, the default value applies, which is defined by the QoS configured by the Operator.
          format: int32
          example: 2048
        useSupplierDnsIpV4:
          type: boolean
          description: A boolean indicating whether to set devices' IPv4 DNS. Note! If it is true and no IPv4 DNS addresses are provided, Ericsson will add by default the IoTA IPv4 DNS. The default value is false.
          example: true
        primaryDnsIpV4:
          type: string
          description: The IPv4 address of the primary DNS server.
          example: 8.8.8.8
        secondaryDnsIpV4:
          type: string
          description: The IPv4 address of the secondary DNS server.
          example: 8.8.4.4
        useSupplierDnsIpV6:
          type: boolean
          description: A boolean indicating whether to set devices' IPv6 DNS. Note! If it is true and no IPv6 DNS addresses are provided, Ericsson will add by default the IoTA IPv6 DNS. The default value is false.
          example: true
        primaryDnsIpV6:
          type: string
          description: The IPv6 address of the primary DNS server.
          example: 2001:4860:4860::8888
        secondaryDnsIpV6:
          type: string
          description: The IPv6 address of the secondary DNS server.
          example: 2001:4860:4860::8844
        numberOfSimultaneousSessions:
          type: integer
          description: The estimation of simultaneous connection sessions. It will be used for IP address pool pre-allocation in IoTA.
          format: int32
          example: 1000
        sessionTimeout:
          type: string
          description: The session timeout configuration. If not provided, then system will use default value
          default: NO_SUPERVISION
          x-extensible-enum:
          - NO_SUPERVISION
          - TIMER
        idleTimeout:
          type: string
          description: The idle timeout configuration.
          default: TIMER
          x-extensible-enum:
          - NO_SUPERVISION
          - TIMER
        sendIpV4Dns:
          type: boolean
          description: 'A boolean indicating whether IPV4 DNS is used on the APN.

            Default is false, If ipVersion is ipV6, it must be false.

            Only when it''s true, useSupplierDnsIpV4, primaryDnsIpV4 and secondaryDnsIpV4 are valid.

            '
          default: false
        sendIpV6Dns:
          type: boolean
          description: 'A boolean indicating whether IPV6 DNS is used on the APN.

            Default is false, If ipVersion is ipV4, it must be false.

            Only when it''s true, useSupplierDnsIpV6, primaryDnsIpV6 and secondaryDnsIpV6 are valid.

            '
          default: false

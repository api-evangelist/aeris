  /rulesets/{id}/change-status/{desiredStatus}:
    put:
      tags:
        - Management
      summary: Update ruleset status
      description: |
        Update an existing ruleset by status.

        'desiredStatus' can be ENABLED, DISABLED or DRAFT

        ### The following status transition are allowed to an existing ruleset:
        - from DRAFT to ENABLED
        - from ENABLED to DISABLED
        - from ENABLED to DRAFT
        - from DISABLED to ENABLED
        - from DISABLED to DRAFT

      operationId: updateRulesetStatus
      requestBody:
        content:
          application/json:
            schema:
              type: object
      parameters:
        - name: id
          in: path
          description: rulesetId
          required: true
          schema:
            type: string
            example: 181ec4a9d9657
        - name: desiredStatus
          in: path
          description: status
          required: true
          schema:
            type: string
            example: ENABLED
      responses:
        '200':
          description: OK
          allOf:
            - $ref: '#/components/responses/RateLimitedResponse'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RulesetStatusResponse'
              example:
                id: 181ec4a9d9657
                status: ENABLED
                modifiedBy: test.enterprise@enterprise.com
                modifiedAt: '2017-07-22T17:32:28Z'
        '400':
          $ref: '#/components/responses/400'
        '401':

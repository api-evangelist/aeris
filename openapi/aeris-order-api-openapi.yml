openapi: 3.2.0
info:
  title: Subscription Management Order API
  description: Endpoints requiring authentication are indicated with a lock icon, which is performed by passing a token in the 'X-Access-Token' header in each request.
  version: 1.0.1
  x-audience: external-public
servers:
- url: /dcpapi/rest/subscriptionManagement/v1
tags:
- name: Order
paths:
  /euiccs/euiccOrder:
    post:
      tags:
      - Order
      summary: Order eUICC
      operationId: euiccOrder
      requestBody:
        description: The euicc order parameters
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EuiccOrder'
          application/vnd.dcp-v1+json:
            schema:
              $ref: '#/components/schemas/EuiccOrder'
        required: true
      responses:
        '200':
          description: euicc order request initiated.
          content:
            application/vnd.dcp-v1+json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: Invalid arguments for the operation.
          content:
            application/vnd.dcp-v1+json:
              schema:
                $ref: '#/components/schemas/Error'
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/vnd.dcp-v1+json:
              schema:
                $ref: '#/components/schemas/Error'
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Operation failed for internal reasons.
          content:
            application/vnd.dcp-v1+json:
              schema:
                $ref: '#/components/schemas/Error'
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - token: []
      x-codegen-request-body-name: body
  /subscriptions/stockOrders:

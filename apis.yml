- name: Aeris AerAdmin Device Management API
  description: >-
    The Aeris-native SOAP web service used to provision, activate, suspend, cancel, retire and re-provision
    devices on the Aeris network, change rate plans and service profiles, update device attributes and
    traffic policy, query device detail, network status and location, and run the same operations in bulk.
    The WSDL is published unauthenticated at /AerAdmin_WS_5_0/ws?wsdl and declares 47 operations. A REST
    facade over the same system is documented as the AerAdmin 5.0 REST API.
  image: https://www.aeris.com/wp-content/uploads/cropped-Favicon-16x16-1-192x192.png
  humanURL: >-
    https://support.aeris.net/hc/en-us/articles/360037124333-AerAdmin-Device-Management-API-SOAP-and-XML
  baseURL: https://aeradminapi.aeris.com
  tags:
  - Device Management
  - Cellular Connectivity
  - M2M
  - SOAP
  properties:
  - type: Documentation
    url: >-
      https://support.aeris.net/hc/en-us/articles/360037124333-AerAdmin-Device-Management-API-SOAP-and-XML
  - type: APIReference
    url: https://support.aeris.net/hc/en-us/articles/360037274334-AerAdmin-5-0-REST-API-Reference
  - type: WSDL
    url: wsdl/aeris-aeradmin-ws-5-0.wsdl
- name: Aeris AerFrame Device Communication and Control API
  description: >-
    RESTful SMS and device-control API on the Aeris network: send mobile-terminated SMS, receive delivery
    notifications, receive and acknowledge mobile-originated SMS, reset network registration, retrieve
    a local dialable number and query network location. Organised as application registration, notification-channel
    and network-services resources, and documented as based on the OMA-DM standard SMS API. Authenticates
    with an account API key.
  image: https://www.aeris.com/wp-content/uploads/cropped-Favicon-16x16-1-192x192.png
  humanURL: >-
    https://support.aeris.net/hc/en-us/articles/360036914654-AerFrame-Device-Communication-and-Control-API
  baseURL: https://api.aerframe.aeris.com
  tags:
  - SMS Messaging
  - M2M
  - Cellular Connectivity
  - IoT
  properties:
  - type: Documentation
    url: >-
      https://support.aeris.net/hc/en-us/articles/360036914654-AerFrame-Device-Communication-and-Control-API
- name: Aeris AerTraffic Reports API
  description: >-
    Web service interface for retrieving device traffic and billing data from the Aeris AerTraffic system:
    create online and scheduled report templates, poll report status, download online, scheduled and archived
    reports, manage report recipients and retrieve trend and account-level reports. Mirrors the reporting
    available in the AerPort web UI. Authenticates with an account API key.
  image: https://www.aeris.com/wp-content/uploads/cropped-Favicon-16x16-1-192x192.png
  humanURL: https://support.aeris.net/hc/en-us/articles/360037394973-AerTraffic-Reports-API
  baseURL: https://aertrafficapi.aeris.com/v1

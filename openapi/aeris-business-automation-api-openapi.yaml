  parameters:
    actionParam:
      in: query
      name: q
      schema:
        type: string
        example: ownerOrganizationId==3.78;startImsiRange==100783000004553;endImsiRange==100783000004662;rule==timeBased;action==emailNotification;state==DEACTIVATED_AND_LOCKED;startDate==23-08-2022;endDate==24-08-2022;id==REQ201104955229
      description: |

        RSQL query string parameter. Selects triggered actions which are filtered by a RSQL compliant query string.

        _Available logical operators:_

        - Logical AND : ; or "and" is supported
        - Logical OR : , or "or" is supported

        'ownerOrganizationId' Specifies the organization id which owns the rulesets. Example '3.78' \
        'startImsiRange' Specifies the starting range for IMSI. Example '100783000004553'\
        'endImsiRange' Specifies the end range for IMSI. Example '100783000004662'\
        'rule' Specifies the rule type for the Triggered actions. Example 'timeBased'\
        'action' Specifies the action type for the Triggered actions. Example 'emailNotification'\
        'state' Specifies the state of the subscription. Example 'DEACTIVATED_AND_LOCKED'\
        'startDate' Specifies the start date from which the triggered actions are to be filtered. startDate is to be specified as ‘DD-MM-YYYY’. Example '23-08-2022'\
        'endDate' Specifies the end date to which the triggered actions are to be filtered. endDate is to be specified as ‘DD-MM-YYYY’. Example '24-08-2022'\
        'id' Specifies the triggered action id to filter the triggered action. Example 'REQ201104955229'

        Comparison operators are in FIQL notation.

        _Available comparison operators:_

        - Equal to : ==
        - Not equal to : !=
        - Less than : =lt= or <
        - Less than or equal to : =le= or <=
        - Greater than operator : =gt= or >
        - Greater than or equal to : =ge= or >=

        Example usage q=startImsiRange==100783000004553;endImsiRange==100783000004662\
        Example equivalent usage q=startImsiRange==100783000004553 and endImsiRange==100783000004662

        Note! Only one of type 'q' is allowed per request.
    rulesetParam:
      in: query
      name: q
      schema:
        type: string
        example: status==ENABLED;name==Ruleset One;ruleType==DATA_USAGE;category==FRAUD_PREVENTION;level==SUBSCRIPTION_PACKAGE;owner==3.78;target==9500001_007_SP_01;rulesetId==17fb9e498aa55;stompQueueName==dcp.3.78.trigger.v1.0.0;createdStartDate==21-07-2017;createdEndDate==22-07-2017;modifiedStartDate==23-07-2017;modifiedEndDate==24-07-2017
      description: |

        RSQL query string parameter. Selects rulesets which are filtered by a RSQL compliant query string.

        _Available logical operators:_

        - Logical AND : ; or "and" is supported
        - Logical OR : , or "or" is supported

        'status' can be used to describe the current status of Ruleset in the list. Example 'ENABLED' \
        'name' can be used to specify the name of Ruleset in the list. Example 'Ruleset One'\
        'ruleType' can be used to determine when a Ruleset will be fired. Example 'DATA_USAGE'\
        'category' can be used for identifies purpose of creating ruleset. Example 'FRAUD_PREVENTION'\
        'level' Defines affected subscriptions of the ruleset depend on the target set for the ruleset. Example 'SUBSCRIPTION_PACKAGE'\
        'owner' The organization which owns the ruleset. Example '3.78'\
        'target' can be used for specify target based on level. Example '9500001_007_SP_01'\
        'rulesetId' can be used for accessing rulesetId items in the list. Example '17fb9e498aa55'\
        'stompQueueName' can be used to specify queue name for stomp notifications. Example 'dcp.3.78.trigger.v1.0.0'\
        'createdStartDate' can be used for specifying the start date from which the created rulesets are to be filtered. createdStartDate is to be specified as ‘DD-MM-YYYY'. Example '21-07-2017'\
        'createdEndDate' can be used for specifying the end date to which the created rulesets are to be filtered. createdEndDate is to be specified as ‘DD-MM-YYYY'. Example '22-07-2017'\
        'modifiedStartDate' can be used for specifying the start date from which the modified rulesets are to be filtered. modifiedStartDate is to be specified as ‘DD-MM-YYYY'. Example '23-07-2017'\
        'modifiedEndDate' can be used for specifying the end date to which the modified rulesets are to be filtered. modifiedEndDate is to be specified as ‘DD-MM-YYYY'. Example '24-07-2017'

        Note! All the query parameters are optional.

        Comparison operators are in FIQL notation.

        _Available comparison operators:_

        - Equal to : ==
        - Not equal to : !=
        - Less than : =lt= or <
        - Less than or equal to : =le= or <=
        - Greater than operator : =gt= or >
        - Greater than or equal to : =ge= or >=

        Example usage q=status==ENABLED;ruleType==DATA_USAGE\
        Example equivalent usage q=status==ENABLED and ruleType==DATA_USAGE

        Note! Only one of type 'q' is allowed per request.
  schemas:

  - name: Device
    description: 'The Device API'
paths:
  /devices:
    get:
      tags:
        - Device
      operationId: listdevices
      summary: List Devices
      description: The API provides the list of devices mapped to a specific
        organization. By default, the ESIM devices is sorted by EID in an
        ascending order. By default, the SIM devices is sorted by ICCID in an
        ascending order.
      parameters:
        - $ref: '#/components/parameters/Header-Authorization'
        - $ref: '#/components/parameters/Ericsson-IOT-Platform'
        - in: query
          name: orgId
          required: true
          schema:
            type: string
            example: 2.73.4
          description: |
            The devices mapped to the specific Organization ID
        - in: query
          name: q
          schema:
            type: string
            example: filterType == basic; deviceType == ESIM
          description: |

            RSQL query string parameter. Retrieves subscriptions which are
            filtered by a RSQL compliant query string.

            _Available logical operator:_

            - Logical AND : ; is supported

            Comparison operators are in FIQL notation.

            _Available comparison operator:_

            - Equal to : ==

            _Advanced Filtering:_

            - Operator: *
            - Example string: 12345678
            - Operations available:
              - Starts with
                  - example: 1234*
              - Ends with
                  - example: *5678
              - Contains
                  - example: \*3456*

            Note! Only one of type 'q' is allowed per request.

            _Available filterType values:_ basic or extended

            _Available deviceType values:_ ESIM or SIM

            _Default filterType:_ extended

            _Default deviceType:_ ESIM

        - $ref: '#/components/parameters/sortParam'
        - $ref: '#/components/parameters/pageSizeParam'
        - $ref: '#/components/parameters/cursorParam'
      responses:
        '200':
          description: OK
          allOf:
            - $ref: '#/components/responses/RateLimitedResponse'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/devices'
              examples:
                basic-esim-iota:
                  value:
                    devices:
                      - type: ESIM
                        idType: EID
                        value: "0090923122299992358129036544309"
                        euiccType: "M2M"
                    next: "/devices?orgId=2.73.4\
                      &q=filterType==basic;deviceType==ESIM\
                      &pageSize=10&cursor=ODk0NTA0MjExNzEyMDYwMjIyMjI="

                basic-sim-iota:
                  value:
                    devices:
                      - type: SIM
                        idType: ICCID
                        value: "8991101200003204004"
                    next: "/devices?orgId=2.73.4\
                      &q=filterType==basic;deviceType==SIM\
                      &pageSize=10&cursor=ODk0NTA0MjExNzEyMDYwMjIyMjI="

                extended-esim-iota:
                  value:
                    devices:
                      - type: ESIM
                        idType: EID
                        value: "0090923122299992358129036544309"
                        euiccType: "M2M"
                        subscriptions:
                          - iccId: "8991101200003204002"
                            imsi: "460001357924680"
                            msisdn: "883130200003333"
                            status: "PROVISIONED"
                            subscriptionState: "ACTIVE"
                          - iccId: "8991101200003204003"
                            imsi: "460001357924681"
                            msisdn: "883130200003334"
                            status: "PROVISIONED"
                            subscriptionState: "ACTIVE"
                    next: "/devices?orgId=2.73.4\
                      &q=filterType==extended;deviceType==ESIM\
                      &pageSize=10&cursor=ODk0NTA0MjExNzEyMDYwMjIyMjI="

                extended-sim-iota:
                  value:
                    devices:
                      - type: SIM
                        idType: ICCID
                        value: "8991101200003204004"
                        subscriptions:
                          - imsi: "460001357924682"
                            msisdn: "883130200003335"
                            status: "ACTIVE"
                            subscriptionState: "ACTIVE"
                    next: "/devices?orgId=2.73.4\
                      &q=filterType==extended;deviceType==SIM\
                      &pageSize=10&cursor=ODk0NTA0MjExNzEyMDYwMjIyMjI="
        default:
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                response:
                  value:
                    type: 'https://www.iana.org/assignments/http-status-codes/'
                    title: 'Internal Server Error'
                    status: 500
                    detail: 'Internal Server Error'
                    instance: "123e4567-e89b-12d3-a456-426614174000"
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
      security:
        - OAuth2:
            - 'cnx_euicc_inventory'
  /devices/{idType}/{value}:
    get:
      tags:
        - Device
      operationId: deviceDetails
      summary: Get Device Details
      description: |
        The API provides the SIM, subscription, network session details of a
        device.
        * Returns up to 10 most recent sessions during the last 72 hours.
        * Need the following permissions to access.
          - eUICC inventory
          - Any of subscriptions permissions (Subscriptions view, Subscription
            inventory, Change subscription owner, Subscription traffic search,
            Traffic analytics view).

      parameters:
        - in: path
          name: idType
          required: true
          schema:
            type: string
            enum: [EID, ICCID, IMSI, MSISDN]
          description: |
            SIM profile key type. EID is only valid for type
            of ESIM.

        - in: path
          name: value
          required: true
          schema:
            type: string
          description: |
            SIM profile key value of specified key.
        - $ref: '#/components/parameters/Header-Authorization'
        - $ref: '#/components/parameters/Ericsson-IOT-Platform'

        - in: query
          name: extensions
          required: false
          schema:
            type: array
            items:
              type: string
              enum:
                - NETWORK
                - ESIM
            example: [NETWORK, ESIM]
          description: |
            This option specifies what kinds of extended information to be
            returned:
              - NETWORK: The extended network information will be returned.
              - ESIM: All subscription profiles of the device will be returned.
              It is only applicable to ESIM type.

      responses:

        '200':
          description: OK
          allOf:
            - $ref: '#/components/responses/RateLimitedResponse'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/individualDeviceDetail'

  /sim-orders/{request-id}:
    summary: Delete sim order.
    description: Provides an endpoint for handling sims orders changes.
    delete:
      parameters:
        - name: Authorization
          description: A valid token string in the form Bearer \<token string\>
          in: header
          schema:
            type: string
          required: true
        - name: request-id
          in: path
          description: Specifies the ID of the order.
          required: true
          schema:
            type: string
        - name: Enterprise-ID
          in: header

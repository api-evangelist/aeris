          type: boolean
          description: A boolean indicating whether communication between terminals is restricted.
          example: true
        firewallAllowlist:
          type: array
          description: The configuration to restrict communication on the internet.
          items:
            $ref: '#/components/schemas/FirewallConfigItem'
        subscriptionPackages:
          type: array
          description: The ID of the subscription package.
          items:
            type: string
            example: foo_SP_01

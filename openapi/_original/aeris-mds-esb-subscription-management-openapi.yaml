components:
  schemas:
    TokenReissue:
      required:
      - expirationTime
      - message
      - token
      - userId
      type: object
      properties:
        message:
          type: string
        expirationTime:
          type: integer
          format: int64
        userId:
          type: string
        token:
          type: string
      description: Token reissue response model
    Login:
      required:
      - expirationTime
      - message
      - token
      - userId
      type: object
      properties:
        message:
          type: string
        expirationTime:
          type: integer
          format: int64
        userId:
          type: string
        token:
          type: string
      description: Login response model
    Error:
      required:
      - code
      - httpStatus
      - message
      type: object
      properties:
        code:
          type: integer
          description: Error code
          format: int32
          example: 2040
        httpStatus:
          type: integer
          description: Response HTTP status
          format: int32
          example: 401
        message:
          type: string
          description: Error message
          example: Request validation failed
        detailedMessage:
          type: string
          description: Detailed error message
          example: Could not parse JSON body. Optional, This attribute will not be included in the response if the message is empty.
      description: Error response model
    Credentials:
      required:
      - email
      - password
      type: object
      properties:
        email:
          type: string
          description: User email
        password:
          type: string
          description: User password
      description: Login request model
    OrderResponse:
      required:
      - jobId
      type: object
      properties:

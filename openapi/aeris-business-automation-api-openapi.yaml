    # Introduction

    This document describes the IoTA Business Automation API, which provides REST endpoints for Rulesets Management and Triggered Actions. The Business Automation API is based on Representational State Transfer (REST) principles. From this point on, the Business Automation API is referred to as the API in this document.

    ## Scope

    The Business Automation API provides operations for Rulesets Management and Triggered Actions. Triggered Action provide APIs to get the list of triggered actions, details of a triggered action, and summary of triggered action for each action type. API users can view the triggered actions information as a REST endpoint response.
    In addition, Rulesets Management provides APIs to create , update , delete and details of Rulesets. It also provides list of Rulesets.

    <b>Supported operations are the following:</b>

    Business Automation - Action

     * List triggered actions
     * Get triggered action detail
     * Get triggered actions summary

     Business Automation - Management

     * List rulesets
     * Get ruleset detail
     * Create a ruleset
     * Save as draft ruleset
     * Change status of the ruleset
     * Update a ruleset
     * Delete a ruleset

    ## Prerequisites
    In this document, it is assumed that the user is familiar with the following:

    — Java Script Object Notation (JSON)

    — Basic understanding of REST web services

    — The [OpenAPI Initiative](https://www.openapis.org/) for the standardized format used in this document.

    ## Related Information

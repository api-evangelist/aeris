components:
  schemas:
    PostOrderResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          example: FOO_TYPE_OF_ORDER
        status:
          type: string
          example: DRAFT
        orderedFor:
          type: string
          description: the organization ID for which this order is made
          example: "3.77"
        createdAt:
          type: string
          format: date-time
    GetOrderListResponse:
      allOf:
        - type: object
          properties:
            orders:
              type: array
              items:
                $ref: '#/components/schemas/OrderBase'
        - type: object
          properties:
            next:
              type: string
              description: Opaque string returned within the meta object response on
                endpoints which support pagination. Indicates that more results are
                available and can be used as the 'cursor' parameter in the next request
                to return the next page of results. The last page of results will not
                have a 'next' present.
              example: /orders?cursor=DFVSDB3434%DFB%EYY445
    SubmitAction:
      required:
        - action
      type: object
      properties:
        action:
          type: string
          example: SUBMIT
    CancelAction:
      required:
        - action
      type: object
      properties:
        action:
          type: string
          example: CANCEL
    ApproveAction:
      required:
        - action
      type: object
      properties:
        action:
          type: string
          example: APPROVE
        comments:
          type: string
          example: OK
    RejectAction:
      required:
        - action
        - comments
      type: object
      properties:
        action:
          type: string
          example: REJECT
        comments:
          type: string
          example: Something wrong
    AcceptVerificationAction:
      required:
        - action
      type: object
      properties:
        action:
          type: string
          example: ACCEPT_VERIFICATION
        comments:
          type: string
          example: OK
    RejectVerificationAction:
      required:
        - action
        - comments
      type: object
      properties:
        action:
          type: string
          example: REJECT_VERIFICATION
        comments:
          type: string
          example: Something wrong
    PostOrderRequest:
      anyOf:
        - $ref: '#/components/schemas/Create2g3gRoamingProfileRequest'
        - $ref: '#/components/schemas/Update2g3gRoamingProfileRequest'
        - $ref: '#/components/schemas/Create4gRoamingProfileRequest'
        - $ref: '#/components/schemas/Update4gRoamingProfileRequest'
        - $ref: '#/components/schemas/CreateDedicatedInternetServiceRequest'
        - $ref: '#/components/schemas/UpdateDedicatedInternetServiceRequest'
        - $ref: '#/components/schemas/CreateSimSpecificationRequest'
        - $ref: '#/components/schemas/UpdateSimSpecificationRequest'
        - $ref: '#/components/schemas/CreateFormSpecificationRequest'
        - $ref: '#/components/schemas/UpdateFormSpecificationRequest'
        - $ref: '#/components/schemas/CreateProfileSpecificationRequest'
        - $ref: '#/components/schemas/UpdateProfileSpecificationRequest'
        - $ref: '#/components/schemas/DeleteInventoryRequest'
    PatchOrderRequest:
      anyOf:
        - $ref: '#/components/schemas/Patch2g3gRoamingProfileRequest'
        - $ref: '#/components/schemas/Patch4gRoamingProfileRequest'
        - $ref: '#/components/schemas/PatchDedicatedInternetServiceRequest'
    GetOrderResponse:
      anyOf:
        - $ref: '#/components/schemas/Get2g3gRoamingProfileResponse'
        - $ref: '#/components/schemas/Get4gRoamingProfileResponse'
        - $ref: '#/components/schemas/GetDedicatedInternetServiceResponse'
    PostActionsRequest:
      anyOf:
        - $ref: '#/components/schemas/SubmitAction'
        - $ref: '#/components/schemas/CancelAction'
        - $ref: '#/components/schemas/ApproveAction'
        - $ref: '#/components/schemas/RejectAction'
        - $ref: '#/components/schemas/AcceptVerificationAction'
        - $ref: '#/components/schemas/RejectVerificationAction'
    DeleteInventoryRequest:
      required:
        - orderedFor
        - parameters
        - type
      type: object
      properties:
        type:
          type: string
          example: DELETE_DEDICATED_INTERNET_DATA_SERVICE
          x-extensible-enum:
            - DELETE_2G3G_RP
            - DELETE_4G_RP
            - DELETE_DEDICATED_INTERNET_DATA_SERVICE
            - DELETE_SIM_SPEC
            - DELETE_SIM_SPEC
            - DELETE_PROFILE_SPEC
        orderedFor:
          type: string
          description: The organization ID for which this order is made.
          example: "3.77"
        parameters:
          $ref: '#/components/schemas/DeleteInventoryRequest_parameters'
    Problem:
      type: object
      properties:
        type:
          type: string
          description: |
            An absolute URI that identifies the problem type. When dereferenced,
            it SHOULD provide human-readable documentation for the problem type
            (e.g., using HTML).
          format: uri
          example: https://your.api.documentation.url
          default: about:blank
        title:
          type: string
          description: |
            A short, summary of the problem type. Written in english and readable
            for engineers (usually not suited for non technical stakeholders and
            not localized).
          example: Internal Server Error
        status:
          maximum: 600
          exclusiveMaximum: true
          minimum: 100
          type: integer
          description: |
            The HTTP status code generated by the origin server for this occurrence
            of the problem.
          format: int32
          example: 500
        detail:
          type: string
          description: |
            A human readable explanation specific to this occurrence of the
            problem.
          example: The server has encountered a situation that it does not know how
            to handle.
        instance:
          type: string
          description: |
            An absolute URI that identifies the specific occurrence of the problem.
            It may or may not yield further information if dereferenced.
    NotFound:
      description: |
        Network Resource with provided ID not found.
    GetApprovalListResponse:

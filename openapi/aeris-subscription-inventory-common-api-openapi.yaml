---
openapi: 3.0.2
info:
  title: Subscription Management Additional Functions API
  version: 1.0.6
  description: |-
    <b>Subscription management - additional functions.</b>

    This API offers a web application interface to perform operations related
    to the inventory and management of subscriptions.

    The first four subscription change api calls accept only batch requests.
    Each batch job will return a subscription request id which can be followed
    with the Subscription request API or from the Subscription requests page in
    Portal.

    <b>Currently supported operations:</b>

     * Change subscription owner
     * Change subscription package
     * Change subscription State
     * Change subscription region
     * Query subscription available regions
     * Query sim resource
     * Change alternative roaming profile
     * Cancel Sim Order Types
        - Sim stock order
        - Sim order
        - Euicc stock order
        - Euicc order
        - Subscription profile stock order

     <b>Disclaimer:</b>

     * The contents of this document are subject to revision without notice due
       to continued progress in methodology, design and manufacturing. Aeris
       shall have no liability for any error or damage of any kind resulting
       from the use of this document.
        The following are also required for authentication:
  x-audience: external-public
  x-api-id: 96f61af0-7bba-45df-8f12-005042cf1e47
servers:
  - url: https://iot-api.aeris.com/iot/api/sica/subscriptions
    description: API server
paths:

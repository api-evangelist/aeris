paths:
  /activation-codes:
    post:
      tags:
        - 'Activation codes'
      summary: Store activation codes
      operationId: storeActivationCodes
      description: |
        Stores activation codes for a specific locale.  
        **Note:** IMSI is optional for EXTERNAL activation codes, but required for INTERNAL. For INTERNAL, euiccId should not be provided.

        **Note:** For **INTERNAL** activation code type, the `localeId` provided is used solely to import the activation code into the system. Once imported, the activation code may be utilized by any locale that is configured with the same profile specification as the locale used during import.
      parameters:
        - $ref: '#/components/parameters/Header-Content-Type'
        - $ref: '#/components/parameters/Header-Accept-Version'
        - name: Accept
          in: header
          description: Accept content-type and schemas by the client
          content:
            application/json:
              schema:
                type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreActivationCodeRequest'
        required: true
      responses:
        '201':
          description: Created
          allOf:
            - $ref: '#/components/responses/RateLimitedResponse'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivationCodeList'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '405':
          $ref: '#/components/responses/405'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        default:
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
        - OAuth2:
            - 'cnx_ss_euicc_activationcode_man'
    get:
      tags:
        - 'Activation codes'
      summary: List activation codes
      operationId: listActivationCodes
      description: Retrieves stored activation codes
      parameters:
        - $ref: '#/components/parameters/Header-Content-Type'
        - $ref: '#/components/parameters/Header-Accept-Version'
        - name: Accept
          in: header
          description: Accept content-type and schemas by the client
          content:
            application/json:
              schema:
                type: string
        - name: organizationId
          in: query
          description: A list of organizations ids for which activation codes should be listed.
          required: true
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
            maxItems: 1000
        - name: euiccId
          in: query
          description: A list of euicc ids (EIDs) for which activation codes should be listed.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
        - name: iccId
          in: query
          description: A list of ICC ids for which activation codes should be listed.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
        - name: profileType
          in: query
          description: profile type
          schema:
            type: string
        - name: state
          in: query
          schema:
            $ref: '#/components/schemas/ActivationCodeStateParam'
          description: Filter activation codes by state            
        - name: page
          in: query
          description: Page number
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          description: Number of items per page
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 10
      responses:
        '200':
          description: OK
          allOf:
            - $ref: '#/components/responses/RateLimitedResponse'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivationCodeList'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '405':
          $ref: '#/components/responses/405'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        default:
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
        - OAuth2:
            - 'cnx_ss_euicc_activationcode_ro'
  /activation-codes/{id}:
    get:
      tags:
        - 'Activation codes'
      summary: Get Activation code by assigned entity id
      operationId: getActivationCode
      description: Retrieves activation code entity. The entity is referred to using the unique entity id which is assigned to the entry when the activation code is stored.
      parameters:

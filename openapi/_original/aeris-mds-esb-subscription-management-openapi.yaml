        minimumOrderVolume:
          type: integer
          description: The minimum number of subscriptions that can be ordered for
            this specification.
          format: int32
        orderIncrement:
          type: integer
          description: The amount of subscriptions ordered must be a multiple of order
            increment.
          format: int32
        lowOrderThreshold:
          type: integer
          description: An order for less subscriptions than threshold may cause a
            one-time low order fee.
          format: int32
        earliestDeliveryDate:
          type: string
          description: The earliest possible delivery date for an order according
            to this specification. ISO8601 date.
          format: date
        description:
          type: string
          description: Description of the specification.
        operatorId:
          type: string
          description: Corresponding operator ID for this specification.
        numberSchemeId:
          type: string
          description: Number scheme collects the relevant number pools when appropriate.
        numberSchemeName:
          type: string
        networkResourceGroupId:
          type: integer
          description: The network resource group id of the SIM specification.
          format: int64
        networkResourceGroupName:
          type: string
          description: Name of the network resource group.
        msisdnPools:
          type: array
          description: MSISDN pools usable with this specification. In case the list
            empty specifying a pool is unnecessary.
          items:
            $ref: '#/components/schemas/MSISDNPool'
      description: SIM specification data required for making a SIM order.
    SIMStockOrderMetadataResponse:
      type: object
      properties:
        simSpecifications:
          type: array
          description: List of possible SIM specifications.
          items:
            $ref: '#/components/schemas/SIMSpecification'
      description: Contains the data set required for populating a SIM Stock Order
        correctly.
    Deliveryaddress:
      type: object
      properties:
        deliveryAddress:
          type: string
          description: Delivery address to use in SIM order data.
        phone:
          type: string
          description: Phone number corresponding with the delivery address.
      description: A registered delivery address for a company.
    SIMOrderMetadataResponse:
      type: object
      properties:
        simSpecifications:
          type: array
          description: List of possible SIM specifications for this company.
          items:
            $ref: '#/components/schemas/SIMSpecification'
        serviceContracts:
          type: array
          description: List of possible service contracts for this company.
          items:
            $ref: '#/components/schemas/ServiceContract'
        deliveryAddresses:
          type: array
          description: List of possible delivery addresses for this company.
          items:
            $ref: '#/components/schemas/Deliveryaddress'
      description: Contains the data set required for populating a SIM order correctly.
    ServiceContract:
      type: object
      properties:
        serviceContractId:
          type: string
          description: Internal ID of the service contract.
        name:
          type: string
          description: Name is used as reference in SIM order data.
        description:
          type: string
          description: Description of the service contract.
        subscriptionPackages:
          type: array
          description: Possible subscription packages usable with this service contract.
          items:
            $ref: '#/components/schemas/SubscriptionPackage'
      description: Service contract data required for making a SIM order.
    SubscriptionPackage:
      type: object
      properties:
        name:
          type: string
          description: Name is used as reference to the subscription package in SIM
            order data.
        description:
          type: string
          description: Description of the subscription package.
        status:
          type: string
          description: The subscription package status must be active for SIM order.
        networkResourceGroupId:
          type: integer
          description: The network resource group id of this subscription package.
          format: int64
      description: The ordered subscriptions must belong into a subscription package.
    SubscriptionProfileStockOrder:
      required:
      - contactEmail
      - contactName
      - contactPhone
      - operatorId
      - profileSpecification
      - quantity
      type: object
      properties:
        profileSpecification:
          type: string
          description: The profile specification to use for the order.
        quantity:
          type: integer
          description: Quantity of subscription profiles ordered.
          format: int32
        operatorId:
          type: string
          description: Operator for the subscription profiles.
        contactName:
          type: string
        contactEmail:
          type: string
        contactPhone:
          type: string
        poolShortName:
          type: string
          description: Short name of the MSISDN pool to use when required by profile
            specification.
      description: Subscription Profile Stock Order Request Model
    Multi-profileEuiccOrder:
      required:
      - contactEmail
      - contactName
      - contactPhone
      - deliveryAddress
      - organizationId
      - packageMarkings
      - preferredDeliveryDate
      - quantity
      - templateId
      type: object
      properties:
        preferredDeliveryDate:
          type: string
          format: date
        deliveryAddress:
          type: string
          description: Delivery address to use for the order.
        packageMarkings:
          type: string
        templateId:
          type: integer
          description: Numeric identifier of the order template to use.
          format: int64
        quantity:
          type: integer
          description: Quantity of subscription profiles ordered.
          format: int32
        organizationId:
          type: string
          description: Organization for which the order is made.
        contactName:
          type: string
        contactEmail:
          type: string
        contactPhone:
          type: string
      description: Multi-profile eUICC Order Request Model
    SIMOrder:
      required:
      - companyId
      - contactEmail
      - contactName
      - contactPhone
      - deliveryAddress
      - initialState
      - packageMarkings
      - preferredDeliveryDate
      - quantity
      - serviceContract
      - simSpecification
      - subscriptionPackage
      type: object
      properties:
        quantity:
          type: integer
          description: Quantity of subscriptions ordered.
          format: int32
        preferredDeliveryDate:
          type: string
          format: date
        companyId:
          type: string
          description: Company for which the subscriptions are ordered.
        deliveryAddress:
          type: string
          description: Delivery address to use for the order.
        packageMarkings:
          type: string
        simSpecification:
          type: string
          description: SIM specification to use for the order.
        contactName:
          type: string
        contactEmail:
          type: string
        contactPhone:
          type: string
        initialState:
          type: string
          description: Initial state for the subscriptions. Must be Active.
          enum:
          - Active
          - Deactivated
        subscriptionPackage:
          type: string
          description: Subscription package for the ordered subscriptions. The subscription
            package must be also active.
        serviceContract:
          type: string
          description: Service contract used for the order.
        poolShortName:
          type: string
          description: Short name of the MSISDN pool to use when required by SIM specification.
      description: SIM Order Request Model
    ErrorObject:
      type: object
    FailureInfo:
      type: object
      properties:
        errorObject:
          $ref: '#/components/schemas/ErrorObject'
        getErrorType:
          type: string
          enum:
          - ES_ERROR
          - DCP_ERROR
    Instant:
      type: object
      properties:
        epochSecond:
          type: integer
          format: int64
        nano:
          type: integer
          format: int64
    SubscriptionRequest:
      type: object
      properties:
        subscriptionRequestId:
          type: string
        subscriptionRequestType:
          type: string
          enum:
          - CESS
          - CHANGE_SUBSCRIPTIONOWNER
          - CHANGE_SUBSCRIPTIONREGION
          - CHANGE_SUBSCRIPTIONSTATE
          - CHANGE_SUBSCRIPTIONSTATE_PARENT
          - CHANGE_SUBSCRIPTIONPACKAGE_PARENT
          - CHANGE_SUBSCRIPTIONOWNER_PARENT
          - CHANGE_SUBSCRIPTIONREGION_PARENT
          - CHANGE_SUBSCRIPTIONPACKAGE
          - CHANGE_SUBSCRIPTIONLABEL
          - CHANGE_SUBSCRIPTION_NOTE
          - CHANGE_ALTROAMINGPROVIDER
          - CHANGE_SUBSCRIPTIONIP
          - DEVICE_RECONNECT
          - EUICC_ORDER
          - EUICC_PROFILE_ORDER
          - EUICC_STOCK_ORDER
          - EUICC_UPDATE_LABEL
          - EUICC_LOCALIZATION
          - EUICC_DELOCALIZATION
          - EUICC_LOCALIZATION_BATCH
          - EUICC_DELOCALIZATION_BATCH
          - EUICC_MIGRATION
          - EUICC_MIGRATION_BATCH
          - EUICC_ADD_LOCALE
          - EUICC_ADD_LOCALE_BATCH
          - EUICC_REMOVE_LOCALE
          - EUICC_ENABLE
          - EUICC_RESET_COUNTERS
          - SIM_ORDER
          - STOCK_ORDER
          - TRIGGERPACKAGE_ASSIGN
          - TRIGGERPACKAGE_REMOVE
          - EXECUTE_USE_CASE
          - PCL_LIMIT_100_EXCEEDED
          - REASSIGN_MSISDN
          - UPDATE_PROVISIONED_IMEI
          - CSO_APPROVAL
          - LOCK_SUBSCRIPTIONSTATE
          - UNLOCK_SUBSCRIPTIONSTATE
          - EUICC_PROFILE_DELETED_NOTIFICATION
          - EUICC_PROFILE_ENABLED_NOTIFICATION
          - EUICC_PROFILE_DISABLED_NOTIFICATION
          - EUICC_SMSR_CHANGE_NOTIFICATION
          - EUICC_EXT_CHANGE_SM_SR
          - EUICC_EXT_PREP_SM_SR_CHANGE
          - EUICC_EXT_DOWNLOAD_WITH_ICC
          - EUICC_EXT_ENABLE_WITH_ICC
          - EUICC_EXT_DELETE_WITH_ICC
          - EUICC_EXT_DISABLE_WITH_ICC
          - EUICC_EXT_UPDATE_SM_SR
          - EUICC_EXT_SET_FALLBACK_ATTR
          - INDIVIDUAL_APN_UPDATE
          - EUICC_SET_FALLBACK_ATTR
          - EUICC_DISABLE_ACTIVE
          - ATTACH_CUSTOM_FIELD
          - PREPARE_CONSUMER_PROFILE
        subscriptionRequestState:
          type: string
          enum:
          - IN_PROGRESS
          - PENDING
          - CANCELED
          - REJECTED
          - COMPLETED
          - COMPLETED_WITH_FAILURES
          - UNKNOWN
        createdBy:
          type: string
        companyId:
          type: string
        companyName:
          type: string
        timeCreated:
          $ref: '#/components/schemas/Instant'
        lastUpdated:
          $ref: '#/components/schemas/Instant'
        size:
          type: integer
          format: int32
        subscriptionRequestResourceCounters:
          $ref: '#/components/schemas/SubscriptionRequestResourceCounters'
        subscriptionRequestFailureInfos:
          type: array
          items:
            $ref: '#/components/schemas/FailureInfo'
        subscriptionRequestResources:
          type: array
          items:
            $ref: '#/components/schemas/SubscriptionRequestResource'
    SubscriptionRequestResource:
      type: object
      properties:
        resourceProperties:
          type: array
          items:
            $ref: '#/components/schemas/SubscriptionRequestResourceProperty'
        resourceState:
          type: string
          enum:
          - IN_PROGRESS
          - PENDING
          - CANCELED
          - REJECTED
          - COMPLETED
          - FAILED
          - UNKNOWN
        resourceFailureInfos:
          type: array
          items:
            $ref: '#/components/schemas/FailureInfo'
        resourceId:
          type: string
    SubscriptionRequestResourceCounters:
      type: object
      properties:
        inProgress:
          type: integer
          format: int32
        pending:
          type: integer
          format: int32
        canceled:
          type: integer
          format: int32
        rejected:
          type: integer
          format: int32
        completed:
          type: integer
          format: int32
        failed:
          type: integer
          format: int32
    SubscriptionRequestResourceProperty:
      type: object
      properties:
        type:
          type: string
          enum:
          - ICCID
          - IMSI
          - MSISDN
          - EUICCID
          - INTERNAL_ID
          - TARGET_SUBSCRIPTION_STATE
          - TARGET_SUBSCRIPTION_PACKAGE
        value:
          type: string
        operation:
          type: string
          enum:
          - SUBSCRIPTION_STATE_CHANGE
          - SUBSCRIPTION_PACKAGE_CHANGE
          - DOWNLOAD
          - DOWNLOAD_AND_ENABLE
          - ENABLE
          - DELETE
          - LOCALIZATION
          - ADD_LOCALE
          - DELOCALIZATION
          - REMOVE_LOCALE
          - UNKOWN
    SubscriptionRequestFilterDto:
      type: object
      properties:
        subscriptionRequestTypes:
          type: array
          items:
            type: string
            enum:
            - CESS
            - CHANGE_SUBSCRIPTIONOWNER
            - CHANGE_SUBSCRIPTIONREGION
            - CHANGE_SUBSCRIPTIONSTATE
            - CHANGE_SUBSCRIPTIONPACKAGE
            - CHANGE_SUBSCRIPTIONLABEL
            - CHANGE_SUBSCRIPTIONSTATE_PARENT
            - CHANGE_SUBSCRIPTIONPACKAGE_PARENT
            - CHANGE_SUBSCRIPTIONOWNER_PARENT
            - CHANGE_SUBSCRIPTIONREGION_PARENT
            - CHANGE_SUBSCRIPTION_NOTE
            - CHANGE_ALTROAMINGPROVIDER
            - CHANGE_SUBSCRIPTIONIP
            - DEVICE_RECONNECT
            - EUICC_ORDER
            - EUICC_PROFILE_ORDER
            - EUICC_STOCK_ORDER
            - EUICC_UPDATE_LABEL
            - EUICC_LOCALIZATION
            - EUICC_DELOCALIZATION
            - EUICC_LOCALIZATION_BATCH
            - EUICC_DELOCALIZATION_BATCH
            - EUICC_ADD_LOCALE
            - EUICC_ADD_LOCALE_BATCH
            - EUICC_REMOVE_LOCALE
            - EUICC_DOWNLOAD_PROFILE
            - EUICC_DELETE_PROFILE
            - EUICC_RESET_COUNTERS
            - EUICC_SET_FALLBACK_ATTR
            - SIM_ORDER
            - STOCK_ORDER
            - TRIGGERPACKAGE_ASSIGN
            - TRIGGERPACKAGE_REMOVE
            - INDIVIDUAL_APN_UPDATE
            - SECURITY_LOCK_STATE
            - SECURITY_UNLOCK_STATE
            - LOCK_SUBSCRIPTIONSTATE
            - UNLOCK_SUBSCRIPTIONSTATE
            - PREPARE_CONSUMER_PROFILE
            - UNKNOWN
        subscriptionRequestStates:
          type: array
          items:
            type: string
            enum:
            - IN_PROGRESS
            - PENDING
            - CANCELED
            - REJECTED
            - COMPLETED
            - COMPLETED_WITH_FAILURES
            - UNKNOWN
        createdBy:
          type: string
        limit:
          type: integer
          format: int32
        companyIds:
          type: array
          items:
            type: string
        timeCreatedBefore:
          type: string
          format: date-time
        timeCreatedAfter:
          type: string
          format: date-time
        lastUpdatedBefore:
          type: string
          format: date-time
        lastUpdatedAfter:
          type: string
          format: date-time
        sortOrder:
          $ref: '#/components/schemas/SubscriptionRequestSortOrderDto'
      description: Subscription Request Search Criteria Parameters
    SubscriptionRequestSortOrderDto:
      required:
      - sortField
      type: object
      properties:
        sortField:
          type: string
          enum:
          - SUBSCRIPTION_REQUEST_TYPE
          - SUBSCRIPTION_REQUEST_STATE
          - TIME_CREATED_BEFORE
          - TIME_CREATED_AFTER
          - LAST_UPDATED_BEFORE
          - LAST_UPDATED_AFTER
          - CREATED_BY
        descending:
          type: boolean
    IndividualApn:
      type: object
      properties:
        ordinal:
          type: integer
          format: int32
        apn:
          type: string
        type:
          type: string
      description: Individual APN for subscription
    SubscriptionDetails:
      required:
      - imsi
      - subscriptionState
      type: object
      properties:
        imsi:
          type: string
          description: International mobile subscriber identity
        msisdn:
          type: string
          description: Mobile station international subscriber directory number
        subscriptionState:
          type: string
          description: Current state
          enum:
          - ACTIVE
          - DEACTIVATED
          - PAUSE
          - TERMINATED
          - OPERATOR_BLOCKED
          - DEACTIVATED_NO_BILLING
          - ACTIVE_NO_BILLING
        icc:
          type: string
        imei:
          type: string
        companyId:
          type: string
          description: Enterprise identifier.
        companyName:
          type: string
          description: Enterprise name. Included only with group 'enterpriseInfo'.
        subscriptionPackageName:
          type: string
          description: Subscription package name. Included only with group 'packageInfo'.
        subscriptionPackageDescription:
          type: string
          description: Subscription package description. Included only with group
            'packageInfo'.
        firstActivationDate:
          type: string
          description: First activation date. Included only with group 'dates'.
          format: date-time
        lastSubscriptionChangeDate:
          type: string
          description: Last subscription change time stamp. Included only with group
            'dates'.
          format: date-time
        lockState:
          type: string
          description: Current lock state. Included only with group 'lockStateInfo'.
          enum:
          - UNLOCKED
          - LOCKED
          - UNKNOWN
        lockingReason:
          type: string
          description: Locking reason. Included only with group 'lockStateInfo'.
        customerLabel:
          type: string
          description: Customer label. Included only with group 'label'.
        simSpecificationId:
          type: string
          description: SIM Specification ID. Included only with group 'simSpecification'.
        pbrExitDate:
          type: string
          description: PBR exit date. Included only with group 'dates'.
          format: date-time
        individualApns:
          type: array
          description: "Subscription individually enabled APNs. Included only with\
            \ group 'individualApn'. When empty, APNs from package are used"
          items:
            $ref: '#/components/schemas/IndividualApn'
      description: Subscription details model
    SubscriptionDetailsPagedResponse:
      type: object
      properties:
        subscriptionDetails:
          type: array
          description: Subscription details
          items:
            $ref: '#/components/schemas/SubscriptionDetails'
        moreResultsAvailable:
          type: boolean
          description: More results can be obtained by using a higher start index
        start:
          type: integer
          description: The index of the first item in response
          format: int32
        size:
          type: integer
          description: Number of items in this response.
          format: int32
      description: Subscriptions details response with pagination
    MsisdnRangeResponseDto:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MsisdnRangeResponseItemsDto'
    MsisdnRangeResponseItemsDto:
      type: object
      properties:
        startNumber:
          type: string
        endNumber:
          type: string
        dateTime:
          type: string
        poolId:
          type: string
        reservedFor:
          type: string
        available:
          type: string
        ordered:
          type: string
    SubscriptionResponse:
      type: object
      properties:
        serviceRequestId:
          type: string
          description: |-
            Use the unique ID called 'serviceRequestId' in the following operation to query the status of the 'disableApns' request:
            /subscriptions/requests/{serviceRequestId}
          example: REQ201234567890
    DisabledSubscriptionApns:
      required:
      - apns
      - imsis
      - subscriptionPackageId
      type: object
      properties:
        apns:
          maxItems: 9
          minItems: 0
          type: array
          description: "APNs to disable. Other APNs are enabled. Empty list means\
            \ no APNs to disable, so it enables all APNs in the subscription package."
          items:
            type: string
        imsis:
          maxItems: 10000
          minItems: 1
          type: array
          description: The IMSIs of subscriptions with APNs to disable.
          items:
            type: string
        subscriptionPackageId:
          type: string
          description: Id of subscription package of the subscriptions
    ActivateSubscriptionResponse:
      type: object
      properties:
        serviceRequestId:
          type: string
        msisdn:
          type: string
    ActivateSubscriptionRequest:
      required:
      - subscription_id_type
      type: object
      properties:
        subscription_id_type:
          type: string
          description: Subscription Type
        msisdn:
          type: string
          description: 'MSIDSN '
        companyId:
          type: string
          description: 'CompanyId '
        additional_info:
          type: string
          description: 'CompanyId '
      description: Activate Subscription.
    SuspendSubscriptionRequest:
      required:
      - subscription_id_type
      type: object
      properties:
        subscription_id_type:
          type: string
          description: Subscription Type
      description: Suspend Subscription.
    ReassignMSISDN:
      required:
      - companyId
      - msisdn
      type: object
      properties:
        companyId:
          type: string
          description: Company ID under which the request is performed.
        additionalInfo:
          type: string
          description: Additional info for the request.
        msisdn:
          type: string
          description: The MSISDN to reassign from an old subscription..
      description: Reassigns MSISDN from an old subscription identified by MSISDN
        into a new one identified by IMSI.
    SubscriptionDetailsResponse:
      type: object
      properties:
        subscriptionDetails:
          type: array
          description: Subscription details
          items:
            $ref: '#/components/schemas/SubscriptionDetails'
        size:
          type: integer
          description: Number of items in this response.
          format: int32
      description: Subscriptions details response model
    GetSubscriptionDetailsByPrimaryKey:
      required:
      - type
      - values
      type: object
      properties:
        type:
          type: string
          description: Type of query key
          enum:
          - imsi
          - icc
          - msisdn
        values:
          maxItems: 10000
          minItems: 1
          type: array
          items:
            type: string
        groups:
          type: array
          items:
            type: string
            enum:
            - enterpriseInfo
            - packageInfo
            - dates
            - label
            - simSpecification
            - lockStateInfo
            - individualApn
      description: Find subscriptions using primary key values
    AssignIMEI:
      required:
      - assignedImei
      - companyId
      - subscriptionId
      - subscriptionIdType
      type: object
      properties:
        subscriptionIdType:
          type: string
          description: "Must be one of IMSI, ICCID, or MSISDN."
          enum:
          - IMSI
          - ICCID
          - MSISDN
        subscriptionId:
          type: string
          description: Valid identifier of the specified subscriptionIdType.
        assignedImei:
          type: string
          description: The IMEI to assign to the subscription. Define empty value
            to remove.
        companyId:
          type: string
          description: Company ID under which the request is performed.
        additionalInfo:
          type: string
          description: Additional info for the request. Currently ignored.
      description: Assign IMEI to a subscription.
    AssignIMEIRequest:
      required:
      - assignedImei
      - companyId
      type: object
      properties:
        companyId:
          type: string
          description: Company ID under which the request is performed.
        additionalInfo:
          type: string
          description: Additional info for the request.
        assignedImei:
          type: string
          description: The IMEI to assign to the subscription. Define empty value
            to remove.
      description: Assign IMEI to a subscription.
    SubscriptionHistoryRow:
      required:
      - serviceConfiguration
      - serviceRequestId
      - subscriptionHistoryType
      - subscriptionPackage
      - subscriptionState
      - timestamp
      type: object
      properties:
        timestamp:
          type: integer
          description: Timestamp of this change
          format: int64
        subscriptionHistoryType:
          type: string
          description: Type of this change
          enum:
          - CHANGE_EXISTING_SUBSCRIPTIONSTATE
          - CHANGE_SUBSCRIPTIONOWNER
          - CHANGE_SUBSCRIPTIONOWNER_EUICC
          - CHANGE_SUBSCRIPTIONREGION
          - CHANGE_SUBSCRIPTIONSTATE
          - CHANGE_SUBSCRIPTIONSTATE_EUICC
          - CHANGE_SUBSCRIPTIONPACKAGE
          - CHANGE_SUBSCRIPTIONPACKAGE_EUICC
          - CHANGE_SUBSCRIPTIONLABEL
          - CHANGE_SUBSCRIPTIONNOTE
          - CHANGE_ALTROAMINGPROVIDER
          - CREATE_SUBSCRIPTION
          - CREATE_SUBSCRIPTION_EUICC
          - THROTTLE_IMSI
          - POLICYBASEDROUTING_EXIT
          - TRIGGER_ACTION
          - TIME_BASED_CHANGE_SUBSCRIPTIONSTATE
          - TIME_BASED_CHANGE_SUBSCRIPTIONPACKAGE
          - UPDATE_IMEI
          - REASSIGN_MSISDN
          - UPDATE_PROVISIONED_IMEI
          - PCL_LIMIT_EXCEEDED
          - CHANGE_SUBSCRIPTIONSTATE_AND_UNLINK_SUBSCRIPTION
          - LOCK_SUBSCRIPTIONSTATE
          - UNLOCK_SUBSCRIPTIONSTATE
          - INDIVIDUAL_APN_UPDATE
          - UNKNOWN
        serviceRequestId:
          type: string
          description: Job identifier for this change.
        initiatorName:
          type: string
          description: The person or party who requested this change.
        description:
          type: string
          description: Description of the changed value when applicable.
        subscriptionState:
          type: string
          description: State of the subscription.
          enum:
          - NEW
          - ACTIVE
          - DEACTIVATED
          - PAUSE
          - TERMINATED
          - PENDING_TERMINATION
          - REMOVED
          - OPERATOR_BLOCKED
          - ACTIVE_NO_BILLING
          - DEACTIVATED_NO_BILLING
          - UNKNOWN
        subscriptionPackage:
          type: string
          description: Subscrription package name.
        serviceConfiguration:
          type: string
          description: Service configuration name.
        msisdn:
          type: string
          description: MSISDN
        imei:
          type: string
          description: IMEI detected from network.
        provisionedImei:
          type: string
          description: IMEI provisioned to network.
      description: Describes one change in subscription history.
  securitySchemes:
    token:
      type: apiKey
      description: Input token directly or use login endpoints
      name: X-Access-Token
      in: header

- name: Aeris IoT Accelerator REST API
  description: The primary REST API of the Aeris IoT Accelerator platform (acquired from Ericsson in 2023),
    covering subscription and SIM inventory, subscription search and change history, device and eUICC
    inventory, eSIM localization, eUICC setup and eIM/ECO operations, enterprise management, order management,
    number management, custom fields, shared bundles, business automation rulesets and triggers, signalling
    events and usage reporting, business analytics reports and invoices, consumer connectivity purchases,
    resource inventory and incident management. Authenticates with a JWT bearer token from POST /iot/api/auth
    or an X-Access-Token session token.

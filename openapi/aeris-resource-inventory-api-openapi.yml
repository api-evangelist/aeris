components:
  schemas:
    InventoryContextItems:
      type: object
      properties:
        hssEsmContextId:
          type: string
          description: HSS ESM Context Id
          example: '2'
    ServiceDataUnit:
      properties:
        sduMaxSize:
          type: integer
          description: sdu Max size
          format: int32
          example: 5
        erroneousSduDelivery:
          type: string
          description: erroreous Sdu Delivery
          example: DELIVERED
          x-extensible-enum:
          - NOT_CHECKED
          - NOT_DELIVERED
          - DELIVERED
        residualBitErrorRate:
          type: integer
          description: residual Bit Error Rate
          format: int32
          example: 4
        sduErrorRatio:
          type: integer
          description: sdu Error Ratio
          format: int32
          example: 2
      description: Service Data Unit
      example:
        sduMaxSize: 5
        erroneousSduDelivery: DELIVERED
        residualBitErrorRate: 4
        sduErrorRatio: 2
    VirtualApn:
      allOf:
      - $ref: '#/components/schemas/PgwApn'
      - type: object
        properties:
          realApnId:
            type: string
            example: '0'
    PrivateApn:
      allOf:
      - $ref: '#/components/schemas/RealApn'
    EsmContextQosArray:
      allOf:
      - type: object
        properties:
          esmContextQoS:
            type: array
            items:
              $ref: '#/components/schemas/InventoryBase'
      - type: object
        properties:
          next:
            type: string
            description: Opaque string returned within the meta object response on endpoints which support pagination. Indicates that more results are available and can be used as the 'cursor' parameter in the next request to return the next page of results. The last page of results will not have a 'next' present.
            example: /esm-contexts-qos?cursor=BDCTAQ3434%DFB%EYY445
    DataProfileBase:
      allOf:
      - $ref: '#/components/schemas/InventoryBase'
      type: object
      properties:
        apn:
          type: string
          description: The name of the APN
          example: foo.go
        hlrApnId:
          type:
          - string
          - 'null'
          description: HLR Apn Id
          example: '6415'
        hssApnId:
          type:
          - string
          - 'null'
          description: HSS Apn Id
          example: '6415'
        supplierDnsHosted:
          type: boolean
          description: A boolean indicating supplier DNS hosted property
          example: true
        type:
          type: string
          example: INTERNET_APN
          x-extensible-enum:
          - INTERNET_APN
          - NON_HOSTED_APN
          - PRIVATE_APN
          - VIRTUAL_APN
          - RADIUS_APN
    RoamingProfile4gSimple:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          example: RP996LTE
        description:
          type:
          - string
          - 'null'
          maxLength: 500
          example: RP996LTE Offering
      required:
      - name
    ApnArray:
      allOf:
      - type: object
        properties:
          apns:
            type: array
            items:
              $ref: '#/components/schemas/DataProfileBase'
      - type: object
        properties:
          next:
            type: string
            description: Opaque string returned within the meta object response on endpoints which support pagination. Indicates that more results are available and can be used as the 'cursor' parameter in the next request to return the next page of results. The last page of results will not have a 'next' present.
            example: /apns?cursor=BDCTAQ3434%DFB%EYY445
    PdpContextSub:
      type: object
      properties:
        ordinal:
          type: integer
          description: The ordinal number of the PDP context. The ordinal number indicates the usage order of the PDP contexts when there are more than one PDP contexts
          format: int32
          example: 1
        apnId:
          type: string
          description: apn id
          example: '1249'
        pdpContextQosId:
          type: string
          example: '2'
        pdpContextType:
          type: string
          example: IPV4
          x-extensible-enum:
          - IPV4
          - IPV6
          - IPV4_AND_IPV6
      example:
        ordinal: 10
        apnId: '1249'
        pdpContextQosId: '1242'
        pdpContextType: IPV4
    AuthServer:
      type:
      - object
      - 'null'
      properties:
        ipAddress:
          type: string
          format: ipv4
          example: 34.125.64.6
        port:
          type: integer
          format: int32
          example: 1812
        key:
          type: string
          example: '1232'
      description: Authentication server
      example:
        ipAddress: 34.125.64.6
        port: 1812
        key: '1243'
    PdpContextProfileArray:
      allOf:
      - type: object
        properties:
          pdpContextProfiles:
            type: array
            items:
              allOf:
              - $ref: '#/components/schemas/InventoryBase'
              - $ref: '#/components/schemas/InventoryPdpContextItems'
      - type: object
        properties:
          next:
            type: string
            description: Opaque string returned within the meta object response on endpoints which support pagination. Indicates that more results are available and can be used as the 'cursor' parameter in the next request to return the next page of results. The last page of results will not have a 'next' present.
            example: /pdp-context-profiles?cursor=BDCTAQ3434%DFB%EYY445
    RadiusApn:
      allOf:
      - $ref: '#/components/schemas/PgwApn'
      - type: object
        properties:
          defaultApnId:
            type: string
            description: Default Apn Id
            example: '0'
    EsmProfileQos:
      allOf:
      - $ref: '#/components/schemas/InventoryBase'
      - type: object
        properties:
          name:
            type: string
            description: The name of the ESM profile Qos
            example: Foo Esm profile Qos
          maxDownlinkBitrate:
            type: integer
            description: Max downlink bitrate in (bits/s)
            format: int32
            example: 0
          maxUplinkBitrate:
            type: integer
            description: Max uplink bitrate in (bits/s)
            format: int32
            example: 0
          maxExtendedDownlinkBitrate:
            type: integer
            description: Max Extended downlink bitrate in (kbits/s)
            format: int64
            example: 0
          maxExtendedUplinkBitrate:
            type: integer
            description: Max Extended uplink bitrate in (kbits/s)
            format: int64
            example: 0
          epsServiceChargingChar:
            type:
            - string
            - 'null'
            description: eps service charging char
            example: '64555'
          freqPriorityId:
            type: integer
            description: Frequency priority identifier/subscriber profile ID
            format: int32
            example: 3
          operatorId:
            type: string
            description: operator ID
            example: '3.77'
          operatorNetworkId:
            type:
            - string
            - 'null'
            description: network group id
            example: '5'
    InventoryPdpContextItems:
      type: object
      properties:
        hlrPdpContextProfileId:
          type: string
          description: hlr PDP context profile id
          example: '5'
    Get2G3GInventoryResponse:
      allOf:
      - $ref: '#/components/schemas/InventoryBase'
      - $ref: '#/components/schemas/RoamingProfile2g3g'
    EsmContext:
      allOf:
      - $ref: '#/components/schemas/InventoryBase'
      - type: object
        properties:
          apnId:
            type: string
            description: The id of the APN
            example: '3000'
          esmContextQosId:
            type: string
            description: The id of the ESM context Qos
            example: '300'
          pdnType:
            type: string
            description: The address type of the PDN
            example: IPV4
            x-extensible-enum:
            - IPV4
            - IPV6
            - IPV4_AND_IPV6
            - IPV4_OR_IPV6
            - NONE
          staticPdnGwAsFqdn:
            type:
            - string
            - 'null'
            description: The PDN-GW node identity in Fully Qualified Domain Name (FQDN) format.
            example: topon.s5.epc.mnc015.mcc234.3gppnetwork.org$epc.mnc015.mcc234.3gppnetwork.org
          staticPdnGwAsIpv4:
            type:
            - string
            - 'null'
            description: The PDN-GW node identity in IPv4 format, that is, four octets of decimal numbers, separated by periods (.).
            format: ipv4
            example: 11.11.11.11
          staticPdnGwAsIpv6:
            type:
            - string
            - 'null'
            description: The PDN-GW node identity in IPv6 format, that is, eight groups of four hexadecimal numbers, separated by colons (:).
            format: ipv6
            example: 2010:0000:0000:0001:0a5b:1000:6789:000c
          allowVpLmn:
            type: boolean
            description: A boolean indicating whether dynamic address allocation in the VPLMN is allowed
            example: true
          apnOiReplacement:
            type:
            - string
            - 'null'
            description: This attribute indicates the domain name to replace the APN Operator Identifier when constructing the PDN Gateway (GW) Full Qualified Domain Name (FQDN) upon which to perform a DNS resolution.
            example: mncfoo.mccfoo.gprs
          hssEsmContextId:
            type: string
            description: HSS ESM Context Id
            example: '2'
          operatorId:
            type: string
            description: operator ID
            example: '3.77'
          operatorNetworkId:
            type:
            - string
            - 'null'
            description: network group id
            example: '5'
    EsmProfileArray:
      allOf:
      - type: object
        properties:
          esmProfiles:
            type: array
            items:
              allOf:
              - $ref: '#/components/schemas/InventoryBase'
              - $ref: '#/components/schemas/InventoryProfileItems'
      - type: object
        properties:
          next:
            type: string
            description: Opaque string returned within the meta object response on endpoints which support pagination. Indicates that more results are available and can be used as the 'cursor' parameter in the next request to return the next page of results. The last page of results will not have a 'next' present.
            example: /esm-profiles?cursor=BDCTAQ3434%DFB%EYY445
    EsmProfileQosArray:
      allOf:
      - type: object
        properties:
          esmProfileQos:
            type: array
            items:
              $ref: '#/components/schemas/InventoryBase'
      - type: object
        properties:
          next:
            type: string
            description: Opaque string returned within the meta object response on endpoints which support pagination. Indicates that more results are available and can be used as the 'cursor' parameter in the next request to return the next page of results. The last page of results will not have a 'next' present.
            example: /esm-profiles-qos?cursor=BDCTAQ3434%DFB%EYY445
    GlobalTitles:
      type: object
      properties:
        globalTitles:
          type: array
          description: Global Titles
          uniqueItems: true
          items:
            type: string
          example:
          - '164780001'
          - '2250505987'
          - '32468'
          - '32475'
          - '7901106'
          - '7901154'
          - '790116'
          - '7901472'
          - '790160'
          - '799426'
          - '99292'
          - '99293'
    Get4GInventoryResponse:
      allOf:
      - $ref: '#/components/schemas/InventoryBase'
      - $ref: '#/components/schemas/RoamingProfile4g'
    AcctServer:
      type:
      - object
      - 'null'
      properties:
        ipAddress:
          type: string
          format: ipv4
          example: 34.125.64.9
        port:
          type: integer
          format: int32
          example: 18126
        key:
          type: string
          example: '1234'
      description: Accounting server
      example:
        ipAddress: 34.125.64.9
        port: 1812
        key: '1324'
    RealApn:
      allOf:
      - $ref: '#/components/schemas/PgwApn'
      - type: object
        properties:
          uplinkBandwidth:
            type: integer
            description: An uplink bandwidth limit to apply a speed profile on the subscriptions connecting through this APN. If no value is entered, the default value applies, which is defined by the QoS
            format: int32
            example: 60
          downlinkBandwidth:
            type: integer
            description: A downlink bandwidth limit to apply a speed profile on the subscriptions connecting through this APN. If no value is entered, the default value applies, which is defined by the QoS
            format: int32
            example: 80
          numberOfSimultaneousSessions:
            type: integer
            description: Number of connected device
            format: int32
            example: 256
          primaryGiRange:
            type:
            - string
            - 'null'
            description: Primary GI Address Range
            example: 42.56.152.23/28
          secondaryGiRange:
            type:
            - string
            - 'null'
            description: Secondary GI Address Range
            example: 42.56.152.23/28
          routingInstance:
            type: string
            description: The routing instance where the APN is configured
            example: route1
          natFirewallBy:
            type: string
            description: The NAT Firewall provided by Ericsson or Operator
            example: OPERATOR
            x-extensible-enum:
            - OPERATOR
            - ERICSSON
          ipVersion:
            type: string
            description: The type of the PDP
            example: IPV4
            x-extensible-enum:
            - IPV4
            - IPV6
            - IPV4_AND_IPV6
            - IPV4_OR_IPV6
            - NONE
          sessionTimeout:
            type: string
            description: The session timeout configuration.
            example: DEFAULT
            x-extensible-enum:
            - DEFAULT
            - NO_SUPERVISION
            - TIMER
            - RADIUS
          sessionTimeoutTimer:
            type: integer
            description: The amount of time that needs to be elapsed for the session to expire
            format: int32
            example: 60
          idleTimeout:
            type:
            - string
            - 'null'
            description: The idle timeout configuration
            example: DEFAULT
            x-extensible-enum:
            - DEFAULT
            - NO_SUPERVISION
            - TIMER
            - RADIUS
          idleTimeoutTimer:
            type: integer
            description: The number of minutes that the idle timer timeout. When the traffic idle time exceeds the specified value, the session will be reset
            format: int32
            example: 60
          vpn:
            type:
            - string
            - 'null'
            description: The name of the VPN to be connected
            example: vpn1
          terminalIpAddresses:
            type: array
            description: The terminal IP range to be used
            items:
              pattern: ((^\s*((([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5]))\s*(?:/[0-9]\d|/3[0-9])?$)|(^\s*((([0-9A-Fa-f]{1,4}:){7}([0-9A-Fa-f]{1,4}|:))|(([0-9A-Fa-f]{1,4}:){6}(:[0-9A-Fa-f]{1,4}|((25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)(\.(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)){3})|:))|(([0-9A-Fa-f]{1,4}:){5}(((:[0-9A-Fa-f]{1,4}){1,2})|:((25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)(\.(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)){3})|:))|(([0-9A-Fa-f]{1,4}:){4}(((:[0-9A-Fa-f]{1,4}){1,3}(\/(\d{1,2}|1[0-1]\d|12[0-8]))?)|((:[0-9A-Fa-f]{1,4})?:((25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)(\.(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)){3}))|:))|(([0-9A-Fa-f]{1,4}:){3}(((:[0-9A-Fa-f]{1,4}){1,4})|((:[0-9A-Fa-f]{1,4}){0,2}:((25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)(\.(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)){3}))|:))|(([0-9A-Fa-f]{1,4}:){2}(((:[0-9A-Fa-f]{1,4}){1,5})|((:[0-9A-Fa-f]{1,4}){0,3}:((25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)(\.(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)){3}))|:))|(([0-9A-Fa-f]{1,4}:){1}(((:[0-9A-Fa-f]{1,4}){1,6})|((:[0-9A-Fa-f]{1,4}){0,4}:((25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)(\.(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)){3}))|:))|(:(((:[0-9A-Fa-f]{1,4}){1,7})|((:[0-9A-Fa-f]{1,4}){0,5}:((25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)(\.(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)){3}))|:)))(%.+)?\s*$))|(^\*$)
              type: string
              description: IPv4 or IPv6 IP address with netmask
              example: 10.100.200.50/20
          secondaryTerminalIpAddresses:
            type: array

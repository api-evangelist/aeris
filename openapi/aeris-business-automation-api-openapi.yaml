        type:
          type: string
          enum:
            - NO_NETWORK_ACTIVITY
            - NO_LOCATION_UPDATE
            - ROAMING_NOT_ALLOWED
            - NO_SMS_MO_EVENT
            - NO_SMS_MT_EVENT
        timeRangeType:
          type: string
          enum:
            - RANGE_BEGINNING_OF_MONTH
            - RANGE_1_MONTH
            - RANGE_1_WEEK
            - RANGE_1_DAY
            - RANGE_1_HOUR
        eventType:
          type: string
          enum:

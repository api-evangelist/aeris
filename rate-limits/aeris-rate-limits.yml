applies_to: Aeris IoT Accelerator REST API (https://iot-api.aeris.com). Aeris states these limits apply to enterprise
  users of the IoT-A cloud environment.
limit_count: 44
scope: per-endpoint
exhaustion:
  status: 429
  reason: Too Many Requests
  retry_after_header: null
  note: Aeris documents 429 as the exhaustion status. No Retry-After header is documented; clients are told to read
    the X-RateLimit-Remaining-* headers instead.
response_headers:
- name: X-RateLimit-Limit-Second
  type: integer
  description: The maximum number of requests allowed in a second.
- name: X-RateLimit-Limit-Minute
  type: integer
  description: The maximum number of requests allowed in a minute.
- name: X-RateLimit-Remaining-Second
  type: integer
  description: The number of requests remaining in a second.
- name: X-RateLimit-Remaining-Minute
  type: integer
  description: The number of requests remaining in a minute.
header_note: Aeris states the rate-limit headers are returned on both 200 and 429 responses, so an agent can steer
  before it is throttled.

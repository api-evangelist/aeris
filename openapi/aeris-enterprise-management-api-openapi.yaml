    These are shown in the document Trademark Information.

    # Introduction

     This API provides a resource for getting information about
     enterprises and managing them.

     This API is rate-limited, exact limits
     are available in response message headers.

     # Important

     API audience must be prepared for compatible API extensions:

     - Be tolerant with
     unknown fields in the payload (see also Fowler’s \"TolerantReader\" post),
     i.e. ignore new fields but do not eliminate them from payload if needed
     for subsequent PUT requests.
     - Be prepared that \"x-extensible-enum\"
     return parameter may deliver new values. Either be agnostic or provide
     default behavior for unknown values.
     - Be prepared to handle HTTP status
     codes not explicitly specified in endpoint definitions.
     - Follow the
     redirect when the server returns HTTP status 301 Moved Permanently.

     # Deprecation

     API deprecation will be reflected in the OpenAPI definition.
     If a method on a path, a whole path or even a whole API endpoint
     (multiple paths) should be deprecated, they will be marked as deprecated.
     During deprecation phase, a Warning header (see RFC 7234 - Warning header)
     field will be added in the response. The warn-code will be 299 and the
     warn-text will inform about what is deprecated and when it will be
     completely removed.

     API audience should not start using a deprecated
     API.

     API audience is encouraged to monitor for Warning header.

    ## Scope

    This document covers the following topics:

    — An overview of the API

    — A detailed description of all operations offered by the API

    ## Prerequisites
    In this document, it is assumed that the user is familiar with the following:

    — Java Script Object Notation (JSON)

    — Basic understanding of REST web services

    — The [OpenAPI Initiative](https://www.openapis.org/) for the standardized format used in this document.

    ## Related Information
    The definition and explanation of acronyms and terminology and typographic conventions can be found in the following documents:

    — IoTA Glossary of Terms and Acronyms

    — Typographic Conventions

    # General API Guidelines

    ## Compatibility

    API audience must be prepared for compatible API extensions:

    - Be tolerant with unknown fields in the payload (see also Fowler’s "TolerantReader" post), i.e. ignore new fields but do not eliminate them from payload if needed for subsequent PUT requests.
    - Be prepared that "x-extensible-enum" return parameter may deliver new values. Either be agnostic or provide default behavior for unknown values.
    - Be prepared to handle HTTP status codes not explicitly specified in endpoint definitions.
    - Follow the redirect when the server returns HTTP status 301 Moved Permanently.

    ## Security

    This section describes the security measures in the API. Security measures include authentication, authorization, and encryption.

    ### Authentication and Authorization

    The API uses OAuth2 and OpenID Connect (OIDC) for authentication and authorization.

    All API endpoints require authentication, which is performed by passing a token in the Authorization header in each request, preceded by the word Bearer and a space. See the following example:
    ```
    curl -i -X GET "https://<baseURL>/iot/api/x-entities" -H "Content-Type: application/json" -H "Authorization: Bearer <TOKEN_GOES_HERE>"
    ```
    To fetch the token using e.g. curl, submit the following:
    ```
    curl -X POST "https://<baseURL>/iot/api/auth/token" -H "Accept: application/vnd.dcp-v1+json" -H "Content-Type: application/x-www-form-urlencoded" -d "grant_type=password&client_id=<client_id>&username=<username>&password=<password>"
    ```
    ### Encryption

    All API requests are encrypted using the HTTPS protocol to grant secure data transfer.

    ### Permission
    API permissions are authorized by authorization server based on the account roles. Required permissions for this API are documented in 'securitySchemes' section.
    You can view available permissions for your account through permission library in Service Portal by navigating Administration > Users & roles > Permission library > <PERMISSION_NAME>
    or Role administration > Actions > View permission library.

    Make sure permissions <PERMISSION_NAME> are available to your account before you start utilizing this API.

    
    ## Deprecation

    API deprecation will be reflected in the OpenAPI definition. If a method on a path, a whole path or even a whole API endpoint (multiple paths) should be deprecated, they will be marked as deprecated.
    During deprecation phase, a Deprecation header and a Sunset header fields will be added in the response.

    Example:
    ```
    Deprecation: Tue, 31 Dec 2024 23:59:59 GMT
    Sunset: Wed, 31 Dec 2025 23:59:59 GMT
    ```

    API audience should not start using a deprecated API.

    API audience is encouraged to monitor for Deprecation and Sunset header.

  contact:
    name: 'Aeris IoT SaaS'
    url: 'https://support.aeris.net/hc/en-us'
  x-audience: external-partner
  x-api-id: 30a38694-63dc-4fbd-8bed-5b8ffdfe0e19
servers:
  - url: 'https://iot-api.aeris.com/iot/api/ecm'
    description: 'Main API server'
paths:
  '/enterprises':
    get:
      tags:
        - Enterprise
      summary: 'List enterprises.'
      description: 'Lists all my enterprises.'
      operationId: getEnterprises
      parameters:
        - $ref: '#/components/parameters/tagsParam'
        - $ref: '#/components/parameters/pageNumber'
        - $ref: '#/components/parameters/size'
        - $ref: '#/components/parameters/template_sp_id'
      responses:
        '200':
          description: OK
          allOf:
            - $ref: '#/components/responses/RateLimitedResponse'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnterprisesRead'
            application/json;version=2.0.0:
              schema:
                $ref: '#/components/schemas/EnterprisesRead'
        '429':
          $ref: '#/components/responses/429'
        default:
          description: 'The standard http error codes will be given. 4XX for client errors and 5XX for server errors.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
        - oauth2:
            - css_manage_enterprise_hierarchy
    post:
      tags:
        - Enterprise
      summary: 'Create a new enterprise.'
      description: "Creates a new enterprise. Please note: after successful creation, the enterprise needs to be provisioned by setting the enterprise status to ''READY'' with [POST/enterprises/{enterprise_id}/statuses]()"
      operationId: createEnterprise
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnterpriseCreate'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Empty'
            application/json;version=2.0.0:
              schema:
                $ref: '#/components/schemas/Empty'
          allOf:
            - $ref: '#/components/responses/RateLimitedResponse'
        '429':
          $ref: '#/components/responses/429'
        default:
          description: 'The standard http error codes will be given.
            4XX for client errors and 5XX for server errors.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
        - oauth2:
            - css_manage_enterprise_hierarchy
  '/enterprises/{enterprise_id}':
    get:
      tags:
        - Enterprise
      summary: 'Get details of an enterprise.'
      operationId: getEnterpriseDetails
      parameters:
        - $ref: '#/components/parameters/enterpriseIdParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnterpriseDetail'
            application/json;version=2.0.0:
              schema:
                $ref: '#/components/schemas/EnterpriseDetail'
          allOf:
            - $ref: '#/components/responses/RateLimitedResponse'
        '429':
          $ref: '#/components/responses/429'
        default:
          description: 'The standard http error codes will be given.
            Usually 400,403,401,404 or 500.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
        - oauth2:
            - css_manage_enterprise_hierarchy
    put:
      tags:
        - Enterprise
      summary: 'Update an existing enterprise.'
      description: "Updates an existing enterprise. Please note: After
        successful update, the enterprise needs to be provisioned by setting
        the enterprise status to ''READY'' with
        [POST/enterprises/{enterprise_id}/statuses]()"
      operationId: updateEnterprise
      parameters:
        - $ref: '#/components/parameters/enterpriseIdParam'
        - name: If-Match
          in: header
          description: 'The RFC 7232 If-Match header field in a request
            requires the server to only operate on the resource that matches
            the provided entity-tag. This allows clients express a precondition
            that prevent the method from being applied if there have been any
            changes to the resource. See the response headers of GET
            /enterprises/enterprise_id for details about the entity-tag.'
          schema:
            type: string
            example: "11"
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnterpriseUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnterpriseDetail'
            application/json;version=2.0.0:
              schema:
                $ref: '#/components/schemas/EnterpriseDetail'
          allOf:
            - $ref: '#/components/responses/RateLimitedResponse'
        '412':
          description: 'Precondition Failed (entity-tag is missing or does not
            match the latest version)'
        '429':
          $ref: '#/components/responses/429'
        default:
          description: 'The standard http error codes will be given. 4XX for
            client errors and 5XX for server errors.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
        - oauth2:
            - css_manage_enterprise_hierarchy
  '/enterprises/{enterprise_id}/statuses':
    post:
      tags:
        - Enterprise
      summary: 'Change the status of the enterprise'
      description: "Changes the status of the enterprise by indicating the
        wanted status.\n\nSupported status changes:
        <table><tr><td><b>Current status</b><td><b>Wanted status</b>
        <td><b>Description</b></td></tr><tr><td>draft</td><td>ready</td>
        <td>Submit a draft version of the enterprise for provisioning.</td></tr>
        <tr><td>submitted</td><td>ready</td><td>Retry an earlier submit.
        </td></tr></table>

        \n\n Afterwards, use [GET/enterprises/{enterprise_id}]() to see the
        status of the enterprise. If the status does not become ''READY''
        within a couple of minutes, and provisioning_status is ''FAILURE'',
        try changing the status again."
      operationId: changeEnterpriseStatus
      parameters:
        - $ref: '#/components/parameters/enterpriseIdParam'
        - $ref: '#/components/parameters/statusParam'
        - name: If-Match
          in: header
          description: 'The RFC7232 If-Match header field in a request
            requires the server to only operate on the resource that matches
            at least one of the provided entity-tags. This allows clients
            express a precondition that prevent the method from being applied
            if there have been any changes to the resource.'
          schema:
            type: string
            example: "11"
      responses:
        '202':
          description: 'Request is being processed; use
            [GET/enterprises/{enterprise_id}]() to get the status of the
            enterprise.'
          allOf:
            - $ref: '#/components/responses/RateLimitedResponse'
        '412':
          description: 'Precondition Failed (entity-tag is missing or does
            not match the latest version)'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/429'
        default:
          description: 'The standard http error codes will be given.
            4XX for client errors and 5XX for server errors.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
        - oauth2:
            - css_manage_enterprise_hierarchy
  '/enterprises/{enterprise_id}/subscription-packages':
    get:
      tags:
        - Enterprise
      summary: 'List the subscription packages belonging to my enterprise.'
      operationId: getEnterpriseSubscriptionPackages
      parameters:
        - $ref: '#/components/parameters/enterpriseIdParam'
      responses:
        '200':
          description: OK
          allOf:
            - $ref: '#/components/responses/RateLimitedResponse'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionPackages'
            application/json;version=2.0.0:
              schema:
                $ref: '#/components/schemas/SubscriptionPackages'
        '429':
          $ref: '#/components/responses/429'
        default:
          description: 'The standard http error codes will be given. 4XX for
           client errors and 5XX for server errors.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
        - oauth2:
            - css_manage_enterprise_hierarchy
    post:
      tags:
        - Enterprise
      summary: 'Create subscription package for my enterprise'
      description: 'For given enterprise this function creates a subscription package'
      operationId: createSubscriptionPackage
      parameters:
        - $ref: '#/components/parameters/enterpriseIdParam'
        - $ref: '#/components/parameters/tspIdQuery'
      responses:
        '201':
          description: OK
          allOf:
            - $ref: '#/components/responses/RateLimitedResponse'
        '429':
          $ref: '#/components/responses/429'
        default:
          description: 'The standard http error codes will be given. 4XX for
            client errors and 5XX for server errors.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
        - oauth2:
            - css_manage_enterprise_hierarchy
  '/enterprises/{parent_enterprise_id}/offers':
    get:
      tags:
        - Enterprise
      summary: 'List the offers belonging to the certain parent enterprise'
      description: 'Note that parent enterprise type must be specific to which
        offers can be assigned. For example: Controller Reseller'
      operationId: getEnterpriseOffers
      parameters:
        - $ref: '#/components/parameters/parentEnterpriseIdParam'
        - $ref: '#/components/parameters/targetEnterpriseId'
      responses:
        '200':
          description: OK
          allOf:
            - $ref: '#/components/responses/RateLimitedResponse'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Offers'
            application/json;version=2.0.0:
              schema:
                $ref: '#/components/schemas/Offers'
        '429':
          $ref: '#/components/responses/429'
        default:
          description: 'The standard http error codes will be given. 4XX for
           client errors and 5XX for server errors.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
        - oauth2:
            - css_manage_enterprise_hierarchy
  '/enterprises/network-groups':
    get:
      tags:
        - Network group
      summary: 'List network groups.'
      description: 'List all network groups the user is allowed to view.'
      operationId: getNetworkGroups
      responses:
        '200':
          description: OK
          allOf:
            - $ref: '#/components/responses/RateLimitedResponse'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkGroupsRead'
            application/json;version=2.0.0:
              schema:
                $ref: '#/components/schemas/NetworkGroupsRead'
        '429':
          $ref: '#/components/responses/429'
        default:
          description: 'The standard http error codes will be given. 4XX for
            client errors and 5XX for server errors.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
        - oauth2:
            - css_view_resources
  '/enterprises/sim-specifications':
    get:
      tags:
        - SIM specification
      summary: 'List SIM specifications.'
      description: 'List all SIM specifications the user is allowed to view.'
      operationId: getSimSpecifications
      responses:
        '200':
          description: OK
          allOf:
            - $ref: '#/components/responses/RateLimitedResponse'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimSpecificationsRead'
            application/json;version=2.0.0:
              schema:
                $ref: '#/components/schemas/SimSpecificationsRead'
        '429':
          $ref: '#/components/responses/429'
        default:
          description: 'The standard http error codes will be given.4XX for client errors and 5XX for server errors.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
        - oauth2:
            - css_view_resources
  '/enterprises/subscription_packages/{subscription_package_id}/deactivate':
    post:
      tags:
        - Enterprise
      summary: 'Deactivate the subscription package'
      description: "Deactivates the subscription package with the given ID"
      operationId: deactivateSubscriptionPackage
      parameters:
        - $ref: '#/components/parameters/spIdToDeactivate'
      responses:
        '202':
          description: 'Request is being processed'
          allOf:
            - $ref: '#/components/responses/RateLimitedResponse'
        '429':
          $ref: '#/components/responses/429'
        default:
          description: 'The standard http error codes will be given.
            4XX for client errors and 5XX for server errors.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
        - oauth2:
            - css_deprecate_subscription_package
  '/enterprises/enterprise_groups/{enterprise_group_id}':
    get:
      tags:
        - EnterpriseGroup
      summary: 'Get details of an enterprise group.'
      operationId: getEnterpriseGroupDetails
      parameters:
        - $ref: '#/components/parameters/enterpriseGroupIdParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnterpriseGroupDetail'
            application/json;version=2.0.0:
              schema:
                $ref: '#/components/schemas/EnterpriseGroupDetail'
          allOf:
            - $ref: '#/components/responses/RateLimitedResponse'
        '429':
          $ref: '#/components/responses/429'
        default:
          description: 'The standard http error codes will be given.
            Usually 400,403,401,404 or 500.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
        - oauth2:
            - css_view_enterprise_groups
    put:
      tags:
        - EnterpriseGroup
      summary: 'Update an existing enterprise group.'
      description: "Updates an existing enterprise group."
      operationId: updateEnterpriseGroup
      parameters:
        - $ref: '#/components/parameters/enterpriseGroupIdParam'
        - name: If-Match
          in: header
          description: 'The RFC 7232 If-Match header field in a request
            requires the server to only operate on the resource that matches
            the provided entity-tag. This allows clients express a precondition
            that prevent the method from being applied if there have been any
            changes to the resource. See the response headers of GET
            /enterprises/enterprise_id for details about the entity-tag.'
          schema:
            type: string
            example: "11"
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnterpriseGroupUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnterpriseGroupDetail'
            application/json;version=2.0.0:
              schema:
                $ref: '#/components/schemas/EnterpriseGroupDetail'
          allOf:
            - $ref: '#/components/responses/RateLimitedResponse'
        '412':
          description: 'Precondition Failed (entity-tag is missing or does not match the latest version)'
        '429':
          $ref: '#/components/responses/429'
        default:
          description: 'The standard http error codes will be given. 
            4XX for client errors and 5XX for server errors.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
        - oauth2:
            - css_manage_enterprise_hierarchy
            - css_manage_enterprise_groups
components:
  parameters:
    enterpriseIdParam:
      in: path
      name: enterprise_id
      description: 'The id of the requested enterprise. May be either
        organizationID or the deprecated customerNo.'
      required: true
      schema:
        type: string
        minLength: 3
        maxLength: 255
        example: 1.2.3.44
    parentEnterpriseIdParam:
      in: path
      name: parent_enterprise_id
      description: 'The id of the requested parent enterprise.May be either
        organizationID or the deprecated customerNo.'
      required: true
      schema:
        type: string
        minLength: 3
        maxLength: 255
        example: 1.2.3.44
    tspIdQuery:
      in: query
      name: subscription_package_template_id
      description: 'The id of the subscription package template'
      required: true
      schema:
        type: integer
        format: int64
    tagsParam:
      in: query
      name: tags
      description: "Filter the response based on tags. Matching is exact and
        case sensitive. If multiple tags are applied only resources matching
        all filters will be returned (logical 'AND')\n"
      schema:
        type: string
      example: 'business:finance'
    statusParam:
      in: query
      name: enterprise_status
      description: 'The status of an enterprise.'
      required: true
      schema:
        type: string
        x-extensible-enum:
          - READY
        default: 'READY'
        example: 'READY'
    pageNumber:
      in: query
      name: page_number
      description: 'Page number to display list of enterprises'
      schema:
        type: integer
        minimum: 1
        maximum: 99999
        example: 1
        default: 1
    size:
      in: query
      name: size
      description: 'Number of enterprises to be displayed on a page'
      schema:
        type: integer
        minimum: 0
        maximum: 999
        example: 10
        default: 100
    template_sp_id:
      in: query
      name: template_sp_id
      description: 'The id(s) of the Subscription Package Template(s)'
      schema:
        type: array
        items:
          type: integer
          format: int64
        example: 528491, 67534
    targetEnterpriseId:
      in: query
      name: target_enterprise_id
      description: 'The id of the targeted enterprise which should be under a
        parent Enterprise. May be either organizationID or the deprecated
        customerNo. This Id helps to filter out the results specific to the
        target Enterprise only'
      schema:
        type: string
        minLength: 3
        maxLength: 255
        example: 1.2.3.44
    spIdToDeactivate:
      in: path
      name: subscription_package_id
      description: 'The id of the subscription package to deactivate'
      required: true
      schema:
        type: integer
        format: int64
    enterpriseGroupIdParam:
      in: path
      name: enterprise_group_id
      description: 'The id of the requested enterprise group.'
      required: true
      schema:
        type: string
        minLength: 3
        maxLength: 255
        example: 1.2.3.44
  responses:
    RateLimitedResponse:
      headers:
        X-RateLimit-Limit-Second:
          $ref: '#/components/headers/X-RateLimit-Limit-Second'
        X-RateLimit-Limit-Minute:
          $ref: '#/components/headers/X-RateLimit-Limit-Minute'
        X-RateLimit-Remaining-Second:
          $ref: '#/components/headers/X-RateLimit-Remaining-Second'
        X-RateLimit-Remaining-Minute:
          $ref: '#/components/headers/X-RateLimit-Remaining-Minute'
        Content-Type:
          $ref: '#/components/headers/Content-Type'
    '429':
      description: Too Many Requests
      allOf:
        - $ref: '#/components/responses/RateLimitedResponse'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemGeneric'
          example:
            type: about:blank
            title: Too Many Requests
            status: 429
            detail: Too Many Requests. Please refer response RateLimit-* headers before send requests.
            instance: about:blank
  schemas:
    ProblemGeneric:
      type: object
      properties:
        type:
          type: string
          format: uri
          description: |
            An absolute URI that identifies the problem type. When dereferenced,
            it SHOULD provide human-readable documentation for the problem type
            (e.g., using HTML).
          default: about:blank
          example: https://your.api.documentation.url
        title:
          type: string
          description: |
            A short, summary of the problem type. Written in english and readable
            for engineers (usually not suited for non technical stakeholders and
            not localized);
          example: Service Unavailable
        status:
          type: integer
          format: int32
          description: |
            The HTTP status code generated by the origin server for this occurrence
            of the problem.
          minimum: 100
          maximum: 600
          example: 503
        detail:
          type: string
          description: |
            A human readable explanation specific to this occurrence of the
            problem.
          example: Connection to database timed out
        instance:
          type: string
          description: |
            An absolute URI that identifies the specific occurrence of the problem.
            It may or may not yield further information if dereferenced.
          default: about:blank
          example: /iot/api/problems/123e4567-e89b-12d3-a456-426614174000
    EnterprisesRead:
      type: object
      properties:
        enterprises:
          type: array
          # maxItems: ?
          items:
            $ref: '#/components/schemas/EnterpriseRead'
        other_enterprises_available:
          type: boolean
          description: 'Inform the user whether there are more enterprises to be displayed'
          default: true
    EnterpriseRead:
      type: object
      properties:
        id:
          type: string
          description: 'Enterprise ID.'
          minLength: 3
          maxLength: 255
          example: 1.2.3.44
        customer_number:
          deprecated: true
          type: string
          description: 'Legacy identifier for the enterprise. API clients
            should start transitioning to use id instead as the customer_number
            will be removed. Date of removal is not yet known; notice will be
            given at least 6 months before.'
          minLength: 8
          maxLength: 8
          example: '02000044'
        parent_number:
          deprecated: true
          type: string
          description: 'Legacy identifier for the enterprise''s parent. API
            clients should start transitioning to use id instead as the
            parent_number will be removed, and id contains the parent ID. Date
            of removal is not yet known; notice will be given at least 6 months
            before.'
          maxLength: 255
          example: '02000001'
        parent_id:
          type: string
          description: 'ID of the parent organization'
          maxLength: 255
          example: 1.2.3
        name:
          type: string
          description: 'Enterprise name.'
          minLength: 1
          maxLength: 80
          example: MyCompany
        description:
          type: string
          nullable: true
          description: 'Enterprise description.'
          maxLength: 255
          example: 'MyCompany description'
        enterprise_type:
          description: 'Type of the enterprise.'
          type: string
          x-extensible-enum:
            - ENTERPRISE
            - ADVANCED_RESELLER
            - CONTROLLED_RESELLER
          default: ENTERPRISE
          example: ENTERPRISE
        created_at:
          type: string
          description: 'The time when the enterprise was created (ISO 8601 UTC)'
          example: '2019-06-28T00:00:00.000Z'
        status:
          $ref: '#/components/schemas/Status'
        provisioning_status:
          $ref: '#/components/schemas/ProvisioningStatus'
        tags:
          type: array
          description: "A list of API consumer defined text strings that can be used to further describe an enterprise."
          maxItems: 10
          items:
            type: string
          example:
            - 'business:finance'
            - 'market:europe'
        template_sp_id:
          type: array
          description: "A list of template subscription package id are used for an enterprise."
          items:
            type: integer
            format: int64
          example:
            - '1231'
            - '1232'
      required:
        - id
        - parent_id
        - name
        - created_at
        - status
    EnterpriseDetail:
      allOf:
        - $ref: '#/components/schemas/EnterpriseRead'

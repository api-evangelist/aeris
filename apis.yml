    url: https://iotdeveloper.aeris.net/hc/en-us/articles/25348587487644-SMS-Messaging-API-v2
  - type: OpenAPI
    url: openapi/aeris-sms-messaging-api-openapi.yaml
- name: Aeris IoT Watchtower API
  description: 'IoT security API for the Aeris IoT Watchtower product: device groups, applications, gateways,
    flows and activity logs, event configuration and policies, enforcement rules, protection policies,
    rate limiters, location lists and security reporting. Uses OAuth 2.0 client credentials, an Idempotency-Key
    header on gateway writes, and an RFC 7807 problem+json error envelope.'
  image: https://www.aeris.com/wp-content/uploads/cropped-Favicon-16x16-1-192x192.png
  humanURL: https://iotdeveloper.aeris.net/hc/en-us/articles/25348562311580-Aeris-IoT-Watchtower-API-0-6-0
  baseURL: https://watchtower-api-prd.aeriscloud.com

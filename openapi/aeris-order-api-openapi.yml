        in: query
        description: Company ID
        required: true
        schema:
          type: string
      - name: ignoreServiceContracts
        in: query
        description: If true service contracts will not be returned.
        schema:
          type: string
      - name: ignoreDeliveryAddresses
        in: query
        description: If true delivery addesses will not be returned.
        schema:
          type: string
      - name: ignoreSimSpecifications
        in: query
        description: If true sim specifications will not be returned.
        schema:
          type: string
      - name: ignoreMsisdnPools
        in: query
        description: If true MSISDN pools for sim specifications will not be returned.
        schema:
          type: string
      responses:
        '200':
          description: Query succeeded.
          content:
            application/vnd.dcp-v1+json:
              schema:
                $ref: '#/components/schemas/SIMOrderMetadataResponse'
        '400':
          description: Invalid arguments for the operation.
          content:
            application/vnd.dcp-v1+json:
              schema:

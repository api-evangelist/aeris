not_claimed_note: Aeris runs a substantial eSIM/eUICC surface — eUICC Setup, eIM Info and eIM ECO Operations — which
  is the natural home for a GSMA SGP.22 or SGP.32 conformance claim, and Order Management and Resource Inventory
  are the natural home for TM Forum TMF622/TMF639. No published contract cites any of them, so none is recorded.
  This is a gap in what Aeris declares, not an assertion that the implementations diverge.

  /euiccs/{id}/localization:
    post:
      tags:
      - Localization
      summary: Initiate localization of an eUICC
      description: 'Initiates the localization of an eUICC to the specified locale and returns details of the service request. Relocalization of eUICCs is also supported, which means assigning an already localized eUICC to another locale.


        Relocalization requires the user to have a separate permission. In addition, any localization limits defined in the DCP Service Portal also apply when attempting localization through the Device Localization API.'
      operationId: localizeV1
      parameters:
      - name: id
        in: path
        description: 20-30 or 32 hexadecimal digit eUICC ID
        required: true
        schema:
          type: string
      - name: localeId
        in: query
        description: Locale ID
        schema:
          type: string
      - name: companyId
        in: query
        description: Company ID of the requester
        required: true
        schema:
          type: string
      - name: localizationTableId
        in: query
        description: Localization table ID (not used)
        schema:
          type:
          - integer
          - 'null'
          format: int64
      - name: executorEimId
        in: query
        description: Executor EIM ID
        required: false
        schema:
          type: string
      - name: downloadMode
        in: query
        description: Download mode. Allowed values DIRECT and INDIRECT. Defaults to DIRECT if not specified.
        required: false
        schema:
          type: string
          enum:
          - DIRECT
          - INDIRECT
      responses:
        '200':
          description: Request completed successfully.
          content:
            application/vnd.dcp-v1+json:
              schema:
                $ref: '#/components/schemas/ServiceRequestResponse'
        '400':

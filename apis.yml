- name: Aeris IoT Accelerator SOAP API
  description: The legacy SOAP/WSDL service portal API of the IoT Accelerator platform, covering subscription
    management, trigger and bundle package management, aggregated and subscription traffic, usage data
    download, report download, incident and service-request management, realtime trace, operator info,
    device reconnect and API status. Aeris documents this surface as deprecated in favour of the REST
    equivalents; the WSDLs remain published.

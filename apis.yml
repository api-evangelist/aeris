- name: Aeris IoT Accelerator SMS Messaging API
  description: RESTful SMS messaging API for sending mobile-terminated SMS to devices, retrieving delivery
    status, and retrieving inbound mobile-originated messages for a registration. The contract states
    it is based on the OneAPI SMS interface and OMA REST NetAPIs v1, and uses the standard /smsmessaging/v1/outbound/{senderAddress}/requests
    resource shape. Authenticates with HTTP Basic.
  image: https://www.aeris.com/wp-content/uploads/cropped-Favicon-16x16-1-192x192.png
  humanURL: https://iotdeveloper.aeris.net/hc/en-us/articles/25348587487644-SMS-Messaging-API-v2
  baseURL: https://sms.iot-api.aeris.com/dcpapi/smsmessaging/v1
  tags:
  - SMS Messaging
  - IoT
  - Telecom
  - M2M
  properties:

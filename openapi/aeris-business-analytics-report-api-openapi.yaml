paths:
  '/reports':
    get:
      tags:
        - Reports
      summary: Query report data files
      description: >
        Returns a list of report data files that can be downloaded.
      operationId: QueryReports
      parameters:
        - name: fromDate
          in: query
          description: >
            Specifies the earliest date from which reports are requested. The input of fromData is set according to RFC 3339 standard in UTC time.
          required: false
          schema:
            type: string
            format: date-time
            example: '2022-04-20T01:01:01Z'
        - name: toDate
          in: query
          description: >
            Specifies the latest date from which reports are requested. The input of toData is set according to RFC 3339 standard in UTC time.
          required: false
          schema:
            type: string
            example: '2022-04-20T01:01:01Z'
        - name: limit
          in: query
          required: false
          description: >
            Specifies the maximum number of entries to return. If the value exceeds the maximum, then the errror will be returned.
            If this parameter is not specified, the default value will be used.
          schema:
            type: integer
            format: int32
            example: 10000
            default: 10000
            minimum: 1
            maximum: 10000
        - name: offset
          in: query
          required: false
          description: >
            Specifies the offset of the first item in the collection to return. If the value exceeds the total count of result, empty result will be returned.
          schema:
            type: integer
            format: int32
            example: 0
            default: 0
            minimum: 0
        - name: customerNo
          in: query
          required: false
          description: |
            Specifies the customer number of the related organization. If this parameter is not specified, default organizationId from token will be used as query and validated with organization id field in DB.
            If both organizationId and customerNo are provided when query, organizationId will be used as query criteria and validate with customerNo field in DB.
            If none of organizationId or customerNo is provided when query, default organizationId from token will be used as query and validated with organization id field in DB.
          schema:
            type: string
            example: '99887766'
        - name: organizationId
          in: query
          required: false
          description: |
            Specifies the organization ID number of the related organization. If this parameter is not specified, customerNo field in DB will be used as query.
            If both organizationId and customerNo are provided when query, organizationId will be used as query criteria and validate with customerNo field in DB.
            If none of organizationId or customerNo is provided when query, default organizationId from token will be used as query and validate with organization id field in DB.
            ID of the organization could be a fix number e.g. “1.2.3” or it can contain ‘*’ as a wildcard in the following way:
            - '1.2.*' will filter all organization whose id starts with 1.2 but not the parent 1.2 itself
            - '1.2*' will filter all organizations whose id starts with 1.2 and include the parent 1.2 itself
          schema:
            type: string
            example: '3.78.2'
        - name: reportType
          in: query
          required: false
          description: >
            Specifies the type of reports to retrieve. If this parameter is specified, only reports of that type are returned.
            If this parameter is not specified, then reports for all types are returned.
          schema:
            $ref: "#/components/schemas/ReportTypeEnum"
      responses:
        '200':
          allOf:
            - $ref: '#/components/responses/RateLimitedResponse'
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryReportsResponse'
        '400':
          $ref: '#/components/responses/400Response'
        '401':
          $ref: '#/components/responses/401Response'
        '403':
          $ref: '#/components/responses/403Response'
        '429':
          $ref: '#/components/responses/429Response'
        '500':
          $ref: '#/components/responses/500Response'
        default:
          $ref: '#/components/responses/500Response'
      security:
        - Oauth2_auth:
            - cnx_report_download_operator
            - cnx_report_download_operator_2
            - cnx_report_download_opco
            - cnx_report_download_opco_2
            - cnx_report_download
            - cnx_report_download_2
            - cnx_report_download_no_invoice
            - cnx_report_download_no_invoice_2

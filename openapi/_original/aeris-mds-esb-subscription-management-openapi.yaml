openapi: 3.0.1
info:
  title: Subscription Management API
  description: |-
    Endpoints requiring authentication are indicated with a lock icon, which is performed by passing a token in the 'X-Access-Token' header in each request.

    The token can be acquired using the /login or /login-form endpoints documented below. The login response also contains the token expiration time in milliseconds. For prolonged interaction with the API, a new token can be reissued before expiration using the /token-reissue endpoint. HTTP status 401 will be returned in case of missing, expired or invalid token.

    Note that this documentation page will handle the token automatically after logging in with either of the login endpoints.
  version: 1.0.1
  x-audience: external-public
servers:
- url: /dcpapi/rest/subscriptionManagement/v1
tags:
- name: Login
- name: Order
- name: 'SubscriptionInventory '
paths:
  /token-reissue:
    post:
      tags:
      - Login
      summary: Reissue access token.
      description: Returns a new token.
      operationId: reissueToken
      responses:
        "200":
          description: Token reissued successfully.
          content:
            application/vnd.dcp-v1+json:
              schema:
                $ref: '#/components/schemas/TokenReissue'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "503":
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - token: []
  /login-form:
    post:
      tags:
      - Login
      summary: Sign in to the API.
      description: Sign in and authenticate the user.
      operationId: formLoginV1
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              required:
              - password
              - username
              type: object
              properties:
                username:
                  type: string
                  description: Username
                password:
                  type: string
                  description: Password
                  format: password
        required: true
      responses:
        "200":
          description: Logged in successfully.
          content:
            application/vnd.dcp-v1+json:
              schema:
                $ref: '#/components/schemas/Login'
        "401":
          description: Invalid credentials.
          content:
            application/vnd.dcp-v1+json:
              schema:
                $ref: '#/components/schemas/Error'
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "503":
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /login:
    post:

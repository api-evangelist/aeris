    Offers:
      type: object
      properties:
        offers:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/Offer'
    Offer:
      type: object
      allOf:
        - $ref: '#/components/schemas/BasicData'
        - properties:
            sim_specifications:
              type: array
              maxItems: 100
              items:
                $ref: '#/components/schemas/SimSpecification'
            form_specifications:
              type: array
              maxItems: 100
              items:
                $ref: '#/components/schemas/FormSpecification'
            profile_specifications:
              type: array
              maxItems: 100
              items:
                $ref: '#/components/schemas/ProfileSpecification'
            network_groups:
              type: array
              maxItems: 100
              items:
                $ref: '#/components/schemas/BasicData'
            sp_templates:
              type: array
              maxItems: 100
              items:
                $ref: '#/components/schemas/TemplateSubscriptionPackage'
            price:
              $ref: '#/components/schemas/price'
            order_limit:
              type: integer
              format: int64
            tsp_price_profile_linkage:
              $ref: '#/components/schemas/TpsPriceMap'
    price:
      type: object
      properties:
        plan_id:
          type: string
          maxLength: 50
          example: PP123456789
        description:
          type: string
          nullable: true
          maxLength: 255
          example: 'My Price Highlights'
        profile_ids:
          type: string
          maxLength: 255
          example: 'profileid1,profileid2'
        plan_name:
          type: string
          maxLength: 255
          example: 'My Price Plan'
    TpsPriceMap:
      type: object
      additionalProperties:
        type: string
        description: 'Mapping of SP Template name to Price Profile Name'
      example:
        TPS Example-1: 'Example Price Profile Name'
        TPS Example-2: 'Example Price Profile Name'
    TemplateSubscriptionPackage:
      type: object
      allOf:
        - $ref: '#/components/schemas/BasicData'
        - $ref: '#/components/schemas/SubscriptionPackageBase'
        # - properties:
        #     service_contract_id:
        #       type: string
        #       minLength: 7
        #       maxLength: 30
        #       example: 123_SC_45
    CamelProfile:
      type: object
      allOf:
        - $ref: '#/components/schemas/BasicData'
        - properties:
            camel_profile_id:
              type: integer
              maximum: 8160
              example: 5005
          required:
            - camel_profile_id
    BasicData:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          example: 'My resource'
        internal_id:
          type: integer
          format: int64
        description:
          type: string
          nullable: true
          maxLength: 500
          example: Descriptive information
        status:
          $ref: '#/components/schemas/Status'
        provisioning_status:
          $ref: '#/components/schemas/ProvisioningStatus'
      required:
        - name
    NetworkGroupsRead:
      type: object
      properties:
        network_groups:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/NetworkGroupRead'
    NetworkGroupRead:
      type: object
      allOf:
        - $ref: '#/components/schemas/BasicData'
    SimSpecificationsRead:
      type: object
      properties:
        sim_specifications:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/SimSpecification'
    Status:
      type: string
      description: 'Status of the entity'
      x-extensible-enum:
        - DRAFT
        - READY
        - INVALID
        - SUBMITTED
        - OBSOLETE
      example: READY
    ProvisioningStatus:
      type: string
      description: 'Provisioning status of the entity'
      x-extensible-enum:
        - NONE
        - PENDING
        - STARTED
        - SUCCESS
        - FAILURE
      example: SUCCESS
    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri
          description: "An absolute URI that identifies the problem type.
            When dereferenced,it SHOULD provide\nhuman-readable documentation
            for the problem type (e.g., using HTML).\n"
          default: 'about:blank'
          example: 'http://www.w3.org/Protocols/rfc2616/rfc2616-sec10.html#sec10.5.4'
        title:
          type: string
          description: "A short, summary of the problem type. Written in
            english and readable for engineers (usually not suited\nfor non
            technical stakeholders and not localized.\n"
          example: 'Service Unavailable'
        status:
          type: integer
          format: int32
          description: 'The HTTP status code generated by the origin server
            for this occurrence of the problem.'
          minimum: 100
          maximum: 600
          exclusiveMaximum: true
          example: 503
        detail:
          type: string
          description: 'A human readable explanation specific to this
            occurrence of the problem.'
          example: 'Connection to database timed out.'
        instance:
          type: string
          description: 'An absolute URI that identifies the specific
            occurrence of the problem. It may or may not yield further
            information if dereferenced.'
          example: 'https://api.documentation.url/request-id'
    Empty:
      type: string
    EnterpriseGroupWrite:
      type: object
      properties:
        companies:
          type: array
          description: "dcpIds of companies to be in the enterprise group.\n"
          items:
            type: integer
            format: int64
      required:
        - companies
    EnterpriseGroupUpdate:
      allOf:
        - $ref: '#/components/schemas/EnterpriseGroupWrite'
    EnterpriseGroupRead:
      type: object
      properties:
        group_id:
          type: string
          description: "group ID of the enterprise group."
          minLength: 1
          maxLength: 255
          example: 0.1
        parent_group_id:
          type: string
          description: "group ID of the parent."
          minLength: 1
          maxLength: 255
          example: 0.1
        enterprise_group_type:
          description: 'ADVANCED_RESELLER, CONTROLLED_RESELLER or ENTERPRISE'
          type: string
          x-extensible-enum:
            - ADVANCED_RESELLER
            - CONTROLLED_RESELLER
            - ENTERPRISE
          example: ENTERPRISE
        lead_organization:
          type: string
          description: "ID of the lead organization."
          minLength: 1
          maxLength: 255
          example: 1.2.3.44
        companies:
          type: array
          description: "The list of companies within the enterprise group.\n"
          items:
            $ref: '#/components/schemas/EnterpriseRead'
    EnterpriseGroupDetail:
      allOf:
        - $ref: '#/components/schemas/EnterpriseGroupRead'
  securitySchemes:
    oauth2:
      type: oauth2
      description: 'The Enterprise API uses OAuth2 and OIDC for authentication
        and authorization.'
      flows:
        password:
          tokenUrl: 'https://iot-api.aeris.com/iot/api/auth/token'
          scopes:
            css_manage_enterprise_hierarchy: 'Grants access to read, create and
             update enterprise and subscription package information.'
            css_view_resources: 'Grants access to read resource information.'
  headers:
    Content-Type:
      description: Handle Content-Type
      schema:
        type: string
    X-RateLimit-Limit-Second:
      description: The maximum number of requests allowed in a second.
      schema:
        type: integer
        format: int32
    X-RateLimit-Limit-Minute:
      description: The maximum number of requests allowed in a minute.
      schema:
        type: integer
        format: int32
    X-RateLimit-Remaining-Second:
      description: The number of requests remaining in a second.
      schema:
        type: integer
        format: int32
    X-RateLimit-Remaining-Minute:
      description: The number of requests remaining in a minute.
      schema:
        type: integer
        format: int32
